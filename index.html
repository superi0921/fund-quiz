ubjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2026年5月","type":"single","stem":"【考试原题】对于风险厌恶的投资者，其无差异曲线的斜率方向是（）。","options":[{"key":"A","text":"从左下方到右上方倾斜"},{"key":"B","text":"垂直方向"},{"key":"C","text":"水平方向"},{"key":"D","text":"从左上方到右下方倾斜"}],"answer":"A","explain":"风险厌恶的投资者承担更高风险时必须获得更高的预期收益补偿，因此其无差异曲线由左下方向右上方倾斜，故选A。水平或垂直方向不符合风险与收益的同向关系。","chapter":"无差异曲线形态","disputed":false,"source":{"title":"2026年5月基金从业《证券投资基金》真题考点：无差异曲线-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202606/22164427419603.html"}},{"id":"k2-0018","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2026年5月","type":"single","stem":"【考试原题】以下不属于基金会计核算内容的是（）","options":[{"key":"A","text":"基金申购与赎回情况"},{"key":"B","text":"基金经理奖金"},{"key":"C","text":"基金持有股票的配股情况"},{"key":"D","text":"基金会计报表附注内容"}],"answer":"B","explain":"基金会计核算的对象是基金资产的运作与收益，包括份额申赎情况、持股的配股等权益变动以及报表附注内容；基金经理奖金属于公司自身的薪酬支出，不由基金资产核算，故选B。","chapter":"基金会计核算内容","disputed":false,"source":{"title":"2026年5月基金从业《证券投资基金》真题考点：基金会计核算-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202606/25164903840808.html"}},{"id":"k2-0019","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2026年5月","type":"single","stem":"以下各类基金中，对汇率变动最敏感的是（）","options":[{"key":"A","text":"股票基金"},{"key":"B","text":"QDll"},{"key":"C","text":"货币基金"},{"key":"D","text":"QFll"}],"answer":"B","explain":"QDII基金投资于境外市场，资产以外币计价，需折算为人民币，汇率波动直接改变基金净值，因此对汇率变动最为敏感，故选B。境内股票基金、货币基金基本不涉及汇率敞口。","chapter":"汇率风险敏感基金","disputed":false,"source":{"title":"2026年5月基金从业《证券投资基金》考试真题及答案已更新-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202605/12113540836766.html"}},{"id":"k2-0020","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2026年1月","type":"single","stem":"2006年和2007年上证综指一路飘红，最高达到6124点，那个时候市场上的主要投资于股票的基金业绩表现大部分都很好，和2008年受美国次贷金融危机和东南亚金融危机的影响，国内故事一路下挫，上证综指也不例外，一路下跌最低到1664点，那一年市场上主要投资于市场股票的基金大部分都亏损严重，将2007年和2008年的同类基金放在一起比较评价是缺乏意义的，这体现了基金业绩评价对以下哪个因素的考虑?()","options":[{"key":"A","text":"成立时间"},{"key":"B","text":"综合考虑风险的收益"},{"key":"C","text":"时间期间"},{"key":"D","text":"存续期长度"}],"answer":"C","explain":"2007年牛市与2008年熊市中股票基金业绩差异主要源于市场环境不同，将不同市场阶段的数据直接对比缺乏意义，这体现的是业绩评价必须考虑时间期间的可比性，故选C。","chapter":"基金业绩评价可比性","disputed":false,"source":{"title":"2026年1月基金从业《证券投资基金基础知识》考试真题答案更新-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/22164853330150.html"}},{"id":"k2-0021","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2026年1月","type":"single","stem":"某投资者希望在特定日期。按照市场情况自主决定是否以特定价格买入某标的资产，该投资者应该选择()。","options":[{"key":"A","text":"远期合约"},{"key":"B","text":"期权合约"},{"key":"C","text":"互换合约"},{"key":"D","text":"期货合约"}],"answer":"B","explain":"投资者希望在到期日按市场情况自主决定是否按约定价格买入标的资产，即拥有买或不买的权利而无履约义务，这正是看涨期权（买方权利）的特征，故选B。远期和期货合约负有到期履约义务。","chapter":"期权合约特点","disputed":false,"source":{"title":"2026年1月基金从业《证券投资基金基础知识》考试真题答案更新-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/22164853330150.html"}},{"id":"k2-0022","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2026年1月","type":"single","stem":"封闭式基金至少()在规定网站披露一次基金资产净值和基金份额净净值。","options":[{"key":"A","text":"每周"},{"key":"B","text":"每月"},{"key":"C","text":"每季度"},{"key":"D","text":"每个交易日"}],"answer":"A","explain":"封闭式基金应至少每周在规定网站披露一次基金资产净值和基金份额净值，故选A。每个交易日的净值披露要求适用于开放式基金。","chapter":"封闭式基金净值披露","disputed":false,"source":{"title":"2026年1月基金从业《证券投资基金基础知识》考试真题答案更新-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/22164853330150.html"}},{"id":"k2-0023","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于主动型股票投资组合管理，以下说法正确的是（）。I、偏好成长风格的基金经理会买相对便宜的股票，期望其估值恢复到合理水平II、自下而上的投资策略侧重个股挖掘，通过深入分析筛选优质股票，而不依赖市场的整体趋势III、有的基金产品没有明确的行业或风格偏好，基金经理可通过对当前市场形势的研究和判断，自主决定行业和风格的配置IV、市场择时策略试图通过预测市场的整体走向，在不同资产类别之间或同一资产类别内部的不同风格之间进行动态配置V、在选择个股中，技术分析主要研究公司的财务状况、管理团队、行业地位和增长前景","options":[{"key":"A","text":"II、III、IV"},{"key":"B","text":"I、IV、V"},{"key":"C","text":"I、II、III"},{"key":"D","text":"II、V"}],"answer":"A","explain":"自下而上策略侧重个股挖掘，不依赖市场整体趋势；没有明确风格偏好的基金可由基金经理研判市场后自主决定行业与风格配置；市场择时策略则通过预测市场走向在资产或风格间动态调整，故Ⅱ、Ⅲ、Ⅳ正确。买便宜股票期待估值修复是价值风格而非成长风格，故Ⅰ错；技术分析研究价格与成交量，研究财务与管理层的是基本面分析，故Ⅴ错。","chapter":"主动股票投资组合管理","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：主动型股票投资组合管理-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/21174906635271.html"}},{"id":"k2-0024","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】普通投资者主动要求购买风险等级超出其风险承受能力的基金产品或服务时，基金销售机构应遵循规定的程序，以下程序错误的是（）","options":[{"key":"A","text":"以纸质及电子文件的方式向其进行特别警示，告知其资产品或服务风险高于其承受能力"},{"key":"B","text":"对其进行资格审核，确认其不属于风险承受能力最低类别投资者，也没有违反投资者准入性规定"},{"key":"C","text":"履行特别警示义务后，普通投资者仍坚持购买该产品或者服务的，可以向其销售相关产品或者提供相关服务"},{"key":"D","text":"建议投资者重新填写风险承受能力评估问卷，若测评结果依然低于该产品或服务的风险等级，则不得向其销售"}],"answer":"D","explain":"销售机构可以建议投资者重新填写风险测评问卷，但测评后风险等级仍低于产品的，只要投资者完成特别警示与确认程序并坚持购买，仍可以在履行程序后销售产品，因此D说不得销售是错误的程序表述。","chapter":"超出风险承受能力销售程序","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：基金销售机构应遵循规定的程序-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/13112836338894.html"}},{"id":"k2-0025","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于公募基金募集期限，下列表述正确的是（）。","options":[{"key":"A","text":"基金管理人应当自收到准予注册文件之日起3个月内进行基金份额的发售，募集期限一般不得超过3个月"},{"key":"B","text":"基金管理人应当自收到准予注册文件之日起3个月内进行基金份额的发售，募集期限一般不得超过6个月"},{"key":"C","text":"基金管理人应当自收到准予注册文件之日起6个月内进行基金份额的发售，募集期限一般不得超过6个月"},{"key":"D","text":"基金管理人应当自收到准予注册文件之日起6个月内进行基金份额的发售，募集期限一般不得超过3个月"}],"answer":"D","explain":"基金管理人应自收到准予注册文件之日起6个月内进行基金份额发售，募集期限一般不得超过3个月，故选D。发售起始期限与募集期限两个数字容易混淆，需分别记忆。","chapter":"公募基金募集期限","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：公募基金募集期限-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/05140455545071.html"}},{"id":"k2-0026","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】另类投资可以为投资组合带来显著的多元化效应，关于其具体含义，以下表述错误的是（）。","options":[{"key":"A","text":"股票市场下行期间，不动产或大宗商品等另类资产经常呈现不同的价格走势，在任何市场条件下都可以用来平衡投资组合整体表现"},{"key":"B","text":"某些另类投资（如特定类型的对冲基金）本身与股票市场高度相关，无法提供有效的多元化保护"},{"key":"C","text":"投资组合中纳入另类投资可能有助于降低整体风险和波动性"},{"key":"D","text":"另类投资与传统资产类别（如股票和债券）的相关性通常较低，有时甚至呈负相关"}],"answer":"A","explain":"另类投资与传统资产相关性较低，纳入组合有助于降低整体风险，但不能夸大其作用：并非在任何市场条件下都能起到平衡组合表现的作用，A以绝对化表述作出承诺，故错误。B、C、D的表述符合另类投资的实际特征。","chapter":"另类投资多元化效应","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：另类投资-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/19174627999682.html"}},{"id":"k2-0027","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于场内证券交易结算的共同对手方制度，以下表述错误的是（）。","options":[{"key":"A","text":"共同对手方是指在结算过程中，同时作为所有买方和卖方的交收对手，并保证交收顺利完成的主体"},{"key":"B","text":"共同对手方一般由证券登记结算机构充当"},{"key":"C","text":"卖出证券的投资者相当于将证券卖给了共同对手方，买入证券的投资者相当于从共同对手方买入证券"},{"key":"D","text":"如果买卖双方中的一方不能履约交收，共同对手方会暂时冻结卖出方的证券或买入方的资金，直到另一方履约时，再完成交收"}],"answer":"D","explain":"共同对手方是结算中同时充当所有买方和卖方交收对手的主体，一般由证券登记结算机构担任，其核心职能是提供交收担保；当一方不能履约时，共同对手方应先按规则代为履约或采取违约处置，而不是冻结券款坐等另一方履约，故D错误。","chapter":"共同对手方制度","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：共同对手方制度-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/29160247109375.html"}},{"id":"k2-0028","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于开放式基金的相关业务，以下表述正确的有()。Ⅰ.基金转换通常会在转换时收取一定的转换费用Ⅱ.非交易过户是指将一定数量的基金份额按照一定规则从某一投资者基金账户转移到另一投资者基金账户的行为Ⅲ.转托管业务中，份额转入和转出必须是同一家销售机构Ⅳ.基金份额被冻结部分产生的现金分红一并冻结","options":[{"key":"A","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅳ"},{"key":"C","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅲ"}],"answer":"B","explain":"基金转换通常收取一定的转换费用；非交易过户是份额按规则从一名投资者账户转到另一名投资者账户；份额被冻结时其产生的现金分红一并冻结，故Ⅰ、Ⅱ、Ⅳ正确。转托管是份额在同一投资者不同销售机构账户间转移，不要求转入转出为同一家机构，故Ⅲ错误。","chapter":"开放式基金业务","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：开放式基金的相关业务-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/14113926906572.html"}},{"id":"k2-0029","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于预期损失，以下表述正确的是（）","options":[{"key":"A","text":"预期损失是在选定区间内任一历史时点往后推，产品净值走到最低点时的收益率回撤幅度的最大值"},{"key":"B","text":"预期损失的局限性在于，其计算需要获取足够多的效益低于目标的数据"},{"key":"C","text":"预期损失是评估证券或投资组合系统性风险的指标，反映的是投资对象对市场变化的敏感度"},{"key":"D","text":"预期损失是指在给定时间区间和置信水平下，投资组合损失的条件期望值"}],"answer":"D","explain":"预期损失指在给定时间区间和置信水平下，投资组合损失超过风险价值部分的条件期望值，故D正确。A描述的是最大回撤，C描述的是β系数所反映的系统性风险敏感度。","chapter":"预期损失定义","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：预期损失-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/31160714697833.html"}},{"id":"k2-0030","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】按我国信息披露法规固定，基金管理人应及时予以临时披露的信息包括（）I、基金份额持有人大会的召开II、基金经理和基金托管人的基金托管部门负责人变更III、基金份额净值计价错误金额达基金份额净值的0.5%IV、开放式基金发生巨额赎回但正常办理赎回业务","options":[{"key":"A","text":"I、II、III"},{"key":"B","text":"I、III、IV"},{"key":"C","text":"II、III、IV"},{"key":"D","text":"I、II、III、IV"}],"answer":"A","explain":"份额持有人大会召开、基金经理及托管部门负责人变更、份额净值计价错误达净值0.5%等，均属应及时临时披露的重大事件，故Ⅰ、Ⅱ、Ⅲ正确。开放式基金发生巨额赎回但能正常办理的，不构成须临时披露的情形，故Ⅳ不选。","chapter":"基金临时信息披露","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：基金信息披露-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/18112944956893.html"}},{"id":"k2-0031","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于股票基金与单一股票，以下表述正确的是（）。","options":[{"key":"A","text":"投资股票时，一般会对股票价格高低的合理性做出判断，但对股票基金份额净值高低判断合理与否没有意义"},{"key":"B","text":"股票价格和股票基金份额净值在每一个交易日内都始终处于变动中"},{"key":"C","text":"股票价格和股票基金份额净值都会受到投资者买卖或申赎数量的影响"},{"key":"D","text":"股票基金由于投资了多只股票，投资风险大于单一股票的投资风险"}],"answer":"A","explain":"对股票价格高低是否合理可以作出价值判断，而基金份额净值高低只反映历史运作结果，判断其合理与否意义不大，故A正确。基金净值每日计算一次而非始终变动，净值一般不受申赎数量影响，股票基金因分散投资其风险小于单一股票。","chapter":"股票基金与股票区别","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：股票基金与单一股票-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/02160958898054.html"}},{"id":"k2-0032","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】某基金100个交易日的每日基金净值变化的基点值△(单位：点)从小到大排列为△(1)~△(100)。其中，△(91)~△(100)的值依次为：6.94，7.80，7.93，8.12，8.43，8.56，9.55，9.88，10.22，13.23，求△的上3.5%分位数（）。","options":[{"key":"A","text":"9.715"},{"key":"B","text":"8.025"},{"key":"C","text":"3.500"},{"key":"D","text":"0.4631"}],"answer":"A","explain":"上3.5%分位数对应100×3.5%＝3.5的位置，即从最大值数起的第3.5个观测值；第3大为9.88、第4大为9.55，线性插值得9.88－0.5×(9.88－9.55)＝9.715，故选A。","chapter":"分位数计算方法","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：分位数-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/04161302552918.html"}},{"id":"k2-0033","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于股票基金的风险管理，以下表述错误的是（）。","options":[{"key":"A","text":"某股票基金的β系数显著大于1，说明该基金是一个确定或防御型的基金"},{"key":"B","text":"股票基金如果降低其非系统性风险，可以通过分散投资来实现"},{"key":"C","text":"股票基金系统性风险管理的要点，在于控制投资组合对系统性风险的暴露是否符合预设的规定"},{"key":"D","text":"常用来反映股票基金风险的指标有标准差、β系数、持股集中度、持股数量等"}],"answer":"A","explain":"β系数显著大于1说明基金净值波动幅度大于市场，属于激进（进攻）型基金而非防御型，故A错误。分散投资可降低非系统性风险、系统性风险管理的要点在于控制暴露水平，以及标准差、β、持股集中度与数量作为风险指标，均表述正确。","chapter":"股票基金风险管理","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：股票基金的风险管理-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/06140800638605.html"}},{"id":"k2-0034","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于实时处理交收和批量处理交收，以下表述错误的是()。","options":[{"key":"A","text":"批量处理交收和实时处理交收都可以以全额结算或净额结算方式进行交收"},{"key":"B","text":"实时处理交收对市场参与者的流动性要求相对较高"},{"key":"C","text":"根据结算指令的处理方式，债券结算可以分为实时处理交收和批量处理交收"},{"key":"D","text":"实时处理交收方式下，结算系统实时检查参与者券款情况，只要结算所需条件满足即可进行交收"}],"answer":"A","explain":"按结算指令处理方式，债券结算分为实时处理交收与批量处理交收，实时处理为逐笔全额交收，对参与者流动性要求较高，而净额结算主要通过批量处理实现，故A说两者都可采用全额或净额结算有误。","chapter":"债券结算方式","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：实时处理交收和批量处理交收-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/23175144974558.html"}},{"id":"k2-0035","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于绝对收益和相对收益，以下表述正确的是()。","options":[{"key":"A","text":"在指数上涨时，投资组合相对收益比绝对收益高;在指数下跌时，投资组合相对收益比绝对收益低"},{"key":"B","text":"相对收益是比较两个实际投资组合收益率差异的指标"},{"key":"C","text":"绝对收益是投资组合在一定时间内所获得的回报，相对收益是投资组合相对于业绩比较基准的收益"},{"key":"D","text":"绝对收益的计算必须要考虑所选取的业绩比较基准"}],"answer":"C","explain":"绝对收益是投资组合在一定期间内自身取得的回报，相对收益是组合收益与业绩比较基准收益之间的差额，故C正确。绝对收益的计算不依赖业绩比较基准，相对收益也并非比较两个实际组合的收益差异。","chapter":"绝对收益与相对收益","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：绝对收益和相对收益-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/26175529784287.html"}},{"id":"k2-0036","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于债券基金中可转债投资风险，以下表述错误的是()。","options":[{"key":"A","text":"存在强制转股条款带来的转换风险"},{"key":"B","text":"存在债券提前赎回风险"},{"key":"C","text":"当基准股票市价高于转股价格时，持有者会转为债券投资者"},{"key":"D","text":"当基准股票市价高于转股价格时，可转债价格随股价上涨而上涨，但也会随股价的下跌而下跌，持有者要承担股价被动的风险"}],"answer":"C","explain":"当基准股票市价高于转股价格时，转股后卖出股票更有利，持有者会倾向于转为股票投资者而非债券投资者，故C错误。强制转股条款、提前赎回风险以及股价下跌带来的被动风险都是可转债的现实风险。","chapter":"可转债投资风险","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：可转债投资的四个风险-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202511/23120804981479.html"}},{"id":"k2-0037","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于远期合约的作用，以下表述错误的是（）。","options":[{"key":"A","text":"远期合约没有固定的集中交易场所，市场透明度较低"},{"key":"B","text":"远期合约相对期货合约而言能为交易双方提供更大的灵活性"},{"key":"C","text":"远期合约能让生产、加工和经营者规避未来价格波动风险"},{"key":"D","text":"远期合约均设有每日价格最大波动限制以免价格波动过大造成交易者重大损失"}],"answer":"D","explain":"远期合约是非标准化的场外协议，没有固定的集中交易场所，也不设每日价格最大波动限制，涨跌停板是交易所期货合约的制度安排，故D错误。远期合约灵活性更高，可帮助生产经营者锁定未来价格。","chapter":"远期合约特点","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：远期合约的作用-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202511/25121210755726.html"}},{"id":"k2-0038","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】某基金公司有4只基金A、B、C、D，基金A在2018年发生年度审计费用20.000元，以下费用分摊正确的是()。","options":[{"key":"A","text":"该基金公司承担20.000元"},{"key":"B","text":"A基金承担20.000元"},{"key":"C","text":"A基金承担10.000元，该基金公司承担10.000元"},{"key":"D","text":"四只基金各承担5.000元"}],"answer":"B","explain":"基金费用遵循谁受益谁承担的原则，A基金发生的年度审计费用应由A基金资产承担，不能在四只基金之间分摊或由公司承担，故选B。","chapter":"基金费用分摊","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：基金有关的费用-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202511/29135458908264.html"}},{"id":"k2-0039","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于企业资本结构，以下表述错误的是（）。","options":[{"key":"A","text":"企业的资本可以分为债务资本和权益资本两类"},{"key":"B","text":"正常经营情况下，权益资本可以偿还给投资人"},{"key":"C","text":"债权人出借资金给企业，企业定期支付利息并到期偿还本金"},{"key":"D","text":"约好的资本结构不仅能够降低融资成本，还能在一定风险水平下最大化企业价值"}],"answer":"B","explain":"权益资本属于企业的永久性资本，正常经营期间不得偿还给投资人，只有在清算时才有剩余财产分配问题，故B错误。资本分为债务资本与权益资本，债权人按期收息收回本金，合理的资本结构有助于降低融资成本并提升企业价值。","chapter":"企业资本结构","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：资本结构-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/09112154795855.html"}},{"id":"k2-0040","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于债券当期收益率，以下表述错误的是（）。","options":[{"key":"A","text":"考虑了货币的时间价值"},{"key":"B","text":"描述了债券某一期间所获得的现金收入相较于债券价格的比率"},{"key":"C","text":"持有到期的情况下，不考虑溢价购买债券时投资者可能遭受的资本损失"},{"key":"D","text":"持有到期的情况下，不考虑折价购买债券时投资者实现的资本利得"}],"answer":"A","explain":"当期收益率只计算某段期间现金收入与债券价格的比率，没有考虑货币时间价值，也没有反映溢价买入的资本损失或折价买入的资本利得，故A错误。","chapter":"债券当期收益率","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：债券当期收益率-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/01160848429301.html"}},{"id":"k2-0041","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于集中交易制度，以下表述错误的是（）。","options":[{"key":"A","text":"集中交易制度下的交易员不再按照交易部的品种进行区分"},{"key":"B","text":"通过电子交易系统执行交易并记录投资交易情况"},{"key":"C","text":"有助于维护交易操作的公平性，有效防范内幕交易等违规行为"},{"key":"D","text":"由交易部门负责投资组合交易指令的审核、执行与反馈"}],"answer":"A","explain":"集中交易制度是把投资指令集中交由交易部门统一执行，以保障公平、防范违规，交易员仍需按交易品种分工，并未取消品种区分，故A表述错误。指令的审核、执行与反馈由交易部门负责，并通过电子系统记录交易。","chapter":"集中交易制度","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：集中交易制度-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202511/28135301977953.html"}},{"id":"k2-0042","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于防范融资融券风险的措施，以下表述错误的是（）。","options":[{"key":"A","text":"对可用于融资融券的标的进行限定"},{"key":"B","text":"对普通投资者开户时间和持有资金设置最低限制"},{"key":"C","text":"对参与融资融券的证券公司做出严格规定，只有符合一定标准的证券公司才能开展此项业务"},{"key":"D","text":"维持担保比例必须小于某一个上限"}],"answer":"D","explain":"为控制融资融券风险，应要求维持担保比例不低于规定下限，比例过低时须追加担保或强制平仓，D说维持担保比例必须小于某一上限，方向恰好相反，故错误。限定标的、限制投资者准入、规范证券公司资质都是常用措施。","chapter":"融资融券风险防范","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：防范融资融券风险的措施-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/20113225993434.html"}},{"id":"k2-0043","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于业绩评估，以下表述正确的是（）：Ⅰ、业绩衡量是确定投资组合收益的来源Ⅱ、业绩归因是指对投资组合收益率、风险等各类业绩指标的计算Ⅲ、绩效评估是通过将投资组合的表现与业绩基准或同类投资组合进行对比并做出评价","options":[{"key":"A","text":"Ⅲ"},{"key":"B","text":"Ⅱ、Ⅲ"},{"key":"C","text":"Ⅰ、Ⅲ"},{"key":"D","text":"Ⅰ、Ⅱ"}],"answer":"A","explain":"绩效评估是把组合表现与业绩基准或同类组合对比后作出评价，只有Ⅲ的界定正确。业绩衡量是对收益率、风险等指标的计算，业绩归因才是确定收益来源，Ⅰ和Ⅱ把两者的定义弄反了。","chapter":"业绩评估概念","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：业绩评估-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/26160137157067.html"}},{"id":"k2-0044","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】资产估值方法一致性的核心要求是（)","options":[{"key":"A","text":"基同一基金管理人对管理的不同基金持有的具有相同特征的统一投资品种使用一致的估值原则、程序及技术"},{"key":"B","text":"基金年度报告与中期报告披露口径统一"},{"key":"C","text":"不同基金管理人采用相同估值技术"},{"key":"D","text":"基金托管人与基金管理人估值程序相同"}],"answer":"A","explain":"估值方法一致性的核心要求是同一基金管理人对旗下不同基金持有的、具有相同特征的投资品种，应采用一致的估值原则、程序和技术，故选A。它并不要求不同管理人之间或不同报告之间口径完全一致。","chapter":"估值方法一致性","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：资产估值方法-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/19113058955803.html"}},{"id":"k2-0045","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于业绩比较基准，以下表述错误的是（）。","options":[{"key":"A","text":"基金通常可以获取与业绩比较基准相同的收益"},{"key":"B","text":"反映基金的投资策略，为基金业绩评估提供基础"},{"key":"C","text":"可以帮助投资者评估和跟踪基金经理的投资能力和基金产品的业绩表现"},{"key":"D","text":"帮助基金进行业绩度量、业绩归因和业绩评估"}],"answer":"A","explain":"基金实际收益通常难以完全等同于业绩比较基准收益，因为存在费用扣减、跟踪偏差和主动偏离，A把它说成通常可以取得相同收益是错误的。业绩比较基准可反映投资策略，并为业绩度量、归因和评估提供基础。","chapter":"业绩比较基准","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：业绩比较基准-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/18174520645733.html"}},{"id":"k2-0046","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于信用利差，以下表述错误的是（）","options":[{"key":"A","text":"信用利差随着企业财务状况恶化而扩张"},{"key":"B","text":"投资者可以通过比较不同债券的信用利差，结合投资风险偏好进行投资决策"},{"key":"C","text":"在其他条件相同的情况下，信用利差随着债券期限增加而扩大"},{"key":"D","text":"信用利差的变化滞后于经济周期的转化"}],"answer":"D","explain":"信用利差往往先于经济周期变化而变动，具有预警意义，因此说其变化滞后于经济周期转化是不正确的，故选D。企业财务状况恶化会使信用利差走阔，期限越长信用利差通常越大，投资者可据此结合风险偏好决策。","chapter":"债券信用利差","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：信用利差-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/23113339962230.html"}},{"id":"k2-0047","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】下列风险管理措施中，主要针对市场风险的是()。","options":[{"key":"A","text":"建立交易对手信用评级制度"},{"key":"B","text":"分析投资组合持有人的结构和特征，关注申购和赎回意愿"},{"key":"C","text":"关注投资组合的风险调整后收益指标，如夏普比率、特雷诺比率等"},{"key":"D","text":"定期检修公司内部电子系统，避免系统故障V"}],"answer":"C","explain":"关注夏普比率、特雷诺比率等风险调整后收益指标，是衡量与管理市场风险的手段，故选C。建立交易对手信用评级针对信用风险，分析持有人结构与申赎意愿针对流动性风险，检修电子系统针对操作风险。","chapter":"市场风险管理措施","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：市场风险管理的主要措施-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/22175015606735.html"}},{"id":"k2-0048","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】资本市场理论的前提假设包括（）I.所有投资者都是风险厌恶者II.所有投资者期望相同III.所有投资可以无限分割，但是投资数量受到个体财富限制IV.投资者是价格的设定者","options":[{"key":"A","text":"I、II"},{"key":"B","text":"I、II、IV"},{"key":"C","text":"II、III、IV"},{"key":"D","text":"III、IV"}],"answer":"A","explain":"资本市场理论假设所有投资者都是风险厌恶者，且对各类资产的预期收益与风险有相同预期，故Ⅰ、Ⅱ正确。它还假设投资可无限分割且投资者可按无风险利率自由借贷，投资者是价格接受者而非价格设定者，故Ⅲ、Ⅳ错误。","chapter":"资本市场理论假设","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：资本市场理论的前提假设-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/30160553572498.html"}},{"id":"k2-0049","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】股票发行时的票面价值为10元/股，实际发行价格为15元/股，共发行1亿股，以下表述正确的是（）","options":[{"key":"A","text":"该股票发行所募集的股本为15亿元"},{"key":"B","text":"该股票发行产生10亿元资本公积"},{"key":"C","text":"该股票发行产生15亿元资本公积"},{"key":"D","text":"该股票发行所募集的股本为10亿元"}],"answer":"D","explain":"股票发行募集股本按面值计入，即10元×1亿股＝10亿元；发行价格高于面值的部分形成资本公积，为(15－10)×1亿＝5亿元。故D正确，募集资金总额15亿元并不等于股本。","chapter":"股本与资本公积","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：股票的票面价值-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202511/26121327289602.html"}},{"id":"k2-0050","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于被动投资的跟踪误差，以下表述正确的是（）","options":[{"key":"A","text":"跟踪误差=投资组合的真实收益率-甚准组合的收益率"},{"key":"B","text":"对于被动投资而言，投资者通常期望跟踪误差尽可能小"},{"key":"C","text":"基金运行的管理费和托管费不会增加跟踪误差"},{"key":"D","text":"投资组合总收益波动率越大，跟踪误差越大"}],"answer":"B","explain":"被动投资的目的是复制指数表现，投资者希望跟踪误差尽可能小，故B正确。跟踪误差是组合与基准收益率之差的波动率而非简单差额，管理费和托管费等成本会加大跟踪误差，组合总波动率大也不必然意味着跟踪误差大。","chapter":"被动投资跟踪误差","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：跟踪误差-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202511/21115535387131.html"}},{"id":"k2-0051","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】以下会带来跨境投资估值风险的是（）。I.跨境业务涉及多市场、多品种和多币种的估值核算II.数据来源不一致III.证券交易过度活跃IV.各国税收制度不一样","options":[{"key":"A","text":"I、II、III"},{"key":"B","text":"I、II、IV"},{"key":"C","text":"I、III、IV"},{"key":"D","text":"II、III、IV"}],"answer":"B","explain":"跨境投资涉及多市场、多品种、多币种的估值核算，数据来源不一致，且各国税收制度存在差异，都会给估值带来不确定性，故Ⅰ、Ⅱ、Ⅳ正确。证券交易过度活跃与估值风险没有直接关系，故Ⅲ不选。","chapter":"跨境投资估值风险","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：跨境投资估值风险-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202601/15114035676323.html"}},{"id":"k2-0052","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于资金加权收益率的特点，以下表达错误的是（）","options":[{"key":"A","text":"将资金流入，资金流出对整体投资回报的影响纳入考量范围"},{"key":"B","text":"适用于投资者在不同时间点追加投资或者赎回资金的场景"},{"key":"C","text":"计算时通常需要使用迭代法求解"},{"key":"D","text":"可以准确反应公募基金经理的真实投资能力"}],"answer":"D","explain":"资金加权收益率把资金流入流出时点纳入考量，适用于投资者分次追加或赎回资金的情形，计算时通常需用迭代法求解；但由于受投资者自身申赎时点影响，它不能准确反映基金经理的真实投资能力（那应以时间加权收益率为准），故D错误。","chapter":"资金加权收益率","disputed":false,"source":{"title":"2025年11月基金从业《证券投资基金》真题考点：资金加权收益率-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202512/24155727623250.html"}},{"id":"k2-0053","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2025年11月","type":"single","stem":"【考试原题】关于期权的盈亏分析，以下表述正确的是()。Ⅰ.看涨期权的卖方盈利是有限的，亏损可能是无限大的Ⅱ.看跌期权的卖方盈利和买方亏损都是有限的Ⅲ.看跌期权的卖方盈利是有限的，亏损可能是无限大的","options":[{"key":"A","text":"Ⅰ、Ⅲ"},{"key":"B","text":"Ⅱ、Ⅲ"},{"key":"C","text":"Ⅰ、Ⅱ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅲ"}],"answer":"C", 章-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202411/04151511726949.html"}},{"id":"k2-0077","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年11月","type":"single","stem":"关于内在价值法，以下表述错误的是()。","options":[{"key":"A","text":"一般情况下，内在价值等于股票当前价格"},{"key":"B","text":"内在价值法是按照未来现金流贴现对公司的内在价值进行评估"},{"key":"C","text":"贴现模型的选择要与获得的现金流相对应"},{"key":"D","text":"股利贴现模型、股权资本自由现金流贴现模型、自由现金流贴现模型都属于内在价值法"}],"answer":"A","explain":"内在价值法按未来现金流贴现估计公司内在价值，内在价值与当前市场价格通常并不相等，价格围绕内在价值波动，故A错误。股利贴现模型、股权自由现金流贴现模型和自由现金流贴现模型都属于内在价值法，且贴现模型须与所用现金流相匹配。","chapter":"股票内在价值法","disputed":false,"source":{"title":"2024年11月基金从业《证券投资基金》章节真题冲刺：第七章-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202410/25115539945984.html"}},{"id":"k2-0078","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年11月","type":"single","stem":"根据当前中国内地税收政策，投资者进行以下投资活动，需要缴纳增值税的是()。","options":[{"key":"A","text":"合格境外投资者(QFII)委托境内公司在境内买卖股票"},{"key":"B","text":"中国内地个人投资者买卖境内基金"},{"key":"C","text":"中国内地机构投资者买卖境内基金份额"},{"key":"D","text":"香港市场机构投赏者通过基金互认买卖境内基金份额"}],"answer":"C","explain":"按现行税收政策，中国内地机构投资者买卖境内基金份额取得的差价收入应缴纳增值税，故选C。个人投资者买卖境内基金份额、QFII委托境内公司买卖股票以及香港机构投资者通过基金互认买卖境内基金份额，均享受免征增值税待遇。","chapter":"基金投资增值税","disputed":false,"source":{"title":"2024年11月基金从业《证券投资基金》章节真题冲刺：第十九章-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202411/06151947487578.html"}},{"id":"k2-0079","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年11月","type":"single","stem":"关于股票收益互换，以下表述错误的是（）。","options":[{"key":"A","text":"投资者无法通过股票收益互换进行风险管理"},{"key":"B","text":"股票收益互换的模式包括固定利率和股票收益互换"},{"key":"C","text":"股票收益互换中，支付的金额与特定股票、指数等权益类标的表现挂钩"},{"key":"D","text":"通常进行净额交收，不发生本金交换"}],"answer":"A","explain":"股票收益互换可用于对冲或调整权益类风险敞口，是风险管理工具，故A说投资者无法通过其进行风险管理是错误的。其模式包括固定利率与股票收益互换等，支付金额与特定股票或指数表现挂钩，通常净额交收而不交换本金。","chapter":"股票收益互换","disputed":false,"source":{"title":"2024年11月基金从业《证券投资基金》章节真题冲刺：第九章-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202410/27120047236248.html"}},{"id":"k2-0080","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年11月","type":"single","stem":"列关于保险公司的说法错误的是()。","options":[{"key":"A","text":"保险公司通过销售保单募集大量保费"},{"key":"B","text":"财险公司通常将保费投资于低风险资产"},{"key":"C","text":"寿险公司通常将保费投资于低风险资产"},{"key":"D","text":"保险公司可分为财险公司与寿险公司"}],"answer":"C","explain":"财险公司负债期限短、赔付不确定性高，通常将保费投资于低风险资产；寿险公司资金具有长期稳定性，可配置期限较长、风险相对较高的资产，故C说寿险公司通常投资低风险资产是错误的。保险公司分为财险与寿险两类。","chapter":"保险公司投资特点","disputed":false,"source":{"title":"2024年11月基金从业《证券投资基金》章节真题冲刺：第十一章-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202410/30150245929039.html"}},{"id":"k2-0081","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年11月","type":"single","stem":"沪港通的开展，在内地与香港之间搭建起资本流通的桥梁。沪港通的双向交易所采用的结算货币是（）。","options":[{"key":"A","text":"人民币"},{"key":"B","text":"人民币或港币"},{"key":"C","text":"多元"},{"key":"D","text":"港币"}],"answer":"A","explain":"沪港通双向交易均以人民币作为结算货币，投资者以人民币报价和交收，故选A。港币或多元货币结算的说法不符合制度安排。","chapter":"沪港通结算货币","disputed":true,"source":{"title":"2024年11月基金从业《证券投资基金》章节真题冲刺：第二十七章-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202411/0715220330304.html"}},{"id":"k2-0082","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年11月","type":"single","stem":"关于含有嵌入条款的债券，下列哪种条款是对债券发行人有利的()。","options":[{"key":"A","text":"转换条款"},{"key":"B","text":"通货膨胀联结条款"},{"key":"C","text":"赎回条款"},{"key":"D","text":"回售条款"}],"answer":"C","explain":"赎回条款赋予发行人在约定条件下提前赎回债券的权利，在利率下行时对发行人有利，故选C。回售条款和转换条款赋予投资者选择权，通货膨胀联结条款是为保护投资者购买力而设。","chapter":"债券嵌入条款","disputed":false,"source":{"title":"2024年11月基金从业《证券投资基金》章节真题冲刺：第八章-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202410/26115818515504.html"}},{"id":"k2-0083","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年11月","type":"single","stem":"远期利率和即期利率的区别在于()。","options":[{"key":"A","text":"付息频率不同"},{"key":"B","text":"计息期限不同"},{"key":"C","text":"计息方式不同"},{"key":"D","text":"计息日起点不同"}],"answer":"D","explain":"远期利率与即期利率反映的都是利率水平，二者的根本区别在于计息期的起点不同：即期利率从当前时点开始计息，远期利率则从未来某一时点开始，故选D。付息频率、期限和计息方式都不是区分二者的标准。","chapter":"远期利率与即期利率","disputed":false,"source":{"title":"2024年11月基金从业《证券投资基金》章节真题冲刺：第六章-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202410/24160822190010.html"}},{"id":"k2-0084","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年11月","type":"single","stem":"在基金收入中，股利收入属于()","options":[{"key":"A","text":"其他收入"},{"key":"B","text":"投资收益"},{"key":"C","text":"公允价值变动损益"},{"key":"D","text":"利息收入"}],"answer":"B","explain":"基金持有的股票分红形成股利收入，属于投资收益的组成部分，故选B。它不属于利息收入、公允价值变动损益或其他收入。","chapter":"基金收入分类","disputed":false,"source":{"title":"2024年11月基金从业《证券投资基金》章节真题冲刺：第十八章-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202411/05151733608370.html"}},{"id":"k2-0085","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于合格境内机构投资者（QDII）制度，以下表述错误的是（）","options":[{"key":"A","text":"境内机构投资者可以委托符合条件的境外投资顾问进行境外证券投资"},{"key":"B","text":"境内机构投资者开展境外证券投资业务时，应当由符合条件的资产托管机构负责资产托管业务"},{"key":"C","text":"QDII的托管人可以委托符合条件的境外资产托管人负责境外资产托管业务"},{"key":"D","text":"若境内机构投资者决定聘请境外投资顾问的，该投资顾问不得由境内基金管理公司、证券公司在境外设立的分支机构兼任"}],"answer":"D","explain":"QDII制度并未禁止境内基金管理公司、证券公司在境外设立的分支机构兼任境外投资顾问，故D的表述错误。境内机构投资者可委托符合条件的境外投资顾问，托管人可委托符合条件的境外资产托管人，相关业务须由符合条件的托管机构负责托管。","chapter":"QDII境外投资顾问","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案1-10题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12150306920681.html"}},{"id":"k2-0086","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"根据风险收益分析框架，两位具有不同风险厌恶程度的投资者，他们的最优投资组合与资本市场线的关系是()。","options":[{"key":"A","text":"风险厌恶程度高的投资人，其选择最终会位于资本市场线下方"},{"key":"B","text":"风险厌恶程度低的投资人，其选择最终会位于资本市场线下方"},{"key":"C","text":"不管风险厌恶程度高还是低，这两位投资人的选择最终都会落在有效前沿内部"},{"key":"D","text":"不管风险厌恶程度高还是低，这两位投资人的选择最终都会落在资本市场线上"}],"answer":"B","explain":"资本市场线是完全分散化条件下无风险资产与市场组合的有效组合轨迹，风险厌恶程度较低的投资者更容易暴露于非系统性风险，其实际组合可能落在资本市场线下方而未能获得相应风险补偿，故B正确。理论上沿资本市场线配置才最有效率。","chapter":"资本市场线配置","disputed":false,"source":{"title":"2024年5月基金从业《证券投资基金》考点+真题解析：资本市场线-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202407/07153407627444.html"}},{"id":"k2-0087","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于贝塔系数和其他系数，以下表述正确的是（）Ⅰ、某资产的贝塔系数越大，意味着该资产收益率与市场组合收益率的协方差越大Ⅱ、两种金融资产收益率相关系数和协方差符号总是相同Ⅲ、相关系数为0代表两种金融资产收益率之间无线性相关联Ⅳ、除非两种金融资产收益率是完全正相关的，否则分散投资总是能够降低投资组合的风险","options":[{"key":"A","text":"Ⅲ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅱ、Ⅳ"},{"key":"D","text":"Ⅱ、Ⅲ、Ⅳ"}],"answer":"B","explain":"β等于资产与市场组合的协方差除以市场组合方差，β越大协方差越大，Ⅰ正确；相关系数与协方差符号总是一致，Ⅱ正确；相关系数为0表示两者不存在线性相关，Ⅲ正确；只要不是完全正相关，分散投资就能降低组合风险，Ⅳ正确。四项均正确，故选B。","chapter":"β系数与相关系数","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案21-30题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12151313174995.html"}},{"id":"k2-0088","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"以下不符合暂停估值条件的是（）。","options":[{"key":"A","text":"基金投资所涉及的证券交易所遇法定节假日或因其他原因暂停营业时。"},{"key":"B","text":"如出现基金管理人认为属于紧急事故的任何情况，会导致基金管理人不能出售或评估基金资产的。"},{"key":"C","text":"基金中某个投资品种的估值出现了重大转变"},{"key":"D","text":"因不可抗力或其他情形致使基金管理人、基金托管人无法准确评估基金资产价值时。"}],"answer":"D","explain":"暂停估值的判断要点是法规列举的情形：投资所涉交易所停业、紧急事故导致无法出售或评估资产、投资品种估值重大转变、不可抗力致无法准确估值等，作答时须比较各选项与法定列举情形的对应关系。本题按给定答案应选D。","chapter":"暂停估值情形","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案11-20题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12150342920776.html"}},{"id":"k2-0089","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于货币的时间价值，以下表述错误的是（）。","options":[{"key":"A","text":"两笔金额相等的资金，如果发生在不同的时期，其实际价值也是不同的"},{"key":"B","text":"终值的计算公式为FV=PVx(1+i)n，其中i表示市场的无风险利率"},{"key":"C","text":"随着时间的推移，货币发生的增值就是货币的时间价值"},{"key":"D","text":"一般情况下，货币的时间价值应按“利滚利”的复利方式来计算"}],"answer":"B","explain":"终值公式FV＝PV×(1＋i)^n中的i表示每期利率，可以是必要收益率或贴现率，并不专指无风险利率，故B错误。不同时点等额资金价值不同、货币时间价值体现为增值、通常按复利计算，这些表述都正确。","chapter":"货币时间价值","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12152500382198.html"}},{"id":"k2-0090","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于债券，以下表述错误的是()。","options":[{"key":"A","text":"按照付息方式，债券可以分为息票债券和贴现债券。"},{"key":"B","text":"对已发行的固定利率债券因发行人信用等级降低，发行人要偿付的利息需要相应提高"},{"key":"C","text":"浮动利率债券的票面利率通常与基准利率挂钩"},{"key":"D","text":"零息债券在偿还期内不支付利息，在到期日一次性支付利息和本金"}],"answer":"B","explain":"固定利率债券发行后票面利率即已锁定，发行人信用等级下降影响的是债券的市场价格和投资者要求的收益率，并不会使发行人须偿付的利息提高，故B错误。按付息方式可分为息票债券与贴现债券，浮动利率债券票面利率通常挂钩基准利率，零息债券到期一次还本付息。","chapter":"债券分类与利率","disputed":false,"source":{"title":"2024年5月基金从业《证券投资基金》考点+真题解析：债券的种类和特点2-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202407/04152032635582.html"}},{"id":"k2-0091","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"张先生拟用退休金购买基金，对基金选择，亲友们的建议有以下4点，请你从专业角度帮助张先生做出分析，正确是的（）。Ⅰ、选择年初以来收益率高的Ⅱ、选择基金经理从业年限长的Ⅲ、选择风险调整后超额收益高的Ⅳ、想清楚自己的投资目标","options":[{"key":"A","text":"Ⅱ、Ⅳ"},{"key":"B","text":"Ⅲ、Ⅳ"},{"key":"C","text":"Ⅱ、Ⅲ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅳ"}],"answer":"B","explain":"挑选基金应结合自身投资目标，并关注风险调整后的超额收益，故Ⅲ、Ⅳ正确。年初以来收益率只反映短期表现，基金经理从业年限长也不代表其管理能力更强，二者都不足以作为选择依据。","chapter":"基金选择与投资目标","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12152500382198.html"}},{"id":"k2-0092","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于封闭式基金利润分配，以下表述正确的是（）","options":[{"key":"A","text":"利润分配可能导致封闭式基金份额数据发生变化"},{"key":"B","text":"利润分配一定会导致现金流出封闭式基金"},{"key":"C","text":"不同投资者持有相等数量的某封闭式基金份额，在某次利润分配中所分得现金可能不相等"},{"key":"D","text":"利润分配不会影响封闭式基金的份额净值"}],"answer":"B","explain":"封闭式基金利润分配只能采用现金分红方式，必然导致现金流出基金，故B正确。分配不会改变基金份额数量，持有份额相同的投资者分得现金相同，且分配后份额净值会相应下降。","chapter":"封闭式基金利润分配","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案11-20题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12150342920776.html"}},{"id":"k2-0093","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于可转换债券的特征和要素，以下表述正确的是（）","options":[{"key":"A","text":"可转换债券一般每月付息一次"},{"key":"B","text":"可转换债券的双重选择权是指转股权和提前赎回权"},{"key":"C","text":"司转换偻券的票面利率一般高于同够条件的管通债券的票面利率"},{"key":"D","text":"在转股前，司特接债券体现了持有者与发行公司之间的所有权关系"}],"answer":"B","explain":"可转债的核心特征是兼具债性与股性：持有人拥有按约定条件把债券换成股票的权利，发行人则保留在特定条件下提前赎回的权利，二者合称双重选择权。由于内含转股期权，其票面利率通常低于同条件的普通债券，付息多为每年或每半年一次；转股前持有人仍是债权人，与发行公司之间是债权债务关系而非所有权关系。","chapter":"可转换债券要素","disputed":false,"source":{"title":"2024年5月基金从业《证券投资基金》考点+真题解析：可转债的定义、特征和基本要素2-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202407/10154124701239.html"}},{"id":"k2-0094","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"小李购买了100股A上市公司的普通股，关于他所持有的普通股的权利，以下表述错误的是()","options":[{"key":"A","text":"在公司支付债息和优先股股息后，参与股利分配"},{"key":"B","text":"公司召开股东大会时，享有表决权"},{"key":"C","text":"公司破产清算时，享有剩余财产分配权"},{"key":"D","text":"公司有盈利时，享有约定的因定股息率的权利"}],"answer":"B","explain":"判断要点在于区分普通股与优先股的权利：普通股股东在债权人受偿和优先股股东分红之后参与股利分配，享有股东大会表决权和破产清算时的剩余财产分配权，其股利并不固定，而是随公司盈利水平变动。把“按约定固定股息率取得股息”当作普通股权利，属于与优先股特征的混淆。","chapter":"普通股股东权利","disputed":false,"source":{"title":"2024年5月基金从业《证券投资基金》考点+真题解析：股票的类型-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202407/06152549543492.html"}},{"id":"k2-0095","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于大宗交易，以下表述错误的是()。","options":[{"key":"A","text":"证券交易所可以根据市场实际情况调整大宗交易的最低限额"},{"key":"B","text":"对于当天停牌的股票，沪深交易所都不接受其大宗交易申请"},{"key":"C","text":"大宗交易是指单笔数额较大的证券买卖"},{"key":"D","text":"每个交易日15:00以后，上海证券交易所开始接受大宗交易"}],"answer":"D","explain":"大宗交易是单笔数量或金额达到规定最低限额的证券买卖，该限额由交易所根据市场情况调整；当日停牌的证券通常不接受大宗交易申报。交易所对大宗交易设有专门的申报时段，超出该时段的时点表述并不成立。","chapter":"大宗交易规则","disputed":false,"source":{"title":"2024年5月基金从业《证券投资基金》考点+真题解析：场内证券交易特别规定及事项-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202407/08153715746590.html"}},{"id":"k2-0096","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于免疫策略，以下表述正确的是（）。","options":[{"key":"A","text":"水平配比策略是价格免疫策略中的一种策略"},{"key":"B","text":"常用的免疫策略包括价格免疫、利率免疫"},{"key":"C","text":"在尽量减免到期收益率变化所产生的负效应的同时，尽可能从利率变动中获取收益"},{"key":"D","text":"在久期等于持有期的基础上，选择凸性最低的债券"}],"answer":"C","explain":"免疫策略的目标是在锁定目标收益的同时，尽量减少利率变动带来的不利影响，并尽量分享利率变动带来的有利机会，因此它并非单纯“消除”利率风险。常见的免疫策略是久期匹配（利率免疫）与现金流匹配，水平配比、梯形配比属于满足未来现金流需求的组合构建方法；久期等于持有期时应选择凸性较高的债券以增强价格保护。","chapter":"债券免疫策略","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12152500382198.html"}},{"id":"k2-0097","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于全球投资业绩标准（GIPS）的作用，以下表述正确的是（）","options":[{"key":"A","text":"鼓励机构仅展示业绩良好的组合"},{"key":"B","text":"让不同投资管理机构的投资业绩具有可比性"},{"key":"C","text":"当其中条约与当地法律法规有冲突时，可替代当地法律的标准"},{"key":"D","text":"可提高投资业绩，防止投资中出现重大失误"}],"answer":"B","explain":"GIPS是一套全球统一的投资业绩计算与列示标准，其价值在于提高业绩报告的透明度和可比性，使不同机构的业绩能够在一致基础上比较。它并不鼓励只展示表现好的组合，也不能凌驾于当地法律法规之上，更不能直接提升投资收益或避免投资失误。","chapter":"GIPS作用","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12152500382198.html"}},{"id":"k2-0098","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"以下不属于银行间债券市场全额结算优点的是（）","options":[{"key":"A","text":"降低结算本金风险"},{"key":"B","text":"降低市场参与者结算成本和相关风险"},{"key":"C","text":"每个市场参与者都可以监控自己参与的每一笔交易结算进展情况，从而评估自身对不同对手方的风险暴露"},{"key":"D","text":"有利于保存交易的稳定和结算的及时性"}],"answer":"B","explain":"全额结算的特点是对每笔交易逐笔办理券款交收，不做轧差，因而能降低结算本金风险、便于参与机构逐笔跟踪结算进度、也利于交易的稳定与及时完成。其代价是结算笔数多、占用的资金和债券量大，反而会抬高参与者的结算成本，所以“降低结 /www.233.com/jjcy/jczs/zhenti/202405/12151313174995.html"}},{"id":"k2-0102","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于净资产收益率，以下表述正确的是（）","options":[{"key":"A","text":"净资产收益率能充分反应企业利用总资产创造利润的能力"},{"key":"B","text":"净资产收益率能准确衡量公司对股东的财富回报能力"},{"key":"C","text":"净资产收益率能反应企业中短期的回款能力"},{"key":"D","text":"净资产收益率总是小于资产收益率"}],"answer":"B","explain":"净资产收益率衡量的是股东每投入一元权益资本所能获得的净利润，是反映股东财富回报能力的核心指标。总资产创造利润的能力对应总资产收益率，短期回款能力看的是应收账款周转等指标；净资产收益率在负债经营条件下可以高于资产收益率，并不必然更小。","chapter":"净资产收益率分析","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12152500382198.html"}},{"id":"k2-0103","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于全球投资业绩标准(GIPS)的作用以下表述正确的是()","options":[{"key":"A","text":"鼓励机构仅展示业绩良好的组合"},{"key":"B","text":"让不同投资管理机构的投资业绩具有可比性"},{"key":"C","text":"当其中条约与当地法律法规有冲突时，可替代当地法律的标准"},{"key":"D","text":"GIPS仅包含一套标准"}],"answer":"B","explain":"GIPS的作用是统一业绩计算与列示口径，使不同投资管理机构披露的业绩具备可比性，并提升报告透明度。它不允许机构只挑表现好的组合展示，也不能替代当地法律法规，并且是由多套标准与指引构成的体系而非仅一套标准。","chapter":"GIPS作用","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案11-20题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12150342920776.html"}},{"id":"k2-0104","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于场内证券交易场所，以下表述错误的是()。","options":[{"key":"A","text":"证券交易所可以决定证券交易的价格"},{"key":"B","text":"证券交易所的设立和解散由国务院决定"},{"key":"C","text":"上交所和深交所都设有会员大会、理事会和专门委员会"},{"key":"D","text":"我国的证券交易所目前都采用会员制"}],"answer":"A","explain":"证券交易所是提供交易场所与设施、组织和监督交易的自律组织，证券价格由市场买卖双方竞价形成，交易所本身无权决定价格。交易所的设立和解散由国务院决定，沪深交易所均设会员大会、理事会和专门委员会，目前都实行会员制。","chapter":"场内证券交易场所","disputed":false,"source":{"title":"2024年5月基金从业《证券投资基金》考点+真题解析：证券投资基金场内证券交易市场和结算机构-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202407/05152347410372.html"}},{"id":"k2-0105","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于经纪人，以下表述正确的是（）","options":[{"key":"A","text":"经纪人是报价驱动市场上最重要的角色"},{"key":"B","text":"经纪人是市场流动的主要提供者"},{"key":"C","text":"经纪人通过买交双方的差价赚取主要利润"},{"key":"D","text":"经纪人在交易中只是执行投资者的指令，本身并未参与到交易之中"}],"answer":"D","explain":"经纪人的职能是接受投资者委托、代理买卖证券，自身不持有头寸也不参与交易，收益来自佣金。报价驱动市场上最重要的角色是做市商，市场流动性的主要提供者和买卖价差收益的获取者同样是做市商。","chapter":"经纪人与做市商","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12152500382198.html"}},{"id":"k2-0106","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"根据下列材料，回答第4-6题。4、可转债A在T日交易所收盘价为128.22元，应计利息0.11元，当日该转债的估值全价为()元。","options":[{"key":"A","text":"128.11"},{"key":"B","text":"200.11"},{"key":"C","text":"128.33"},{"key":"D","text":"128.22"}],"answer":"D","explain":"交易所挂牌的可转债按全价报价与成交，收盘价中已经包含应计利息，因此估值全价就等于当日收盘价。把收盘价再加一次应计利息（得出128.33）或减去应计利息（得出128.11）都是把交易所与银行间市场的报价习惯混淆了。","chapter":"可转债估值全价","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案1-10题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12150306920681.html"}},{"id":"k2-0107","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"关于可转债A的利息核算，以下表的是()。","options":[{"key":"A","text":"按日计提利息，当日确认为利息收入"},{"key":"B","text":"转股日进行利息核算"},{"key":"C","text":"可转债付息日进行利息核算"},{"key":"D","text":"可转债不进行利息核算"}],"answer":"A","explain":"可转债作为债券，应按权责发生制在每个估值日计提当期应计利息并确认利息收入，而不是等到付息日或转股日才一次性核算。这样处理才能保证每日基金份额净值反映真实的资产状况。","chapter":"可转债利息核算","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案1-10题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12150306920681.html"}},{"id":"k2-0108","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"债券远期交易是交易双方约定在未来某日期，以约定价格和数量买卖债券，从成交日至结算日期限最长不得超过()天。","options":[{"key":"A","text":"360"},{"key":"B","text":"365"},{"key":"C","text":"180"},{"key":"D","text":"90"}],"answer":"B","explain":"债券远期交易指双方约定在未来某一日期按约定价格和数量买卖债券，从成交日至结算日的期限最长不得超过365天，这是银行间债券市场对该品种的期限约束。","chapter":"债券远期交易规则","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案11-20题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12150342920776.html"}},{"id":"k2-0109","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"T+N日，可转债A收盘价230元，应计利息10元。若基金经理决定换股，日转换例为()。","options":[{"key":"A","text":"40"},{"key":"B","text":"46"},{"key":"C","text":"20"},{"key":"D","text":"48"}],"answer":"A","explain":"转换比例由可转债面值与转股价格决定，即每张债券可换取的股票数量，与债券在二级市场的收盘价和应计利息无关。因此计算时只需用面值除以约定的转股价格，二级市场价格的高低只影响转股是否划算。","chapter":"可转债转换比例","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案1-10题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12150306920681.html"}},{"id":"k2-0110","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"政策性金融债的发行人通常不包括()。","options":[{"key":"A","text":"国家开发银行"},{"key":"B","text":"中国进出口银行"},{"key":"C","text":"中国农业发展银行"},{"key":"D","text":"中国农业银行"}],"answer":"D","explain":"政策性金融债由政策性银行发行，发行主体包括国家开发银行、中国进出口银行和中国农业发展银行。中国农业银行是国有商业银行，其发行的债券属于商业银行金融债，不属于政策性金融债。","chapter":"政策性金融债发行人","disputed":false,"source":{"title":"2024年5月基金从业《证券投资基金》考点+真题解析：债券的种类和特点-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202407/02151543935367.html"}},{"id":"k2-0111","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"保证物为发行人持有的债权或股权而非实物资产的债权是（）。","options":[{"key":"A","text":"担保债券"},{"key":"B","text":"质押债券"},{"key":"C","text":"无保证证券"},{"key":"D","text":"抵押债券"}],"answer":"B","explain":"以发行人持有的债权或股权等金融资产作为担保品的债券属于质押债券；抵押债券的担保物是不动产等实物资产，担保债券是更宽泛的统称，无保证证券则没有任何担保。","chapter":"债券担保方式分类","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12152500382198.html"}},{"id":"k2-0112","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2024年5月","type":"single","stem":"下述选项中不可以进行回转交易的是（）。","options":[{"key":"A","text":"权证交易"},{"key":"B","text":"股次交易日起"},{"key":"C","text":"债券竞价交易"},{"key":"D","text":"单市场股原型ETF"}],"answer":"D","explain":"回转交易即当日买入的证券当日可以卖出。权证、债券竞价交易以及跨境ETF、债券ETF、黄金ETF等实行T+0回转交易；单市场股票型ETF的份额当日买入后需到次一交易日才能卖出，不能当日回转。","chapter":"回转交易适用范围","disputed":false,"source":{"title":"2024年5月证券投资基金基础知识考试真题及答案21-30题-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202405/12151313174995.html"}},{"id":"k2-0113","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2023年12月","type":"single","stem":"关于债券基金，以下表述正确的是()。I.通过可转债和打新股获得收益的债券基金，它的风险比纯债基金低ll.通过计算组合中所有债券的久期的加权平均值可以得到债券基金的久期IIl.杠杆率不超过100%IV.长短期配合投资可以防范利率风险","options":[{"key":"A","text":"I、IV"},{"key":"B","text":"Il、IIl、IV"},{"key":"C","text":"Il、IV"},{"key":"D","text":"I、IIl"}],"answer":"C","explain":"债券基金的久期可由组合内各债券久期按市值权重加权求得，长短期券种搭配投资也能在一定程度上防范利率风险，Ⅱ、Ⅳ成立。参与可转债和打新股的债券基金权益敞口更大，风险高于纯债基金；杠杆率上限并非100%，故Ⅰ、Ⅲ不选。","chapter":"债券基金风险与久期","disputed":false,"source":{"title":"2023年12月基金从业《证券投资基金》考试真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202312/06114355812732.html"}},{"id":"k2-0114","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"2023年12月","type":"single","stem":"在给定时间区间和置信区间内，投资组合的损失期望值被称为()。","options":[{"key":"A","text":"预期损失"},{"key":"B","text":"最大回撤"},{"key":"C","text":"下行标准差"},{"key":"D","text":"风险价值"}],"answer":"A","explain":"在给定时间和置信水平下，损失分布的尾部平均值称为预期损失（条件风险价值），它比风险价值更进一步反映极端损失的平均规模。风险价值是分位点上的最大可能损失，最大回撤和下行标准差则是另外两类下行风险度量。","chapter":"预期损失指标","disputed":false,"source":{"title":"2023年12月基金从业《证券投资基金》考试真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202312/06114355812732.html"}},{"id":"k2-0115","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于沪股通和港股通，以下标识正确的是（）。","options":[{"key":"A","text":"所谓沪股通，就是投资者委托香港经纪商经由香港联合交易所设立的证券 采用估值技术确定投资品种公允价值时，可优先使用不可观察输入值对存在活跃市场且能够获取相同资产或者负债报"},{"key":"D","text":"对存在活跃市场且能够获取相同资产或负债报价的投资品种，估值日有报价的，除例外情况，应采用该报价确定公允价值"}],"answer":"D","explain":"对存在活跃市场且能取得相同资产或负债报价的投资品种，估值日有报价的，除少数例外情形外应采用该报价确定公允价值。只有在无报价且最近交易日后未发生影响公允价值计量的重大事件时，才可按最近交易日的报价或采用估值技术；估值技术应优先使用可观察输入值，估值调整也要按规定判断重要性。","chapter":"基金估值基本原则","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.22）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/22143751211316.html"}},{"id":"k2-0121","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于计价错误的处理及责任承担，以下表述错误的是（）。","options":[{"key":"A","text":"基金管理公司应当制定估值及份额净值计价错误的识别及应急方案"},{"key":"B","text":"基金管理公司在基金估值过程中未能遵循相关法律法规规定或基金合同约定给基金财产造成损失的，对其行为依法承担赔偿责任"},{"key":"C","text":"基金托管人在基金估值复核过程中未能遵循相关法律法规规定或基金合同约定给基金财产造成损失的，对其行为依法承担赔偿责任"},{"key":"D","text":"当估值或资产计价错误达到或超过基金资产净值的0.5%时，公募基金管理人应及时向中国证监会报告"}],"answer":"D","explain":"基金管理人和托管人分别对估值及其复核承担责任，未按法规或合同约定履职造成基金财产损失的应依法赔偿，管理人还应建立计价错误的识别与应急机制。对于计价错误达到规定比例时的处理，监管要求包含纠正、公告及报告等程序，选项中对该义务的表述并不准确。","chapter":"计价错误责任","disputed":false,"source":{"title":"2025年基金从业《基础知识》真题冲刺练习（7.16）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202507/16171522642301.html"}},{"id":"k2-0122","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"某只基金未使用公允价值对资产进行估值，造成了估值错误。关于该估值错误，以下表述正确的是()。I.若该错误对基金价值的影响不超过0.25%，则可以根据重要性原则予以忽略II.若基金资产公允价值低于估值价格，则该估值错误对持有人更有利III.若基金资产公允价值比估值价格高，则该估值错误对申购的投资者更有利IV.管理人应当立即调整估值模型，以使用最新的资产价格进行估值","options":[{"key":"A","text":"I、II、III、IV"},{"key":"B","text":"III、IV"},{"key":"C","text":"I、IV"},{"key":"D","text":"II、III"}],"answer":"D","explain":"估值偏低时，投资者可以按低于公允价值的价格申购，对申购者有利；估值偏高时，按高于公允价值的价格赎回对赎回者有利，所以Ⅲ的判断成立。重要性豁免有明确门槛且不能随意引用，出现估值错误也不是简单“立即更换模型”就算处理完毕，故Ⅰ、Ⅳ不选。","chapter":"估值错误影响判断","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.13）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/13144905234428.html"}},{"id":"k2-0123","subject":"k2","s ","explain":"资产负债表为时点报表，反映会计季末、半年末或年末的资产、负债和所有者权益状况，可用于分析资产要素、偿债能力与资本结构，Ⅰ、Ⅱ正确。会计恒等关系始终成立；三张报表相互勾稽、共同反映经营情况，因此Ⅲ、Ⅳ的表述不成立。","chapter":"资产负债表信息","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.8）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/08104559165942.html"}},{"id":"k2-0129","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于不动产投资的含义和特点，以下表述错误的是（）","options":[{"key":"A","text":"直接的不动产投资流动性较差，通常表现为若要快速转售，投资者往往要承担较大折价损失"},{"key":"B","text":"直接的不动产投资金额大且难以拆分，这意味着该项投资可能会占据到一个投资组合的很大比例"},{"key":"C","text":"不动产投资是指投资者直接出资购买商业房地产，用于出租获取租金收益或等待增值之后出售获取增值收益"},{"key":"D","text":"不动产投资具有异质性，这使得不动产估值具有一定的难度"}],"answer":"C","explain":"不动产投资既包括直接出资购买商业房地产并出租或待增值出售，也包括通过房地产投资信托、房地产有限合伙等间接方式参与，定义不应只限于直接投资。其流动性差、金额大且难以拆分、异质性强的特点表述本身是正确的。","chapter":"不动产投资特点","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.22）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/22143751211316.html"}},{"id":"k2-0130","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"小张持有某上市公司发行的累积优先股共5000股，没有该公司其他权益资产，该优先股股息率为7%，每股票面价值为100元，以下表述错误的是()。","options":[{"key":"A","text":"小张每年可能从上市公司分得股息35000"},{"key":"B","text":"如果当年该公司经营不善而未能分配股息，未分的股息不能累计，以后也不能补付"},{"key":"C","text":"在公司破产的情况下，对于剩余财产的分配顺序小张优先于其他普通股股东"},{"key":"D","text":"小张对该公司举办的股东大会不享有投票权"}],"answer":"B","explain":"累积优先股的最大特点是被拖欠的股息可以累积到以后年度补付，因此“未分股息不能累计、以后也不能补付”的说法与累积优先股的性质正好相反。其年股息为5000×100×7%＝35000元，清算时受偿顺序优先于普通股，且优先股股东一般无表决权。","chapter":"累积优先股特征","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：累积优先股和非累积优先股-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202306/28164102886087.html"}},{"id":"k2-0131","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"某基金管理人统计了某个基金产品100个交易日的每天净值变化基点值△（单位点），并将△从小到大依次排列分别为△（1）~△（100），其中，△（91）~△（100）为15.75，16.34,16.78，16.85，17.12，17.56，18.41，18.57，18.87，18.99，则△的上25%分位数为（）。","options t":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于战略资产配置以及战术资产配置，以下表述正确的是（）。Ⅰ择时被广泛运用于战略资产配置中Ⅱ当市场环境发生变化时，战术资产配置将在遵守战略资产配置确定的大类资产比例基础上，对投资组合中给特定资产类别的权重配置进行调整Ⅲ战术资产配置是对资产配置状态进行静态调整Ⅳ战术资产配置的周期较短，一般在一年以内","options":[{"key":"A","text":"Ⅱ、Ⅲ"},{"key":"B","text":"Ⅱ、Ⅳ"},{"key":"C","text":"Ⅰ、Ⅱ"},{"key":"D","text":"Ⅰ、Ⅳ"}],"answer":"B","explain":"战术资产配置是在战略资产配置确定的大类资产比例框架内，根据市场环境变化做动态的、幅度受限的短期调整，周期通常在一年以内，Ⅱ、Ⅳ正确。择时属于战术层面的手段；战术配置是动态而非静态调整，故Ⅰ、Ⅲ不选。","chapter":"战略与战术资产配置","disputed":false,"source":{"title":"2025年基金从业《基础知识》真题冲刺练习（7.22）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202507/22175723754289.html"}},{"id":"k2-0141","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"甲、乙、丙三个债券的面额均为100元，已知下列信息，哪个债券的到期收益率最低？()I.债券甲的市场价格为101.9元，票面利率为5%，到期时间为2年II.债券乙的市场价格为100.0元，票面利率为6%，到期时间为2年III.债券内的市场价格为97.3元，票面利率为5%，到期时间为3年","options":[{"key":"A","text":"信息不足，无法判断"},{"key":"B","text":"丙债券"},{"key":"C","text":"甲债券"},{"key":"D","text":"乙债券"}],"answer":"C","explain":"甲债券市价高于面值属于溢价债券，其到期收益率必然低于票面利率5%；乙债券平价发行，到期收益率等于票面利率6%；丙债券折价发行，到期收益率高于票面利率5%。三者相比甲的到期收益率最低。","chapter":"到期收益率比较","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：债券收益率-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202402/19155039503781.html"}},{"id":"k2-0142","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于财务报表，以下表述错误的是（）","options":[{"key":"A","text":"财务报表按照财务会计准则定期编制，用以显示企业实际的财务状况和经营业绩优劣"},{"key":"B","text":"利润表反映一定时期内企业的总体经营成果，揭示企业获取利润的能力和经营趋势，又被称为“第一会计报表”"},{"key":"C","text":"资产负债表记录企业某一时点的资产、负债和所有者权益的状况"},{"key":"D","text":"所有者权益主要由股本、资本公积、盈余公积和未分配利润构成"}],"answer":"B","explain":"资产负债表是反映企业某一时点财务状况的报表，因而是“第一会计报表”；利润表反映一定期间的经营成果和盈利能力。所有者权益由股本、资本公积、盈余公积和未分配利润构成，这一表述正确。","chapter":"财务报表体系","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.21）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/21113708555403.html"}},{"id": 2.html"}},{"id":"k2-0146","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"A股票属于B指数的成分股，在2017年一季度中B指数上涨15%，A股票上涨18%，二季度B指数上涨3%，A股票上涨8%;三季度B指数下跌9%，A股票下跌10%;四季度B指数下跌1%，A股票下跌1.5%。以上数据表明()。","options":[{"key":"A","text":"A股票的β系数大于1"},{"key":"B","text":"A股票的β系数小于1(大于0)"},{"key":"C","text":"A股票的β系数等于1"},{"key":"D","text":"A股票的β系数小于0"}],"answer":"A","explain":"β系数衡量个股对市场指数变动的敏感程度，数值上可近似理解为个股涨跌幅相对指数涨跌幅的放大倍数。本例中A股票无论上涨还是下跌的幅度都大于指数，说明其波动被放大，β系数大于1。","chapter":"β系数的含义与判断","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：β系数-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202402/22163208683940.html"}},{"id":"k2-0147","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于上升收益率曲线，以下表述错误的是（）","options":[{"key":"A","text":"上升收益率曲线，又称正向收益率曲线，是最常见的收益率曲线类型"},{"key":"B","text":"上升收益率曲线表明，其他条件不变，同一债券的到期收益率随着时间的推移逐渐上升"},{"key":"C","text":"上升收益率曲线表明，该时点短期债券收益率低于长期债券收益率"},{"key":"D","text":"之所以出现上升收益率的曲线，是因为投资者对期限较长的债券要求较高的风险溢价"}],"answer":"B","explain":"收益率曲线描述的是同一时点上不同期限债券的到期收益率与期限之间的关系，上升（正向）曲线意味着短期收益率低于长期收益率，是常见的曲线形态，成因是投资者对长期债券要求更高的期限风险溢价。选项把横轴从“不同期限”偷换成“同一债券的不同时间”，因此错误。","chapter":"收益率曲线类型","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.20）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/20113526394949.html"}},{"id":"k2-0148","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于基金托管人在估值业务中的责任，以下表述正确的是（）","options":[{"key":"A","text":"当基金托管人对基金管理人采用的估值原则及技术有异议时，以托管人意见为准"},{"key":"B","text":"经与基金管理人协商，基金托管人可不对基金估值进行复核"},{"key":"C","text":"基金托管人有权利对基金估值进行复核，但可以免除相关责任"},{"key":"D","text":"基金托管人进行基金估值复核工作时，可以参考中国证券投资基金业协会的估值指引"}],"answer":"D","explain":"托管人对管理人的估值结果负有复核责任，复核时应按基金合同约定的估值方法、时间和程序进行，并可参考基金业协会发布的估值指引。双方对估值原则或技术有异议时应协商解决，托管人既不能单方说了算，也不能通过与管理人协商而免除复核职责。","chapter":"托管人估值复核责任","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.20）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/20113526394949.html"}},{"id":"k2-0149","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于最大回撤，以下表述错误的是（）。","options":[{"key":"A","text":"最大回撤只能衡最基金损失的大小，不能衡量损失发生的频率"},{"key":"B","text":"最大回撤用于衡量基金经理对下行风险的控制能力"},{"key":"C","text":"某基金2020年1月2日成立，成立时基金净值为1元，净值于2月28日达到最小值0.85元，则该基金成立两个月以来的最大回撤为15%"},{"key":"D","text":"基金的最大回撤与指定的时间区间长短无关"}],"answer":"D","explain":"最大回撤衡量的是指定区间内净值从高点到低点的最大跌幅，用于评价基金经理控制下行风险的能力，它只反映损失幅度而不反映损失出现的频率。该指标与所选时间区间的长短和起点直接相关，因而“与时间区间长短无关”的说法错误。","chapter":"最大回撤指标","disputed":false,"source":{"title":"2025年基金从业《基础知识》真题冲刺练习（7.23）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202507/23175853439409.html"}},{"id":"k2-0150","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于股票型基金的风险管理，以下表述错误的是()。","options":[{"key":"A","text":"某股票型基金的年单边换手率为100%，则其持有股票的平均时间为1年"},{"key":"B","text":"某股票基金的平均市盈率和平均市净率均小于市场指数的市盈率和市净率，则该基金为成长型基金"},{"key":"C","text":"前十大重仓股占比是衡量持股集中度的指标"},{"key":"D","text":"反映股票型基金风险的指标有标准差、B系数、行业集中度、持股数量等"}],"answer":"B","explain":"市盈率、市净率均低于市场指数，说明基金持有的是估值较低的股票，通常属于价值型而非成长型。换手率与平均持有时间反向对应，前十大重仓股占比衡量持股集中度，标准差、β系数、行业集中度和持股数量都是反映股票型基金风险的常用指标。","chapter":"股票基金风险管理","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：股票基金的风险管理-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202307/25155830625210.html"}},{"id":"k2-0151","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于最大回撤，以下表述错误的是（）","options":[{"key":"A","text":"最大回撤只能衡量基金损失的大小，不能衡量损失发生的频率"},{"key":"B","text":"某基金2020年1月2日成立，成立时基金净值为1元，净值与2月28日达到最小值0.85元，则该基金成立两个月以来的最大回撤为15%"},{"key":"C","text":"基金的最大回撤与指定的时间区间长短无关"},{"key":"D","text":"最大回撤用于衡量基金经理对下行风险的控制能力"}],"answer":"C","explain":"最大回撤衡量指定时间区间内净值的最大跌幅，区间起点和长短不同，结果会明显不同，因此“与指定的时间区间长短无关”错误。其余关于回撤幅度的计算、对下行风险控制能力的评价以及不反映发生频率的表述均成立。","chapter":"最大回撤指标","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.23）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/23101850858333.html"}},{"id":"k2-0152","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于资产负债表中的资产项，以下表述正确的是()","options":[{"key":"A","text":"流动资产主要包括货币资金和应收账款等，存货的变现能力较差一般不属于流动资产"},{"key":"B","text":"固定资产属于非流动资产，无形资产属于流动资产"},{"key":"C","text":"流动资产、非流动资产、长期股权投资相加汇总后等于资产负债表中的总资产"},{"key":"D","text":"如果企业的流动资产金额远低于流动负债，说明企业的短期偿债能力可能较差"}],"answer":"D","explain":"流动资产小于流动负债意味着流动比率偏低，企业可能面临短期偿债压力。存货变现能力虽弱但仍属流动资产，无形资产属于非流动资产；总资产还包括长期股权投资等以外的其他项目，并非三项简单相加。","chapter":"资产负债表资产项","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：资产负债表-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202402/05151314394573.html"}},{"id":"k2-0153","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于同业拆借，以下表述正确的是（）。I.中央银行可以通过存款准备金率影响同业拆借利率II.同业拆借市场并不是一个有形市场，只能由拆借双方直接联系完成交易III同业拆借利率是衡量市场流动性的重要指标IV同业拆借的利息是按日结算的，拆息率于每天上午和下午各发布一次","options":[{"key":"A","text":"I、II"},{"key":"B","text":"I、III"},{"key":"C","text":"II、III"},{"key":"D","text":"I、IV"}],"answer":"B","explain":"中央银行可通过调整存款准备金率影响市场资金面和同业拆借利率，同业拆借利率也是衡量市场流动性的重要指标，Ⅰ、Ⅲ成立。同业拆借既可直接联系成交，也可通过中介机构撮合；拆息率的发布频率与利息结算方式也不符合Ⅳ的描述。","chapter":"同业拆借市场","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：同业拆借-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202402/17153450163379.html"}},{"id":"k2-0154","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于股票型基金的风险管理，以下表述错误的是()","options":[{"key":"A","text":"某股票型基金的年单边换手率为100%，则其持有股票的平均时间为1年"},{"key":"B","text":"某股票基金的均市盈率和平均市净率均小于市场指数的市盈率和市净率，则该基金为成长型基金"},{"key":"C","text":"前十大重仓股占比是衡量持股集中度的指标"},{"key":"D","text":"反映股票型基金风险的指标有标准差、β系数、行业集中度、持股数量等"}],"answer":"B","explain":"市盈率与市净率都低于市场指数，说明组合偏向低估值股票，属于价值型基金而非成长型基金。年单边换手率100%约对应平均持有期一年，前十大重仓股占比衡量集中度，标准差、β系数、行业集中度与持股数量都是股票基金的风险指标。","chapter":"股票基金风险管理","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.19）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/19141052680705.html"}},{"id":"k2-0155","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于最大回撤，表述错误的是()","options":[{"key":"A","text":"基金的最大回撤与指定的时间区间长短无关"},{"key":"B","text":"某基金2020年1月2日成立，成立时基金净值为1元，净值于2月28日达到最小值0.85元，则该基金成立两个月以来的最大回撤为15%"},{"key":"C","text":"最大回撤用于衡量基金经理对下行风险的控制能力"},{"key":"D","text":"最大回撤只能衡量基金损失的大小，不能衡量损失发生的频率"}],"answer":"A","explain":"最大回撤是特定时间区间内的最大跌幅，改变区间长短或起点都会改变结果，所以“与指定的时间区间长短无关”表述错误。其余关于回撤幅度计算、下行风险控制能力评价以及只反映幅度不反映频率的说法均正确。","chapter":"最大回撤指标","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.9）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/09104834188442.html"}},{"id":"k2-0156","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"某基金在2015年1月1日单位净值为1.1元，2015年12月31日单位净值为1.02元，其中在2015年8月30日该基金每份额派发红利0.2元。该基金在2015年8月29日(除息前一天)的单位净值为1.21元，则该基金在2015年全年的加权收益率为()","options":[{"key":"A","text":"11.1%"},{"key":"B","text":"-11%"},{"key":"C","text":"-7.27%"},{"key":"D","text":"21.1%"}],"answer":"A","explain":"计算基金收益率时须把分红视同再投资计入。全年收益可通过分段连乘得到：先算除息前净值增长，再把每份0.2元红利按除息前净值折算为份额继续投资，最终全年加权收益率约为11.1%。忽略分红直接对比期初期末净值会低估收益。","chapter":"基金加权收益率","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：时间加权收益率的计算方法-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202308/20094935356335.html"}},{"id":"k2-0157","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于战略资产配置和战术资产配置，以下表述中正确的是（）。","options":[{"key":"A","text":"战术资产配置更多地关注市场的短期波动，强调根据市场的变化调节各大类资产之间的分配比例"},{"key":"B","text":"战略资产配置需要在战术资产配置调整的比例基础上进行"},{"key":"C","text":"战术资产配置对战略资产配置的偏离幅度不受限制"},{"key":"D","text":"战略资产配置确定后，通常可以在短时间内调节各类资产的配置比例"}],"answer":"A","explain":"战术资产配置关注市场短期波动，是在战略资产配置确定的大类比例基础上做适度偏离的调整，偏离幅度受到限制。战略配置是长期安排、确定在先，调整周期长，不能理解为可以在短期内随意调节各类资产比例。","chapter":"资产配置类型","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：战略资产配置与战术资产配置-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202307/1817211171467.html"}},{"id":"k2-0158","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于资产负债表中的信息，下列选项表述均错误的是()I.包含了企业占有资源的数量和性质II.资产项揭示了企业资金的资金来源和财务状况III.表中的信息为分析收入来源性质及稳定性提供了基础，可以为收益把关IV.只要研究负债项即可了解企业短期及长期偿债能力","options":[{"key":"A","text":"IIIIIIV"},{"key":"B","text":"IIIIV"},{"key":"C","text":"IIIV"},{"key":"D","text":"IIIIII"}],"answer":"C","explain":"资产负债表提供了企业所占有资源的数量与性质，该表述成立；但资产项说明的是资金的占用形态，资金来源需由负债和所有者权益项目揭示；收入来源的性质与稳定性以及收益质量要结合利润表分析；偿债能力也须同时考察资产和负债两端，故Ⅲ、Ⅳ的表述均错误。","chapter":"资产负债表信息","disputed":true,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.27）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/27145053310333.html"}},{"id":"k2-0159","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于证券和资金结算实行分级结算原则，以下表述错误的是()。","options":[{"key":"A","text":"结算参与人负责办理结算参与人与客户之间的清算交收"},{"key":"B","text":"结算参与人与其客户的证券划付，应当委托证券登记结算机构代为办理"},{"key":"C","text":"证券登记结算结构直接办理证券登记结算机构与客户之间的清算交收"},{"key":"D","text":"证券登记结算机构负责证券登记结算机构与结算参与人之间的集中清算交收"}],"answer":"C","explain":"分级结算原则下，登记结算机构只与结算参与人进行集中清算交收，结算参与人再负责与其客户之间的清算交收，登记结算机构不与客户直接办理结算。客户与结算参与人之间的证券划付可委托登记结算机构代为办理。","chapter":"分级结算原则","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.17）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/17145703813163.html"}},{"id":"k2-0160","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于全球投资业绩标准(GIPS)，以下表述正确的是（）。I.可以提高业绩报告的透明度II.让不同投资管理机构的投资业绩具有可比性III.为了让机构展示业绩良好的组合IV.确保在一致、可靠、公平且可比的基础上报告投资业绩数据","options":[{"key":"A","text":"I、III、IV"},{"key":"B","text":"II、III、IV"},{"key":"C","text":"I、II、IV"},{"key":"D","text":"I、II、III、IV"}],"answer":"C","explain":"GIPS的作用是提高业绩报告的透明度，使不同机构披露的业绩具有可比性，并确保在一致、可靠、公平且可比的基础上报告业绩数据，Ⅰ、Ⅱ、Ⅳ正确。它恰恰是为了避免机构只挑选表现良好的组合展示，故Ⅲ错误。","chapter":"GIPS作用","disputed":true,"source":{"title":"6月基金从业《 金从业《证券投资基金》考前真题冲刺练习（5.11）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/11142845655160.html"}},{"id":"k2-0167","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于基金公司投资交易流程，以下表述错误的是（）。","options":[{"key":"A","text":"交易系统或相关负责人必须严格审核投资交易指令的合法合规性"},{"key":"B","text":"交易员无权选择交易时机，必须严格按照基金经理要求的时机执行交易指令"},{"key":"C","text":"基金公司应当做好交易过程中的风险评估，制定相应的管理措施"},{"key":"D","text":"基金经理只能参与投资交易指令下达不能直接进行交易"}],"answer":"B","explain":"投资交易流程要求指令下达与交易执行相互分离、指令须经合规审核，交易员在授权范围内可以选择具体的交易时机以争取更优成交，而不是机械地按基金经理给定的时点执行。基金经理不得直接下单交易，公司也应做好交易环节的风险评估与管理。","chapter":"投资交易流程","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.26）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/26173451863664.html"}},{"id":"k2-0168","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于凸性为正的债券，以下表述正确的是（）。","options":[{"key":"A","text":"收益率变动时，久期估算价格的变动幅度小于实际价格的变动幅度"},{"key":"B","text":"收益率变动时，久期估算价格的变动幅度等于实际价格的变动幅度"},{"key":"C","text":"收益率降低时，久期估算价格的上升幅度大于实际价格的上升幅度"},{"key":"D","text":"收益率升高时，久期估算价格的下降幅度大于实际价格的下降幅度"}],"answer":"D","explain":"凸性为正意味着价格—收益率曲线向下凸出，实际价格始终高于久期估算的价格。因此当收益率上升时，久期估算出的价格跌幅会大于实际跌幅，收益率下降时久期估算的涨幅则小于实际涨幅，久期法无法完全刻画价格变动。","chapter":"债券凸性特征","disputed":false,"source":{"title":"2025年基金从业《基础知识》真题冲刺练习（7.20）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202507/20175240488270.html"}},{"id":"k2-0169","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"假设某附息的固定利率债券的起息日为2009年6月6日，债券面值100元，每半年支付一次利息。2019年6月6日，该债券的投资者可就每单位债券收到本金和利息共计102.25元，则该债券的期限为()年，票面利率为()。","options":[{"key":"A","text":"9；4.5%"},{"key":"B","text":"10；4.5%"},{"key":"C","text":"10；2.25%"},{"key":"D","text":"9；2.25%"}],"answer":"B","explain":"起息日为2009年6月6日、到期兑付日为2019年6月6日，期限为10年。每半年付息一次，到期共收到102.25元，其中100元为本金，2.25元为半年利息，对应半年票面利率2.25%，年化后票面利率为4.5%。","chapter":"债券期限与票面利率","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题
