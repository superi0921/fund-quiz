  var stats = load(K.stats, { total: 0, right: 0, days: {}, exams: [] });

  function saveAll() { save(K.prog, prog); save(K.wrong, wrong); save(K.fav, fav); save(K.stats, stats); }

  /* ---------------- 工具 ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return pad(m) + ':' + pad(s);
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  var toastTimer;
  function toast(msg) {
    var el = $('#toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 1700);
  }
  function ansText(q) { return q.answer.split('').join(''); }
  function optText(q, key) {
    var o = (q.options || []).filter(function (x) { return x.key === key; })[0];
    return o ? o.text : '';
  }

  /* ---------------- 视图切换 ---------------- */
  var VIEWS = ['home', 'quiz', 'result', 'list', 'stats'];
  var currentView = 'home';

  function show(view, skipHistory) {
    VIEWS.forEach(function (v) { var el = $('#view-' + v); if (el) el.hidden = (v !== view); });
    currentView = view;

    var tabOf = view === 'list' ? state.listKind : view;
    $$('.nav-btn[data-nav], .tab-btn[data-nav]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-nav') === tabOf);
    });

    // 手机端：答题时隐藏站点导航与底部标签栏，并收起抽屉
    document.body.classList.toggle('in-quiz', view === 'quiz');
    if (view !== 'quiz') closeSheet();
    $('#cardBtn').classList.toggle('on', false);

    // 让手机返回键 / 侧滑返回能回到上一个视图
    if (!skipHistory) {
      try { history.pushState({ view: view }, ''); } catch (e) { /* 忽略 */ }
    }
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  /* ---------------- 答题卡抽屉 ---------------- */
  function openSheet() {
    document.body.classList.add('sheet-open');
    var bd = $('#sheetBackdrop'); if (bd) bd.hidden = false;
  }
  function closeSheet() {
    document.body.classList.remove('sheet-open');
    var bd = $('#sheetBackdrop'); if (bd) bd.hidden = true;
  }
  function toggleSheet() {
    if (document.body.classList.contains('sheet-open')) closeSheet(); else openSheet();
  }

  /* ---------------- 状态 ---------------- */
  var state = {
    subject: (BANK.subjects && BANK.subjects[0] && BANK.subjects[0].key) || 'k1',
    sessions: {},        // 已选场次集合
    chapter: '',
    listKind: 'wrong',
    quiz: null,
    lastFiltered: []
  };

  /* ---------------- 首页 ---------------- */
  function subjectQuestions(key) { return QS.filter(function (q) { return q.subject === key; }); }

  function filteredQuestions() {
    var sess = Object.keys(state.sessions).filter(function (k) { return state.sessions[k]; });
    return QS.filter(function (q) {
      if (q.subject !== state.subject) return false;
      if (sess.length && sess.indexOf(q.session) === -1) return false;
      if (state.chapter && q.chapter !== state.chapter) return false;
      return true;
    });
  }

  function subjectStat(key) {
    var list = subjectQuestions(key), done = 0, right = 0;
    list.forEach(function (q) { if (prog[q.id]) { done++; if (prog[q.id].c) right++; } });
    return { total: list.length, done: done, right: right, rate: done ? right / done : 0, cover: list.length ? done / list.length : 0 };
  }

  function renderHome() {
    var subs = BANK.subjects || [];
    $('#subjectGrid').innerHTML = subs.map(function (s) {
      var st = subjectStat(s.key);
      var on = s.key === state.subject ? ' on' : '';
      return '<button class="subject-card' + on + '" data-subject="' + s.key + '">' +
        '<h3>' + esc(s.short + ' · ' + s.name) + '</h3>' +
        '<div class="sc-meta"><span>共 ' + s.count + ' 题</span><span>已练 ' + st.done + ' 题</span>' +
        '<span>正确率 ' + (st.done ? Math.round(st.rate * 100) + '%' : '—') + '</span></div>' +
        '<div class="sc-count">' + s.count + '<em>题可练</em></div>' +
        '<div class="sc-bar"><i style="width:' + Math.round(st.cover * 100) + '%"></i></div>' +
        '</button>';
    }).join('');

    $('#heroStats').innerHTML =
      '<div><b>' + QS.length + '</b><span>题库总题量</span></div>' +
      '<div><b>' + Object.keys(prog).length + '</b><span>已练题目</span></div>' +
      '<div><b>' + Object.keys(wrong).length + '</b><span>错题待复习</span></div>' +
      '<div><b>' + (stats.total ? Math.round(stats.right / stats.total * 100) + '%' : '—') + '</b><span>累计正确率</span></div>';

    $('#modeGrid').innerHTML = MODES.map(function (m) {
      return '<button class="mode-card" data-mode="' + m.key + '">' +
        '<span class="mc-icon">' + m.icon + '</span><b>' + m.name + '</b><span>' + m.desc + '</span></button>';
    }).join('');

    renderFilters();
    $('#sourceNotice').innerHTML =
      '<b>关于题库：</b>' + esc(BANK.meta.note || '') + '<br>' +
      '<b>数据来源：</b>' + esc(BANK.meta.source || '') + '<br>' +
      '<b>关于解析：</b>' + esc(BANK.meta.explainNote || '') + ' 使用中如发现题目或答案有疑问，请以官方教材与考试大纲为准。';
    var sub = $('#brandSub');
    if (sub) sub.textContent = '共 ' + QS.length + ' 题 · 三科合集';
    $('#footerNote').innerHTML = esc(BANK.meta.title || '基金从业资格考试题库') +
      ' · 更新于 ' + esc((BANK.meta.updated || '').slice(0, 10)) + ' · 仅用于个人学习自测';
    updateBadges();
  }

  function renderFilters() {
    var subs = (BANK.subjects || []).filter(function (s) { return s.key === state.subject; })[0];
    var sessions = (subs && subs.sessions) || [];
    $('#sessionChips').innerHTML = sessions.map(function (s) {
      return '<button class="chip' + (state.sessions[s] ? ' on' : '') + '" data-session="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('') || '<span class="chip" style="cursor:default">暂无场次信息</span>';

    var chapters = {};
    subjectQuestions(state.subject).forEach(function (q) { if (q.chapter) chapters[q.chapter] = (chapters[q.chapter] || 0) + 1; });
    var names = Object.keys(chapters).sort();
    var sel = $('#chapterSelect');
    sel.innerHTML = '<option value="">全部考点</option>' + names.map(function (c) {
      return '<option value="' + esc(c) + '"' + (state.chapter === c ? ' selected' : '') + '>' + esc(c) + '（' + chapters[c] + '）</option>';
    }).join('');
    if (state.chapter && names.indexOf(state.chapter) === -1) { state.chapter = ''; sel.value = ''; }

    var n = filteredQuestions().length;
    var picked = Object.keys(state.sessions).filter(function (k) { return state.sessions[k]; }).length;
    $('#filterTip').innerHTML = '当前范围：<b>' + n + '</b> 题' +
      (picked ? '（已限定 ' + picked + ' 个场次）' : '（全部场次）') +
      (state.chapter ? '（考点：' + esc(state.chapter) + '）' : '');
    $('#filterPanel').dataset.count = n;
  }

  function updateBadges() {
    var w = Object.keys(wrong).length, f = Object.keys(fav).length;
    $$('[data-badge="wrong"]').forEach(function (el) {
      el.textContent = w;
      if (w) el.removeAttribute('data-empty'); else el.setAttribute('data-empty', '1');
    });
    $$('[data-badge="fav"]').forEach(function (el) {
      el.textContent = f;
      if (f) el.removeAttribute('data-empty'); else el.setAttribute('data-empty', '1');
    });
  }

  /* ---------------- 模式定义 ---------------- */
  var MODES = [
    { key: 'practice', icon: '📝', name: '顺序练习', desc: '按场次从新到旧逐题作答，选完立刻看答案与解析。' },
    { key: 'random', icon: '🔀', name: '随机练习', desc: '在当前筛选范围内随机抽题，边做边看解析。' },
    { key: 'study', icon: '📖', name: '背题模式', desc: '直接展示正确答案与解析，快速过一遍考点。' },
    { key: 'exam', icon: '⏱️', name: '模拟考试', desc: '100 题 / 120 分钟，交卷后统一评分，60 分合格。' },
    { key: 'wrong', icon: '❌', name: '错题重做', desc: '只练做错的题，答对后自动移出错题本。' },
    { key: 'fav', icon: '⭐', name: '收藏练习', desc: '练习你手动收藏的重点题目。' }
  ];

  /* ---------------- 开始练习 ---------------- */
  function startQuiz(mode) {
    var list;
    if (mode === 'wrong') {
      list = QS.filter(function (q) { return wrong[q.id] && (!state.subject || q.subject === state.subject); });
    } else if (mode === 'fav') {
      list = QS.filter(function (q) { return fav[q.id] && (!state.subject || q.subject === state.subject); });
    } else {
      list = filteredQuestions();
    }
    if (!list.length) { toast(mode === 'wrong' ? '当前科目还没有错题' : mode === 'fav' ? '还没有收藏题目' : '没有符合条件的题目'); return; }

    if (mode === 'random') list = shuffle(list.slice()).slice(0, Math.min(list.length, 50));
    if (mode === 'exam') list = shuffle(list.slice()).slice(0, Math.min(list.length, 100));

    state.quiz = {
      mode: mode,
      subject: state.subject,
      list: list,
      idx: 0,
      picks: {},        // id -> [keys]
      revealed: {},     // id -> true
      rightIds: {}, wrongIds: {},
      startTs: Date.now(),
      endTs: 0,
      limitSec: mode === 'exam' ? 120 * 60 : 0,
      timer: null
    };
    var m = MODES.filter(function (x) { return x.key === mode; })[0];
    $('#quizModeTag').textContent = m.name + ' · ' + subjectName(state.subject);
    $('#quizTimer').hidden = mode !== 'exam';
    if (mode === 'exam') startTimer();
    show('quiz');
    renderQuestion();
  }

  function subjectName(key) {
    var s = (BANK.subjects || []).filter(function (x) { return x.key === key; })[0];
    return s ? s.short : key;
  }

  function startTimer() {
    var q = state.quiz;
    clearInterval(q.timer);
    var tick = function () {
      var left = q.limitSec - Math.round((Date.now() - q.startTs) / 1000);
      var el = $('#quizTimer');
      if (!el) return;
      el.textContent = '⏱ ' + fmtTime(left);
      el.classList.toggle('low', left <= 300);
      if (left <= 0) { clearInterval(q.timer); finishQuiz(true); }
    };
    tick();                                    // 立即显示，避免首帧空白
    q.timer = setInterval(tick, 500);
  }

  function quitQuiz(silent) {
    var q = state.quiz;
    if (!q) { show('home'); return; }
    if (q.mode === 'exam' && !silent) {
      var answered = Object.keys(q.picks).length;
      if (!confirm('模拟考试尚未交卷（已答 ' + answered + '/' + q.list.length + ' 题），确定退出吗？退出后本次成绩不记录。')) return;
    }
    clearInterval(q.timer);
    closeSheet();
    state.quiz = null;
    show('home');
    renderHome();
  }

  /* ---------------- 渲染题目 ---------------- */
  function renderQuestion() {
    var q = state.quiz; if (!q) return;
    var item = q.list[q.idx];
    var pick = q.picks[item.id] || [];
    var revealed = !!q.revealed[item.id] || q.mode === 'study';
    var correct = pick.join('') === item.answer;

    $('#quizCounter').textContent = (q.idx + 1) + ' / ' + q.list.length + ' 题';
    $('#progressBar').style.width = ((q.idx + 1) / q.list.length * 100) + '%';

    var isMulti = item.type === 'multi' || item.answer.length > 1;
    var meta = '<div class="q-meta">' +
      '<span class="tag brand">' + esc(item.subjectShort) + '</span>' +
      '<span class="tag">' + esc(item.session) + '</span>' +
      (item.chapter ? '<span class="tag">' + esc(item.chapter) + '</span>' : '') +
      '<span class="tag' + (isMulti ? ' multi' : '') + '">' + (isMulti ? '多选题' : '单选题') + '</span>' +
      (item.disputed ? '<span class="tag warn" title="题库中存在同题不同答案的版本，请以教材为准">⚠ 答案存疑</span>' : '') +
      '</div>';

    var opts = item.options.map(function (o) {
      var cls = 'opt';
      if (revealed) {
        if (item.answer.indexOf(o.key) > -1) cls += ' right';
        else if (pick.indexOf(o.key) > -1) cls += ' wrong';
      } else if (pick.indexOf(o.key) > -1) cls += ' sel';
      return '<button class="' + cls + '" data-opt="' + o.key + '"' + (revealed ? ' disabled' : '') + '>' +
        '<span class="key">' + o.key + '</span><span class="txt">' + esc(o.text) + '</span></button>';
    }).join('');

    var explain = '';
    if (revealed) {
      var ok = correct || q.mode === 'study';
      var body = item.explain || '（本题暂无解析，请结合教材相应章节理解。）';
      explain = '<div class="explain">' +
        '<div class="ex-head"><span class="verdict ' + (q.mode === 'study' ? 'ok' : (correct ? 'ok' : 'bad')) + '">' +
        (q.mode === 'study' ? '正确答案' : (correct ? '回答正确' : '回答错误')) + '</span>' +
        '<span>正确答案：' + esc(ansText(item)) + '</span>' +
        (q.mode !== 'study' && !correct ? '<span style="color:var(--text-3);font-weight:400">你选了：' + (pick.length ? esc(pick.join('')) : '未作答') + '</span>' : '') +
        '</div>' +
        '<div class="ex-body">' + esc(body) + '</div>' +
        (item.disputed ? '<div class="ex-warn">⚠️ 本题在回忆版题库中存在答案不一致的版本，此处采用其中一种说法，请以官方教材为准。</div>' : '') +
        '<div class="ex-src">题目为考生回忆版整理' + (item.source && item.source.url ? '，来源：<a href="' + esc(item.source.url) + '" target="_blank" rel="noopener">' + esc(item.source.title || '原文') + '</a>' : '') + '</div>' +
        '</div>';
    }

    // 考试模式不即时对答案，但可以直接翻页
    var canAdvance = revealed || q.mode === 'exam';
    var actions = '<div class="q-actions">' +
      '<button class="ghost-btn" id="prevBtn"' + (q.idx === 0 ? ' disabled' : '') + '>上一题</button>' +
      (canAdvance
        ? '<button class="primary-btn" id="nextBtn">' +
          (q.idx === q.list.length - 1 ? (q.mode === 'exam' ? '交卷' : '完成练习') : '下一题') + '</button>'
        : (isMulti ? '<button class="primary-btn" id="checkBtn">确认答案</button>' : '')) +
      '<span class="spacer"></span>' +
      '<button class="ghost-btn" id="favToggle">' + (fav[item.id] ? '★ 已收藏' : '☆ 收藏') + '</button>' +
      '</div>';

    $('#qCard').innerHTML = meta +
      '<div class="q-stem"><span class="qno">' + (q.idx + 1) + '.</span>' + esc(item.stem) + '</div>' +
      '<div class="opts" id="opts">' + opts + '</div>' + explain + actions;

    $$('#opts .opt').forEach(function (btn) {
      btn.addEventListener('click', function () { pickOption(btn.dataset.opt); });
    });
    var pb = $('#prevBtn'); if (pb) pb.addEventListener('click', function () { go(-1); });
    var nb = $('#nextBtn'); if (nb) nb.addEventListener('click', nextOrFinish);
    var cb = $('#checkBtn'); if (cb) cb.addEventListener('click', function () { reveal(); });
    var fb = $('#favToggle'); if (fb) fb.addEventListener('click', toggleFav);

    renderCard();
    var favBtn = $('#favBtn');
    if (favBtn) favBtn.textContent = fav[item.id] ? '★ 已收藏本题' : '☆ 收藏本题';
    if (favBtn) favBtn.classList.toggle('on', !!fav[item.id]);
  }

  function renderCard() {
    var q = state.quiz; if (!q) return;
    $('#cardGrid').innerHTML = q.list.map(function (item, i) {
      var cls = 'card-cell';
      if (q.mode === 'study') { if (q.revealed[item.id] !== false && i <= q.idx) cls += ' done'; }
      else if (q.rightIds[item.id]) cls += ' right';
      else if (q.wrongIds[item.id]) cls += ' wrong';
      else if (q.revealed[item.id]) cls += ' done';
      else if (q.picks[item.id] && q.picks[item.id].length) cls += ' done';
      if (i === q.idx) cls += ' cur';
      return '<button class="' + cls + '" data-jump="' + i + '">' + (i + 1) + '</button>';
    }).join('');
    $$('#cardGrid .card-cell').forEach(function (c) {
      c.addEventListener('click', function () {
        state.quiz.idx = parseInt(c.dataset.jump, 10);
        renderQuestion();
        // 手机上选完题自动收起抽屉
        if (window.matchMedia('(max-width: 768px)').matches) closeSheet();
      });
    });
  }

  function pickOption(key) {
    var q = state.quiz, item = q.list[q.idx];
    if (q.revealed[item.id] || q.mode === 'study') return;
    var isMulti = item.type === 'multi' || item.answer.length > 1;
    var pick = q.picks[item.id] || [];
    if (isMulti) {
      var i = pick.indexOf(key);
      if (i > -1) pick.splice(i, 1); else pick.push(key);
      pick.sort();
      q.picks[item.id] = pick;
      renderQuestion();
    } else {
      q.picks[item.id] = [key];
      renderQuestion();
      if (q.mode !== 'exam') setTimeout(reveal, 120);   // 考试模式不即时对答案
    }
  }

  function reveal() {
    var q = state.quiz, item = q.list[q.idx];
    if (q.mode === 'exam' || q.mode === 'study') return;
    var pick = q.picks[item.id] || [];
    if (!pick.length) { toast('请先选择答案'); return; }
    if (q.revealed[item.id]) return;
    q.revealed[item.id] = true;

    var right = pick.join('') === item.answer;
    if (q.mode !== 'study') {
      // 记录进度与统计
      var isFirst = !prog[item.id];
      prog[item.id] = { c: right ? 1 : 0, n: (prog[item.id] ? prog[item.id].n : 0) + 1, t: Date.now() };
      stats.total++; if (right) stats.right++;
      var d = today(); stats.days[d] = (stats.days[d] || 0) + 1;
      if (right) {
        q.rightIds[item.id] = true;
        if (wrong[item.id]) { wrong[item.id].n--; if (wrong[item.id].n <= 0) delete wrong[item.id]; }
      } else {
        q.wrongIds[item.id] = true;
        wrong[item.id] = { n: (wrong[item.id] ? wrong[item.id].n : 0) + 1, t: Date.now() };
      }
      saveAll(); updateBadges();
    }
    renderQuestion();
    if (!right && q.mode !== 'study') {
      setTimeout(function () { toast('答错了，已加入错题本'); }, 150);
    }
  }

  function go(delta) {
    var q = state.quiz;
    if (['practice', 'random', 'wrong', 'fav'].indexOf(q.mode) > -1) {
      var cur = q.list[q.idx];
      if (!q.revealed[cur.id] && q.picks[cur.id] && q.picks[cur.id].length) reveal();
    }
    var n = q.idx + delta;
    if (n < 0 || n >= q.list.length) return;
    q.idx = n; renderQuestion();
  }

  function nextOrFinish() {
    var q = state.quiz;
    if (q.idx >= q.list.length - 1) {
      if (q.mode === 'exam' && !confirm('已是最后一题，确定交卷吗？')) return;
      finishQuiz(false);
      return;
    }
    q.idx++; renderQuestion();
  }

  function toggleFav() {
    var item = state.quiz.list[state.quiz.idx];
    if (fav[item.id]) { delete fav[item.id]; toast('已取消收藏'); }
    else { fav[item.id] = Date.now(); toast('已收藏'); }
    save(K.fav, fav); updateBadges(); renderQuestion();
  }

  function jumpWrong() {
    var q = state.quiz;
    for (var i = q.idx + 1; i < q.list.length; i++) if (q.wrongIds[q.list[i].id]) { q.idx = i; renderQuestion(); return; }
    for (var j = 0; j < q.idx; j++) if (q.wrongIds[q.list[j].id]) { q.idx = j; renderQuestion(); return; }
    toast('本组暂无错题');
  }

  /* ---------------- 交卷 / 结果 ---------------- */
  function finishQuiz(auto) {
    var q = state.quiz; if (!q) return;
    clearInterval(q.timer);
    q.endTs = Date.now();
    var used = Math.round((q.endTs - q.startTs) / 1000);
    var right = 0, done = 0, skipped = 0;
    q.list.forEach(function (item) {
      var pick = q.picks[item.id] || [];
      if (!pick.length) { skipped++; return; }
      done++;
      var ok = pick.join('') === item.answer;
      if (ok) { right++; q.rightIds[item.id] = true; }
      else { q.wrongIds[item.id] = true; }
      if (q.mode === 'exam') {
        // 考试模式交卷时统一记账；练习模式在作答时已记账；背题模式不记分
        prog[item.id] = { c: ok ? 1 : 0, n: (prog[item.id] ? prog[item.id].n : 0) + 1, t: Date.now() };
        stats.total++; if (ok) stats.right++;
        if (!ok) wrong[item.id] = { n: (wrong[item.id] ? wrong[item.id].n : 0) + 1, t: Date.now() };
        else if (wrong[item.id]) { wrong[item.id].n--; if (wrong[item.id].n <= 0) delete wrong[item.id]; }
      }
    });
    if (q.mode === 'exam') {
      var d = today();
      stats.days[d] = (stats.days[d] || 0) + done;
      stats.exams.push({ t: Date.now(), subject: q.subject, total: q.list.length, done: done, right: right, used: used });
      if (stats.exams.length > 50) stats.exams = stats.exams.slice(-50);
    }
    saveAll(); updateBadges();

    var total = q.list.length;
    var score = total ? Math.round(right / total * 100) : 0;
    var pass = score >= 60;
    $('#resultHero').innerHTML =
      '<div class="score ' + (pass ? 'pass' : 'fail') + '">' + score + '<span style="font-size:20px">分</span></div>' +
      '<div class="verdict-line" style="color:' + (pass ? 'var(--ok)' : 'var(--bad)') + '">' +
      (pass ? '✅ 达到合格线（60 分）' : '⚠️ 未达合格线（60 分）') + '</div>' +
      '<div class="sub">共 ' + total + ' 题 · 作答 ' + done + ' 题' + (skipped ? ' · 未作答 ' + skipped + ' 题' : '') +
      ' · 答对 ' + right + ' 题 · 用时 ' + fmtTime(used) + (auto ? ' · 时间到自动交卷' : '') + '</div>';

    // 按考点统计
    var byCh = {};
    q.list.forEach(function (item) {
      var c = item.chapter || '未分类考点';
      byCh[c] = byCh[c] || { n: 0, r: 0 };
      byCh[c].n++;
      var pick = q.picks[item.id] || [];
      if (pick.length && pick.join('') === item.answer) byCh[c].r++;
    });
    var rows = Object.keys(byCh).map(function (c) {
      var o = byCh[c], rate = o.r / o.n;
      return { c: c, n: o.n, r: o.r, rate: rate };
    }).sort(function (a, b) { return a.rate - b.rate; });
    $('#resultByChapter').innerHTML = rows.length ? rows.map(function (o) {
      var cls = o.rate >= 0.8 ? '' : (o.rate >= 0.6 ? 'mid' : 'bad');
      return '<div class="cs-row"><div class="cs-top"><b>' + esc(o.c) + '</b><span>' + o.r + '/' + o.n +
        '（' + Math.round(o.rate * 100) + '%）</span></div>' +
        '<div class="cs-bar"><i class="' + cls + '" style="width:' + (o.rate * 100) + '%"></i></div></div>';
    }).join('') : '<div class="empty" style="padding:20px">暂无数据</div>';

    var wrongItems = q.list.filter(function (item) {
      var pick = q.picks[item.id] || [];
      return !pick.length || pick.join('') !== item.answer;
    });
    $('#resultWrong').innerHTML = wrongItems.length ? wrongItems.slice(0, 60).map(function (item) {
      var pick = q.picks[item.id] || [];
      return '<div class="wrong-item" data-goto="' + esc(item.id) + '">' +
        '<div class="wi-stem">' + esc(item.stem) + '</div>' +
        '<div class="wi-ans">你的答案 <b class="bad">' + (pick.length ? esc(pick.join('')) : '未作答') +
        '</b> · 正确答案 <b class="ok">' + esc(item.answer) + '</b>' +
        ' · ' + esc(optText(item, item.answer.split('')[0])).slice(0, 40) + '</div></div>';
    }).join('') : '<div class="empty" style="padding:20px">🎉 全部答对，没有错题</div>';

    $$('#resultWrong .wrong-item').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.dataset.goto;
        var idx = q.list.map(function (x) { return x.id; }).indexOf(id);
        if (idx > -1) { q.idx = idx; show('quiz'); renderQuestion(); }
      });
    });

    show('result');
  }

  function redoWrong() {
    var q = state.quiz;
    var list = q.list.filter(function (item) {
      var pick = q.picks[item.id] || [];
      return !pick.length || pick.join('') !== item.answer;
    });
    if (!list.length) { toast('没有错题可练'); return; }
    state.subject = q.subject;
    state.quiz = {
      mode: 'practice', subject: q.subject, list: list, idx: 0, picks: {}, revealed: {},
      rightIds: {}, wrongIds: {}, startTs: Date.now(), endTs: 0, limitSec: 0, timer: null
    };
    $('#quizModeTag').textContent = '错题重练 · ' + subjectName(q.subject);
    $('#quizTimer').hidden = true;
    show('quiz'); renderQuestion();
  }

  /* ---------------- 错题本 / 收藏 ---------------- */
  function renderList(kind) {
    state.listKind = kind;
    var src = kind === 'wrong' ? wrong : fav;
    var ids = Object.keys(src);
    var list = ids.map(function (id) { return BY_ID[id]; }).filter(Boolean);
    var subjSel = $('#listSubject');
    var subs = (BANK.subjects || []).filter(function (s) { return list.some(function (q) { return q.subject === s.key; }); });
    var keep = subjSel.value;
    subjSel.innerHTML = '<option value="">全部科目</option>' + subs.map(function (s) {
      return '<option value="' + s.key + '">' + esc(s.name) + '</option>';
    }).join('') + (kind === 'fav' ? '' : '');
    subjSel.value = subs.some(function (s) { return s.key === keep; }) ? keep : '';

    var view = list.filter(function (q) { return !subjSel.value || q.subject === subjSel.value; });
    view.sort(function (a, b) { return (src[b.id].t || src[b.id] || 0) - (src[a.id].t || src[a.id] || 0); });

    $('#listTitle').textContent = (kind === 'wrong' ? '错题本' : '我的收藏') + '（' + list.length + ' 题）';
    $('#listClear').textContent = kind === 'wrong' ? '清空错题本' : '清空收藏';
    $('#listStart').disabled = view.length === 0;

    $('#listBody').innerHTML = view.length ? view.map(function (q) {
      var pr = prog[q.id];
      return '<div class="list-card">' +
        '<div class="lc-stem">' + esc(q.stem) + '</div>' +
        '<div class="lc-opts">' + q.options.map(function (o) {
          return '<div class="' + (q.answer.indexOf(o.key) > -1 ? 'ok' : '') + '">' + o.key + '. ' + esc(o.text) + '</div>';
        }).join('') + '</div>' +
        (q.explain ? '<div class="lc-meta" style="margin-bottom:8px;color:var(--text-2)">💡 ' + esc(q.explain) + '</div>' : '') +
        '<div class="lc-meta"><span class="tag brand">' + esc(q.subjectShort) + '</span><span class="tag">' + esc(q.session) + '</span>' +
        (q.chapter ? '<span class="tag">' + esc(q.chapter) + '</span>' : '') +
        (kind === 'wrong' ? '<span>错 ' + (wrong[q.id] ? wrong[q.id].n : 0) + ' 次</span>' : '') +
        (pr ? '<span>上次' + (pr.c ? '答对' : '答错') + '</span>' : '') +
        '</div></div>';
    }).join('') : '<div class="empty"><span class="em-icon">' + (kind === 'wrong' ? '🎯' : '⭐') + '</span>' +
      (kind === 'wrong' ? '还没有错题，去练习吧' : '还没有收藏任何题目') + '</div>';
  }

  /* ---------------- 统计 ---------------- */
  function renderStats() {
    var done = Object.keys(prog).length;
    var days = Object.keys(stats.days).length;
    var rate = stats.total ? Math.round(stats.right / stats.total * 100) : 0;
    var exams = stats.exams || [];
    var avg = exams.length ? Math.round(exams.reduce(function (s, e) { return s + (e.total ? e.right / e.total * 100 : 0); }, 0) / exams.length) : 0;
    var best = exams.length ? Math.max.apply(null, exams.map(function (e) { return e.total ? Math.round(e.right / e.total * 100) : 0; })) : 0;
    $('#statCards').innerHTML =
      card(done + '/' + QS.length, '已练题目（覆盖 ' + (QS.length ? Math.round(done / QS.length * 100) : 0) + '%）') +
      card(rate + '%', '累计正确率（共作答 ' + stats.total + ' 次）') +
      card(Object.keys(wrong).length, '当前错题数') +
      card(exams.length, '模拟考试次数（平均 ' + avg + ' 分 / 最高 ' + best + ' 分）') +
      card(days, '有学习记录的天数');

    var bySub = {};
    QS.forEach(function (q) {
      var p = prog[q.id]; if (!p) return;
      bySub[q.subject] = bySub[q.subject] || { n: 0, r: 0, total: 0 };
      bySub[q.subject].n++; if (p.c) bySub[q.subject].r++;
    });
    (BANK.subjects || []).forEach(function (s) { if (bySub[s.key]) bySub[s.key].total = s.count; });
    var rows = Object.keys(bySub).map(function (k) {
      var o = bySub[k];
      return { name: subjectName(k) + ' · ' + (BANK.subjects.filter(function (s) { return s.key === k; })[0] || {}).name, n: o.n, r: o.r, rate: o.r / o.n };
    }).sort(function (a, b) { return a.rate - b.rate; });
    $('#statBySubject').innerHTML = rows.length ? rows.map(function (o) {
      var cls = o.rate >= 0.8 ? '' : (o.rate >= 0.6 ? 'mid' : 'bad');
      return '<div class="cs-row"><div class="cs-top"><b>' + esc(o.name) + '</b><span>' + o.r + '/' + o.n +
        '（' + Math.round(o.rate * 100) + '%）</span></div>' +
        '<div class="cs-bar"><i class="' + cls + '" style="width:' + (o.rate * 100) + '%"></i></div></div>';
    }).join('') : '<div class="empty" style="padding:20px">暂无做题记录</div>';

    var ch = {};
    QS.forEach(function (q) {
      if (!prog[q.id]) return;
      var c = q.chapter || '未分类考点';
      ch[c] = ch[c] || { n: 0, r: 0 };
      ch[c].n++; if (prog[q.id].c) ch[c].r++;
    });
    var weak = Object.keys(ch).map(function (c) {
      return { c: c, n: ch[c].n, r: ch[c].r, rate: ch[c].r / ch[c].n };
    }).filter(function (o) { return o.n >= 2; }).sort(function (a, b) { return a.rate - b.rate || b.n - a.n; }).slice(0, 10);
    $('#statWeak').innerHTML = weak.length ? weak.map(function (o) {
      var cls = o.rate >= 0.8 ? '' : (o.rate >= 0.6 ? 'mid' : 'bad');
      return '<div class="cs-row"><div class="cs-top"><b>' + esc(o.c) + '</b><span>' + o.r + '/' + o.n +
        '（' + Math.round(o.rate * 100) + '%）</span></div>' +
        '<div class="cs-bar"><i class="' + cls + '" style="width:' + (o.rate * 100) + '%"></i></div></div>';
    }).join('') : '<div class="empty" style="padding:20px">多做一些题就能看到薄弱考点了</div>';
  }
  function card(v, l) { return '<div class="stat-card"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>'; }

  /* ---------------- 主题 ---------------- */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    save(K.theme, t);
  }

  /* ---------------- 事件绑定 ---------------- */
  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-nav],[data-subject],[data-mode],[data-session]');
      if (!t) return;
      if (t.dataset.nav) {
        var v = t.dataset.nav;
        if (v === 'home') { state.quiz = null; clearInterval(state.quiz && state.quiz.timer); show('home'); renderHome(); }
        else if (v === 'wrong' || v === 'fav') { renderList(v); show('list'); }
        else if (v === 'stats') { renderStats(); show('stats'); }
        return;
      }
      if (t.dataset.subject) { state.subject = t.dataset.subject; state.sessions = {}; state.chapter = ''; renderHome(); return; }
      if (t.dataset.mode) { startQuiz(t.dataset.mode); return; }
      if (t.dataset.session) { state.sessions[t.dataset.session] = !state.sessions[t.dataset.session]; renderFilters(); return; }
    });

    $('#resetFilter').addEventListener('click', function () {
      state.sessions = {}; state.chapter = ''; renderFilters();
    });
    $('#chapterSelect').addEventListener('change', function (e) {
      state.chapter = e.target.value; renderFilters();
    });
    $('#quitBtn').addEventListener('click', function () { quitQuiz(false); });

    // 答题卡：桌面右侧常驻，手机为底部抽屉
    $('#cardBtn').addEventListener('click', function () {
      toggleSheet();
      $('#cardBtn').classList.toggle('on', document.body.classList.contains('sheet-open'));
    });
    var sheetClose = $('#sheetClose');
    if (sheetClose) sheetClose.addEventListener('click', closeSheet);
    var backdrop = $('#sheetBackdrop');
    if (backdrop) backdrop.addEventListener('click', closeSheet);

    // 手机上：筛选面板可折叠
    var filterToggle = $('#filterToggle');
    if (filterToggle) {
      filterToggle.addEventListener('click', function () {
        var panel = $('#filterPanel');
        var open = panel.getAttribute('data-open') !== 'false';
        panel.setAttribute('data-open', open ? 'false' : 'true');
        filterToggle.setAttribute('aria-expanded', open ? 'false' : 'true');
      });
    }
    $('#favBtn').addEventListener('click', toggleFav);
    $('#jumpWrong').addEventListener('click', jumpWrong);
    $('#submitPaper').addEventListener('click', function () {
      if (!state.quiz) return;
      var q = state.quiz;
      var answered = Object.keys(q.picks).length;
      if (q.mode === 'exam' && answered < q.list.length) {
        if (!confirm('还有 ' + (q.list.length - answered) + ' 题未作答，确定交卷吗？')) return;
      }
      finishQuiz(false);
    });
    $('#againBtn').addEventListener('click', function () {
      var m = state.quiz ? state.quiz.mode : 'practice';
      state.quiz = null; startQuiz(m);
    });
    $('#redoWrongBtn').addEventListener('click', redoWrong);
    $('#listStart').addEventListener('click', function () {
      var list = QS.filter(function (q) {
        var ok = state.listKind === 'wrong' ? wrong[q.id] : fav[q.id];
        return ok && (!state.listKind || !$('#listSubject').value || q.subject === $('#listSubject').value);
      });
      if (!list.length) return;
      state.quiz = {
        mode: 'practice', subject: list[0].subject, list: list, idx: 0, picks: {}, revealed: {},
        rightIds: {}, wrongIds: {}, startTs: Date.now(), endTs: 0, limitSec: 0, timer: null
      };
      $('#quizModeTag').textContent = (state.listKind === 'wrong' ? '错题练习' : '收藏练习');
      $('#quizTimer').hidden = true;
      show('quiz'); renderQuestion();
    });
    $('#listSubject').addEventListener('change', function () { renderList(state.listKind); });
    $('#listClear').addEventListener('click', function () {
      if (!confirm('确定清空吗？此操作不可撤销。')) return;
      if (state.listKind === 'wrong') wrong = {}; else fav = {};
      saveAll(); updateBadges(); renderList(state.listKind);
      toast('已清空');
    });
    $('#resetAll').addEventListener('click', function () {
      if (!confirm('将清除所有答题记录、错题本与收藏，确定继续吗？')) return;
      prog = {}; wrong = {}; fav = {}; stats = { total: 0, right: 0, days: {}, exams: [] };
      saveAll(); updateBadges(); renderStats(); toast('已清除全部记录');
    });
    $('#themeBtn').addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(cur);
    });

    document.addEventListener('keydown', function (e) {
      if (currentView !== 'quiz' || !state.quiz) return;
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
      var k = e.key.toUpperCase();
      if (['A', 'B', 'C', 'D'].indexOf(k) > -1) {
        e.preventDefault();
        pickOption(k);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        var q = state.quiz, item = q.list[q.idx];
        if (q.revealed[item.id] || q.mode === 'study') nextOrFinish();
        else if (q.picks[item.id] && q.picks[item.id].length) reveal();
      } else if (e.key === 'ArrowRight') { e.preventDefault(); if (state.quiz.revealed[state.quiz.list[state.quiz.idx].id]) nextOrFinish(); else go(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    });

    /* ---- 手机：左右滑动切换题目 ---- */
    var touch = null;
    document.addEventListener('touchstart', function (e) {
      if (currentView !== 'quiz' || !state.quiz || document.body.classList.contains('sheet-open')) { touch = null; return; }
      if (e.touches.length !== 1) { touch = null; return; }
      touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
    }, { passive: true });

    document.addEventListener('touchend', function (e) {
      if (!touch || !state.quiz) { touch = null; return; }
      var t0 = touch; touch = null;
      var el = e.changedTouches[0];
      var dx = el.clientX - t0.x, dy = el.clientY - t0.y, dt = Date.now() - t0.t;
      // 横向意图明确、位移足够、且不是长按
      if (dt > 800 || Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      var q = state.quiz, cur = q.list[q.idx];
      if (dx < 0) {
        // 向左滑 → 下一题（未作答则先判分，与点按"下一题"一致）
        if (q.revealed[cur.id] || q.mode === 'exam' || q.mode === 'study') nextOrFinish();
        else if (q.picks[cur.id] && q.picks[cur.id].length) reveal();
        else go(1);
      } else {
        go(-1);
      }
    }, { passive: true });

    /* ---- 手机返回键 / 侧滑返回 ---- */
    window.addEventListener('popstate', function (e) {
      if (document.body.classList.contains('sheet-open')) {
        closeSheet();
        try { history.pushState({ view: currentView }, ''); } catch (err) { /* 忽略 */ }
        return;
      }
      var v = (e.state && e.state.view) || 'home';
      if (v === currentView) return;
      if (currentView === 'quiz' && state.quiz) {
        clearInterval(state.quiz.timer);
        state.quiz = null;
        renderHome();
      }
      show(v, true);
    });
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    applyTheme(load(K.theme, 'light'));
    if (!QS.length) {
      $('#app').innerHTML = '<div class="empty"><span class="em-icon">📭</span>题库数据未能加载，请确认 data/questions.js 存在。</div>';
      return;
    }
    bind();
    renderHome();
    // 手机上默认收起筛选面板，省出屏幕空间
    if (window.matchMedia('(max-width: 768px)').matches) {
      var fp = $('#filterPanel');
      if (fp) { fp.setAttribute('data-open', 'false'); $('#filterToggle').setAttribute('aria-expanded', 'false'); }
    }
    try { history.replaceState({ view: 'home' }, ''); } catch (e) { /* 忽略 */ }
    show('home', true);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
