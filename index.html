-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202308/05151744698181.html"}},{"id":"k2-0173","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于基金的绝对收益归因和相对收益归因，以下表述错误的是（）。","options":[{"key":"A","text":"行业贡献度的计算属于绝对收益归因分析方法"},{"key":"B","text":"相对收益归因主要考察基金如何跑赢或跑输同类基金平均收益率"},{"key":"C","text":"绝对收益归因主要是对基金总收益进行分解，考察各因素对总收益的贡献"},{"key":"D","text":"Brinson模型是对相对收益归因分析的常用模型"}],"answer":"B","explain":"相对收益归因考察的是基金相对于业绩比较基准的跑赢或跑输，而不是与同类基金平均收益率的比较，这是该表述的错误所在。绝对收益归因把基金总收益分解为各因素的贡献，行业贡献度计算属于此类；Brinson模型则是相对收益归因的常用模型。","chapter":"收益归因分析","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（6.4）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202306/04102230314104.html"}},{"id":"k2-0174","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于均值方差模型，以下表述错误的是（）。","options":[{"key":"A","text":"无差异曲线是在期望收益---标准差平面上有相同给定效用的所有点组成的曲线"},{"key":"B","text":"从全局最小方差组合开始，最小方差前沿的下半部分就称为有效前沿"},{"key":"C","text":"市场上可投资产形成的所有组合称为可行集"},{"key":"D","text":"无差异曲线和有效前沿相切的点所代表的投资组合称为最优组合"}],"answer":"B","explain":"有效前沿是从全局最小方差组合开始、位于最小方差前沿上半部分的那一段曲线，而不是下半部分，因此该表述错误。无差异曲线表示相同效用水平的组合轨迹，可行集是市场上可投资产形成的所有组合，无差异曲线与有效前沿的切点即最优组合。","chapter":"均值方差模型","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.4）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/04182221392120.html"}},{"id":"k2-0175","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于中国基金国际化，以下表述错误的是()","options":[{"key":"A","text":"港股通为内地人民币资产配置提供了更加丰富的选择"},{"key":"B","text":"基金互认是基金跨市场销售的一种制度安排"},{"key":"C","text":"开放香港与其他国家和地区的境外投资者购买内地债券属于“北向通”"},{"key":"D","text":"QDII是我国证券市场除了基金公司、证券公司、信托公司之外的另一类重要机构投资者"}],"answer":"D","explain":"QDII是境内机构开展境外证券投资的制度安排，不是与基金公司、证券公司、信托公司并列的机构类型，该表述混淆了制度与主体。港股通拓宽了内地资金配置范围，基金互认是跨市场销售制度，境外投资者投资内地市场属于“北向通”。","chapter":"中国基金国际化","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.10）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/10105104214257.html"}},{"id":"k2-0176","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于风险与收益，以下表述错误的是（）。","options":[{"key":"A","text":"由于无法有效分散，投资者对承担的系统性风险不要求风险溢价"},{"key":"B","text":"投资者承担的风险越高要求的风险溢价越多"},{"key":"C","text":"在其他条件一致时，股票投资者对投资于风险更高的公司要求的期望收益率更高"},{"key":"D","text":"投资者的期望收益率取决于其所期待的风险溢价和无风险收益率的水平"}],"answer":"A","explain":"系统性风险无法通过分散化消除，投资者因承担这部分不可分散的风险而要求相应的风险溢价，故“不要求风险溢价”的说法错误。承担的风险越高要求的风险溢价越多，期望收益率由无风险利率加风险溢价构成，风险更高的公司需要更高的期望收益率补偿。","chapter":"风险与收益关系","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.7）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/07170425439815.html"}},{"id":"k2-0177","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"机构投资人将另类投资产品纳入其传统投资组合的主要原因是()。","options":[{"key":"A","text":"另类投资产品具有强监管，信息透明度高的特性，从而较为安全"},{"key":"B","text":"另类投资产品收益的标准差较小，能分散投资组合的风险"},{"key":"C","text":"纳入另类投资产品可以提高投资回报和分散投资风险"},{"key":"D","text":"纳入另类投资产品可以很大程度上降低投资组合的夏普比率"}],"answer":"C","explain":"机构把另类投资纳入传统组合，主要是看中其收益特征与传统股债的相关性较低，既能争取较高回报又能分散组合风险。另类投资普遍监管较弱、信息透明度较低，价格波动和标准差并不小，纳入后通常有助于改善而非大幅降低夏普比率。","chapter":"另类投资纳入动机","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.18）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/18145909403707.html"}},{"id":"k2-0178","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于基金日常估值程序，以下表述错误的是（）","options":[{"key":"A","text":"基金管理人每个交易日对基金资产估值后，将基金份额净值结果发给基金托管人"},{"key":"B","text":"基金托管人按基金合同规定的估值方法、时间、程序对基金管理人的计算结果进行复核"},{"key":"C","text":"基金份额净值的最终结果由基金注册登记机构对外公告"},{"key":"D","text":"基金日常估值的基金管理人进行"}],"answer":"C","explain":"基金份额净值由基金管理人计算、托管人复核，复核无误后由基金管理人对外公告，而不是由基金注册登记机构公告。日常估值由管理人负责，托管人按合同约定的方法、时间和程序复核。","chapter":"基金日常估值程序","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.16）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/16114139698489.html"}},{"id":"k2-0179","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于均值、方差模型，以下表述错误的是（）。","options":[{"key":"A","text":"无差异曲线是在期望收益标准差平面上由相同给定校用的所有点组成的曲线"},{"key":"B","text":"市场上可投资产所形成的所有组合成为可行集"},{"key":"C","text":"无差异曲线和有效前沿相切的点所代表的投资组合成为最优组合"},{"key":"D","text":"从全局最小方差组合开始，最小方差前沿的下半部分就成为有效前沿"}],"answer":"D","explain":"有效前沿是自全局最小方差组合起的最小方差前沿上半部分，而非下半部分，故该表述错误。无差异曲线由效用相同的组合点构成，可行集是市场上可投资产构成的所有组合，无差异曲线与有效前沿的切点为最优组合。","chapter":"均值方差模型","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.14）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/14113807476332.html"}},{"id":"k2-0180","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"衍生工具是由另一种基础资产构成或衍生而来，关于其中的基础资产，以下表述正确的有（）。Ⅰ.基础资产通常被称作合约标的资产Ⅱ.可以是股票、债券等金融资产Ⅲ.可以是黄金、原油等大宗商品或贵金属Ⅳ.可以是市场利率、股票市场指数","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"B","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"}],"answer":"D","explain":"衍生工具的基础资产即合约标的资产，既可以是股票、债券等金融资产，也可以是黄金、原油等大宗商品，还可以是利率、股票市场指数等变量，四项表述均正确。","chapter":"衍生工具基础资产","disputed":false,"source":{"title":"2025年基金从业《基础知识》真题冲刺练习（7.25）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202507/25180132196176.html"}},{"id":"k2-0181","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"在银行间债券市场上，质押式回购和买断式回购相比较，两种业务的相同之处是()","options":[{"key":"A","text":"在办理回购业务前，市场参与者均应签订主协议和书面形式的合同"},{"key":"B","text":"人民银行规定的回购最长期限相同"},{"key":"C","text":"资金融出方和资金融入方可选择使用单一券种或多个券种进行回购结算"},{"key":"D","text":"资金融出方均能获得回购期间债券的使用权"}],"answer":"A","explain":"质押式回购与买断式回购的相同点是办理前市场参与者都需签订主协议并以书面形式订立合同。两者在期限上限、可质押券种数量以及回购期间债券使用权归属上均存在差别，质押式回购期间融出方不得动用质押券，买断式回购中融出方可获得债券使用权。","chapter":"银行间债券回购","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.25）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/26144637401643.html"}},{"id":"k2-0182","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于股票基本面分析和技术分析，以下表述错误的是（）。","options":[{"key":"A","text":"技术分析不仅关心证券市场本身的变化，也会考虑基本面因素"},{"key":"B","text":"基本面分析的核心在于公司未来的经营业绩和盈利水平"},{"key":"C","text":"基本面分析主要研究宏观经济、行业状况和公司价值等因素"},{"key":"D","text":"技术分析主要研究股价、成交量、图形走势、涨跌幅等因素"}],"answer":"A","explain":"技术分析以股价、成交量、图形走势和涨跌幅等市场自身数据为研究对象，其重要假设之一是市场行为涵盖一切信息，因此并不去考察宏观、行业和公司基本面因素。基本面分析才以宏观经济、行业状况和公司价值为核心，落脚于公司未来经营业绩与盈利水平。","chapter":"基本面与技术分析","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.27）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/27173609887893.html"}},{"id":"k2-0183","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"在其他条件都相同的情况下,以下债券中当期收益率与到期收益率最为接近的是（）。","options":[{"key":"A","text":"5年期债券A,市场价格98,债券面值100"},{"key":"B","text":"10年期债券A,市场价格102,债券面值100"},{"key":"C","text":"10年期债券A,市场价格108,债券面值100"},{"key":"D","text":"5年期债券A,市场价格92,债券面值100"}],"answer":"B","explain":"判断要点：当期收益率是票面利息与市场价格的比值，到期收益率还要把持有至到期的资本利得或损失摊入，因此债券价格偏离面值的幅度越小、剩余期限越短，两者越接近。比较各选项时需要同时衡量折溢价幅度和期限两个因素。","chapter":"当期收益率与到期收益率","disputed":false,"source":{"title":"2025年基金从业《基础知识》真题冲刺练习（7.24）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202507/24180005944040.html"}},{"id":"k2-0184","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于全球投资业绩标准（GIPS），以下表述正确的是（）。Ⅰ可以提高业绩报告的透明度Ⅱ让不同投资管理机构的投资业绩具有可比性Ⅲ为了让机构展示业绩良好的组合Ⅳ确保在一致、可靠、公平且可比的基础上报告投资业绩数据","options":[{"key":"A","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"B","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅳ"}],"answer":"D","explain":"GIPS可以提高业绩报告透明度、让不同机构的业绩具有可比性，并确保在一致、可靠、公平且可比的基础上披露业绩数据，Ⅰ、Ⅱ、Ⅳ正确。它的目的正是规范展示口径，而非让机构只展示业绩良好的组合，故Ⅲ不选。","chapter":"GIPS作用","disputed":true,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.13）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/13171246577933.html"}},{"id":"k2-0185","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于另类投资，以下表述正确的是()。I.另类投资的\"另类\"可以体现在投资标的和投资策略上II.另类投资的\"另类\"可以体现在投资的组织形式上III.另类投资易于通过市场价格法准确估值IV.另类投资中个人投资者多","options":[{"key":"A","text":"III、IV"},{"key":"B","text":"I、IV"},{"key":"C","text":"I、II"},{"key":"D","text":"II、III"}],"answer":"C","explain":"另类投资的“另类”体现在投资标的与投资策略的特殊性，也体现在组织形式（如有限合伙）的非传统安排上，Ⅰ、Ⅱ正确。另类投资往往缺乏公开市场价格，难以用市场价格法准确估值，且以机构投资者为主，故Ⅲ、Ⅳ不选。","chapter":"另类投资特征","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：另类投资内涵和发展-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202401/24115059186322.html"}},{"id":"k2-0186","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于投资组合管理的基本流程，以下表述错误的是（）。","options":[{"key":"A","text":"投资管理的目标是使投资者在获得一定收益水平的同时承担最低的风险定收"},{"key":"B","text":"投资管理的目标是在投资者可共受的风险水平内使其获得最大的收益"},{"key":"C","text":"投资规划的首要任务就是建立战略资配置"},{"key":"D","text":"投资管理过程是一个动态反馈的循环过程"}],"answer":"C","explain":"投资规划的首要任务是明确投资者的投资目标与约束条件，据此确定战略资产配置，而不是一上来就建立战略资产配置，故该表述错误。投资管理旨在既定风险下争取最大收益、或在既定收益目标下承担最低风险，并且是一个动态反馈的循环过程。","chapter":"投资组合管理流程","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：投资组合管理的基本步骤-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202307/14163828910384.html"}},{"id":"k2-0187","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于主动管理基金和股票型指数基金。以下表述正确的是()。","options":[{"key":"A","text":"股票型指数基金投资人收益大幅超越指数的可能性低"},{"key":"B","text":"股票型指数基金的收益总是低于主动管理基金的收益"},{"key":"C","text":"股票型指数基金的管理费率高于主动管理基金的管理费率"},{"key":"D","text":"股票型指数基金的交易费用高于主动管理基金的交易费用"}],"answer":"A","explain":"股票型指数基金以复制标的指数为目标，其收益大幅超越指数的可能性较低。指数基金的收益并不必然低于主动管理基金，其管理费率和交易费用通常低于主动管理基金，这也是指数化投资的成本优势所在。","chapter":"指数基金与主动基金","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.30）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/30101621504146.html"}},{"id":"k2-0188","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于息票债券和贴现债券，以下表述正确的是()。","options":[{"key":"A","text":"贴现债券是指在发行时不规定利率、券面不附息票，折价发行的债券"},{"key":"B","text":"息票债券和贴现债券是按照计息方式分类的两种常见债券类型"},{"key":"C","text":"与息票债券和贴现债券同属一种分类方法下债券类型的还有金融债券"},{"key":"D","text":"息票债券一般来说属于短期债券"}],"answer":"A","explain":"贴现债券在发行时不规定利率、券面不附息票，以低于面值的价格发行，到期按面值偿还，价差即为投资者收益。息票债券与贴现债券是按付息方式划分的类型，金融债券是按发行主体划分的，二者不属同一分类标准；息票债券通常为中長期债券。","chapter":"息票债券与贴现债券","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.20）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/20142502947613.html"}},{"id":"k2-0189","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于基金投资运作过程中的集中交易制度，以下理解正确的是（）。","options":[{"key":"A","text":"基金的投资决策职能与交易执行职能分别是由基金经理与基金交易部门承担的"},{"key":"B","text":"基金经理直接向交易员下达投资指令"},{"key":"C","text":"基金经理直接进行交易"},{"key":"D","text":"交易指令应包含确切的交易价格，交易员严格按照该价格水平进行证券交易"}],"answer":"A","explain":"集中交易制度的核心是投资决策与交易执行相分离：基金经理负责投资决策，交易部门（交易员）负责指令执行，基金经理不能直接下单。交易指令通常只给出数量和方向，具体价格由交易员在授权范围内把握。","chapter":"集中交易制度","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：投资管理部门设置-交易部-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202307/1516410781751.html"}},{"id":"k2-0190","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于债券，以下表述错误的是（）","options":[{"key":"A","text":"按照付息方式，债券可以分为息票债券和贴现债券"},{"key":"B","text":"对已发行的固定利率债券因发行大信用等级降低，发行人要偿付的利息需要相应提高"},{"key":"C","text":"浮动利率债券的票面利率通常与基准利率挂钩"},{"key":"D","text":"零息债券在偿还期内不支付利息，在到期日一次性支付利息和本金"}],"answer":"B","explain":"固定利率债券一经发行，票面利率即被锁定，发行后信用等级下降并不改变已发行债券的应付利息，只会影响其市场价格，因此该表述错误。按付息方式可分为息票债券和贴现债券，浮动利率债券的票面利率与基准利率挂钩，零息债券在存续期不付息、到期一次还本付息。","chapter":"债券分类与特征","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.23）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/23101850858333.html"}},{"id":"k2-0191","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于杜邦分析法，表述错误的是()。","options":[{"key":"A","text":"杜邦分析法是针对总资产收益率进行逐级分解的财务分析方法"},{"key":"B","text":"杜邦分析法有助于深入分析比较企业经营业绩"},{"key":"C","text":"杜邦分析法最早是由美国杜邦公司使用的一种财务分析方法"},{"key":"D","text":"杜邦分析法中，资产收益率可以分解成销售利润率与总资产周转率的乘积"}],"answer":"A","explain":"杜邦分析法是对净资产收益率进行逐级分解，而不是针对总资产收益率，故该表述错误。它可以分解为销售利润率、总资产周转率与权益乘数的乘积，有助于深入比较企业的经营业绩，也是由美国杜邦公司最早使用的财务分析方法。","chapter":"杜邦分析法应用","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：杜邦分析法-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202402/24163521146236.html"}},{"id":"k2-0192","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于系统性风险和非系统性风险，以下表述错误的是（）。","options":[{"key":"A","text":"非系统性风险往往是有某个或者少数错别因素导致的"},{"key":"B","text":"资本市场线上的任一组合都只有非系统性风险"},{"key":"C","text":"系统性风险是指在一定程度上无法通过一定范围内的分散化投资来降低的风险"},{"key":"D","text":"非系统性风险可以通过组合化投资进行分散"}],"answer":"B","explain":"资本市场线上的组合都是充分分散化的有效组合，只承担系统性风险，不含有可通过分散化消除的非系统性风险，因此该表述错误。非系统性风险由个别或少数因素引起，可通过组合化投资分散；系统性风险则无法通过一定范围内的分散投资降低。","chapter":"系统与非系统性风险","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.25）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/25102224356698.html"}},{"id":"k2-0193","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于股票账面价值，以下表述错误的是（）。","options":[{"key":"A","text":"股票的账面价值是股票投资价值分析的重要指标"},{"key":"B","text":"股票的账面价值又称股票净值或每股净资产"},{"key":"C","text":"在有优先股的情况下，每股账面价值以公司净资产除以发行在外的普通股票的股数求得"},{"key":"D","text":"股票的账面价值是每股股票所代表的实际资产的价值"}],"answer":"C","explain":"公司同时发行优先股时，每股账面价值应在净资产中扣除优先股权益后再除以发行在外的普通股股数，直接用净资产除以普通股股数会导致高估，故该表述错误。账面价值又称股票净值或每股净资产，反映每股股票所代表的实际资产价值，是投资价值分析的重要指标。","chapter":"股票账面价值","disputed":false,"source":{"title":"2025年基金从业《基础知识》真题冲刺练习（7.20）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202507/20175240488270.html"}},{"id":"k2-0194","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于期货市场的风险管理功能，以下表述正确的是()。I期货交易可以使风险在具有不同风险偏好的投资者之间进行转移和再分配II期货市场能够提高金融系统抵御风险的能力III期货交易能够消除金融市场系统风险","options":[{"key":"A","text":"I、II"},{"key":"B","text":"I、II、III"},{"key":"C","text":"II、III"},{"key":"D","text":"I、III"}],"answer":"A","explain":"期货市场可以把风险在不同风险偏好的投资者之间转移和再分配，并通过价格发现和风险管理增强金融体系抵御风险的能力，Ⅰ、Ⅱ正确。但期货交易只能转移和分散风险，无法消除金融市场固有的系统性风险，故Ⅲ错误。","chapter":"期货市场风险管理","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：期货市场的基本功能-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202402/29143137467223.html"}},{"id":"k2-0195","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于风险指标，以下表述错误的是（）。","options":[{"key":"A","text":"β系数是评估投资组合系统性风险的指标"},{"key":"B","text":"β系数>0，表示投资组合的价格变动方向与市场一致，B系数不能小于0"},{"key":"C","text":"基金的波动率越高，表示基金的净值波动越剧烈，收益率不确定性越高"},{"key":"D","text":"投资组合的波动率是指单位时间收益率的标准差"}],"answer":"B","explain":"β系数衡量投资组合对市场整体波动的敏感性，其取值可以为负，负值表示组合价格与市场反向变动，因此“β系数不能小于0”的表述错误。波动率是单位时间收益率的标准差，波动率越高说明净值起伏越剧烈、收益不确定性越大。","chapter":"β系数与波动率","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：β系数-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202307/31175513678807.html"}},{"id":"k2-0196","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于风险指标，以下表述错误的是()","options":[{"key":"A","text":"投资组合的波动率是指单位时间收益率的标准差"},{"key":"B","text":"基金的波动率越高，表示基金的净值波动越剧烈，收益率不确定性越高"},{"key":"C","text":"β系数是评估投资组合系统性风险的指标"},{"key":"D","text":"β系数>0，表示投资组合的价格变动方向与市场一致，β系数不能小于0。"}],"answer":"D","explain":"β系数可以为负，负值意味着组合价格变动方向与市场相反，所以“β系数不能小于0”的说法错误。其余表述均正确：波动率是单位时间收益率的标准差，波动率越高不确定性越大，β系数用于评估系统性风险。","chapter":"β系数与波动率","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.21）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/21143455390079.html"}},{"id":"k2-0197","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于资本市场理论的同质期望假定，以下表述错误的是（）。","options":[{"key":"A","text":"在所有的投资者看来，同一个股票的预期收益率是一样的"},{"key":"B","text":"投资者认为所有资产的收益率服从同样的概率分布"},{"key":"C","text":"在所有的投资者看来，同一对股票的相关性是一样的"},{"key":"D","text":"在所有的投资者看来，同一个股票的标准差是一样的"}],"answer":"B","explain":"同质期望假定是指所有投资者对同一资产的预期收益率、标准差以及资产之间的相关性有一致的判断，而不是认为所有资产的收益率都服从相同的概率分布，故该表述错误。认为同一股票预期收益率一致、同一对股票相关性一致、同一股票标准差一致，都属于同质期望的内容。","chapter":"同质期望假定","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.31）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/31101500421604.html"}},{"id":"k2-0198","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"有关银行间债券市场的质押式回购业务，以下描述错误的是()","options":[{"key":"A","text":"在回购期内，对资金融入方出质的债券，资金融出方可以动用"},{"key":"B","text":"质押式回购期限最长为1年"},{"key":"C","text":"一般情况下，质押式回购到期时应选择“券款对付”方式结算"},{"key":"D","text":"办理质押式回购选择时使用单一券种或多个券种进行质押"}],"answer":"A","explain":"质押式回购期间，质押券被冻结，资金融出方无权动用，因此该表述错误。质押式回购期限最长一年，到期一般选择券款对付方式结算，出质时可使用单一券种或多个券种。","chapter":"质押式回购规则","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：银行间债券结算业务类型-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202403/05144707299394.html"}},{"id":"k2-0199","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"按照杜邦分析法将财务指标拆解成多项指标的乘积。关于杜邦分析法，以下表述错误的是()。","options":[{"key":"A","text":"权益乘数等于所有者权益除以总资产"},{"key":"B","text":"一般情况下，总资产周转率越高，企业的运营效率越高"},{"key":"C","text":"权益乘数主要反映企业的融资能力"},{"key":"D","text":"销售利润率可以在一定程度上反应企业的盈利能力"}],"answer":"A","explain":"权益乘数等于总资产除以所有者权益，而不是所有者权益除以总资产，该表述把公式倒置了。总资产周转率越高说明资产运营效率越高，权益乘数反映企业的负债程度与融资安排，销售利润率则在一定程度上反映盈利能力。","chapter":"杜邦分析法应用","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.23）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/23144206943383.html"}},{"id":"k2-0200","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于弱有效证券市场，以下表述错误的是（）。","options":[{"key":"A","text":"历史信息对证券价格变动不会产生任何影响"},{"key":"B","text":"投资者可以通过分析历史信息进行的技术分析来预测未来证券价格走势"},{"key":"C","text":"证券价格能够充分反映历史序列中包含的信息"},{"key":"D","text":"投资者通过对以往价格、交易量所进行的技术分析都是无用的"}],"answer":"B","explain":"弱有效市场意味着证券价格已经充分反映历史价格和历史交易信息，因此依据历史信息所做的技术分析无法带来超额收益，据此预测未来价格走势的说法不成立。其余关于历史信息已被反映、技术分析失效的表述都与弱有效市场的含义一致。","chapter":"弱有效市场含义","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.4）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/04182221392120.html"}},{"id":"k2-0201","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于银行间债券市场的交易制度，以下表述错误的是（）","options":[{"key":"A","text":"做市商以自有资金和债券与投资者进行交易"},{"key":"B","text":"做市商承担单向报价责任"},{"key":"C","text":"符合条件的金融机构法人可以接受委托其他参与者办理债券结算"},{"key":"D","text":"公开市场一级交易商制度，是为配合中国人民银行货币政策目标的实现而设置的"}],"answer":"B","explain":"做市商须同时报出买入价和卖出价，承担的是双边报价义务，而不是只做单边报价。做市商以自有资金和债券与投资者交易，符合条件的金融机构法人可受托为其他参与者办理债券结算，公开市场一级交易商制度是为配合货币政策目标而设置的。","chapter":"银行间债券交易制度","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：银行间债券市场的交易制度-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202402/04151119317076.html"}},{"id":"k2-0202","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"企业某年末资产负债表中总资产20亿，负债8亿，实收资本3亿，未分配利润5亿。关于该企业的信息，以下表述最可能正确的是（）。","options":[{"key":"A","text":"资本公积1亿，盈余公积4亿"},{"key":"B","text":"资本公积3亿，盈余公积1亿"},{"key":"C","text":"资本公积3.5亿，盈余公积1亿"},{"key":"D","text":"资本公积1.5亿，盈余公积3亿"}],"answer":"B","explain":"所有者权益＝总资产20亿－负债8亿＝12亿，其中实收资本3亿、未分配利润5亿，剩余用于资本公积和盈余公积的合计为4亿。四个选项中只有资本公积3亿与盈余公积1亿的合计为4亿，符合会计恒等关系。","chapter":"所有者权益构成","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：资产负债表和利表的概念和应用-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202401/04103444272448.html"}},{"id":"k2-0203","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于可转换债券的特征和要素，以下表述正确的是（）。","options":[{"key":"A","text":"可转换债券一般每月付息一次"},{"key":"B","text":"可转换债券的双重选择权是指转股权和提前赎回权"},{"key":"C","text":"在转股前，可转换债券体现了持有者与发行公司之间的所有权关系"},{"key":"D","text":"可转换债券的票面利率一般高于同等条件的普通债券的票面利率"}],"answer":"B","explain":"可转债的双重选择权指持有人享有的转股权和发行人享有的提前赎回权。由于内含转股期权，其票面利率低于同条件普通债券；付息方式通常为每年或每半年一次；转股前 ce":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.15）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/15145303531262.html"}},{"id":"k2-0207","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于交易成本，以下说法错误的是（）。","options":[{"key":"A","text":"显性成本可以事先确定，包含佣金、税费、交易所规费三部分"},{"key":"B","text":"隐性成本包含买卖价差、冲击成本、机会成本、对冲费用等"},{"key":"C","text":"证券交易过程中的经手费、监管费、印花税等是显性成本"},{"key":"D","text":"冲击成本是购买流动性的成本，可以精确计量"}],"answer":"D","explain":"冲击成本是交易者为了获取流动性而承担的成本，属于隐性成本，只能事后估算、无法精确计量，故该表述错误。显性成本包括佣金、税费和交易所规费等可事先确定的支出，隐性成本还包括买卖价差、机会成本和对冲费用等。","chapter":"交易成本构成","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：显性成本和隐性成本-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202307/21155146634263.html"}},{"id":"k2-0208","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于投资者风险容忍度，以下表述错误的是（）。","options":[{"key":"A","text":"其他条件相同时，家庭收入越高，风险承受能力越强"},{"key":"B","text":"其他条件相同时，家庭资产越多，风险承受能力越强"},{"key":"C","text":"其他条件相同时，风险厌恶程度越高，风险承受能力越高"},{"key":"D","text":"其他条件相同时，投资期限越长，风险承受能力越强"}],"answer":"C","explain":"风险厌恶程度越高，投资者对承担风险的抵触越强，其风险承受能力越低，而不是越高。家庭收入越高、资产越多、投资期限越长，在其他条件相同时风险承受能力通常越强。","chapter":"投资者风险容忍度","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（6.1）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202306/01101704706272.html"}},{"id":"k2-0209","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于大额可转让定期存单，以下表述正确的（）","options":[{"key":"A","text":"大额可转让定期存单在二级市场上可能存在不能及时变现的风险"},{"key":"B","text":"大额可转让定期存单的期限较长，一般都在1年以上"},{"key":"C","text":"大额可转让定期存单的利率不可以是浮动利率"},{"key":"D","text":"大额可转让定期存单的利率一般要低于同期定期存款"}],"answer":"A","explain":"大额可转让定期存单在二级市场转让时可能因市场深度不足而难以及时变现，存在流动性风险。其期限通常在一年以内，利率可以为固定也可以为浮动，且一般高于同期定期存款利率。","chapter":"大额可转让定期存单","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.2）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/02181930493705.html"}},{"id":"k2-0210","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于期权合约，以下表述错误的是()","options":[{"key":"A","text":"美式期权买方可以在到期日前提前执行期权但推迟将会作废的"},{"key":"B","text":"同样条件下，美式期权的期权费通常要比欧式期权的期权费高"},{"key":"C","text":"美国的金融市场上交易着大量欧式期权"},{"key":"D","text":"欧式期权买方在到期日前不能提前执行期权，但可以推迟执行"}],"answer":"D","explain":"欧式期权的买方只能在到期日当天行使权利，既不能提前执行也不能推迟执行，因此该表述错误。美式期权可在到期日及之前的任一交易日执行，灵活性更高，因此同等条件下其期权费通常高于欧式期权；美国市场上同时也存在大量欧式期权。","chapter":"期权合约执行方式","disputed":false,"source":{"title":"12月基金从业《证券投资基金》真题考点：期权合约的常见类型-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202402/20155924135701.html"}},{"id":"k2-0211","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于跟踪误差的定义，以下表述正确的是（）。","options":[{"key":"A","text":"波动率是一个相对风险指标，跟踪误差则是相对于业绩比较基准的绝对风险指标"},{"key":"B","text":"跟踪误差计量的前提是清晰的业绩比较标准"},{"key":"C","text":"主动管理基金受到投资目标和风格不同的影响，跟踪误差较小"},{"key":"D","text":"指数基金的跟踪误差通常较高"}],"answer":"B","explain":"跟踪误差的计量以清晰、明确的业绩比较基准为前提，没有基准就无从计算偏离程度。波动率是相对风险指标，跟踪误差则是相对基准的偏离度量；指数基金跟踪误差通常较小，而主动管理基金受风格与目标差异影响，跟踪误差往往较大。","chapter":"跟踪误差定义","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：被动投资与跟踪误差-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202307/19154655693123.html"}},{"id":"k2-0212","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于资本资产定价模型的基本假设，以下表述错误的是（）。","options":[{"key":"A","text":"所有投资者都是风险喜好者"},{"key":"B","text":"所有投资者都可以以无风险利率无限借偿"},{"key":"C","text":"所有投资者都认为同一股票有相同的风险和收益分布"},{"key":"D","text":"所有投资者都有相同的投资期限，并且不在投资期限内对投资组合做动态调整"}],"answer":"A","explain":"资本资产定价模型假定所有投资者都是风险厌恶者，而非风险喜好者，故该项错误。模型还假定投资者可以按无风险利率无限借贷、对同一股票的风险与收益分布有一致预期、投资期限相同且在期内不做动态调整。","chapter":"资本资产定价模型假设","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.27）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/27173609887893.html"}},{"id":"k2-0213","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"某基金2016年未产生未分配利润。2017年，该基金利息收入2300万元，投资收益1.3亿元,其他收入200万元，公允价值变动损益9000万元。则该基金2017年的期未可供分配利润为","options":[{"key":"A","text":"1.55亿元"},{"key":"B","text":"2.45亿元"},{"key":"C","text":"2300万元"},{"key":"D","text":"1.3亿元"}],"answer":"A","explain":"期末可供分配利润由已实现的利息收入、投资收益和其他收入构成，即2300万＋1.3亿＋200万＝1.55亿元。公允价值变动损益属于未实现收益，中国证监会及基金合同口径下通常不纳入可供分配利润，以避免超分配。","chapter":"基金可供分配利润","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.10）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/10170839133202.html"}},{"id":"k2-0214","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于杜邦等式，以下表述正确的是（）。","options":[{"key":"A","text":"净资产收益率=销售利润率X净资产周转率X权益乘数"},{"key":"B","text":"净资产收益率=销售利润率X存货周转率x权益乘数"},{"key":"C","text":"净资产收益率=销售利润率X应收账款周转率X权益乘数"},{"key":"D","text":"净资产收益率=销售利润率X总资产周转率x权益乘数"}],"answer":"D","explain":"杜邦等式把净资产收益率分解为销售利润率、总资产周转率与权益乘数三者的乘积，分别对应盈利性、运营效率和财务杠杆。用净资产周转率、存货周转率或应收账款周转率替代总资产周转率都会破坏等式的内在逻辑。","chapter":"杜邦等式构成","disputed":false,"source":{"title":"2025年基金从业《基础知识》真题冲刺练习（7.24）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202507/24180005944040.html"}},{"id":"k2-0215","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于期权，以下表述错误的是()。","options":[{"key":"A","text":"期权买方在未来买卖标的物的价格是事先规定好的"},{"key":"B","text":"期权的买方要付给卖方一定数量的权利金"},{"key":"C","text":"期权合约中的标的资产，可以是实物商品、金融资产、利率、汇率或各种综合价格指数等"},{"key":"D","text":"期权买方到期必须履约，不履约需缴纳罚金"}],"answer":"D","explain":"期权赋予买方的是权利而非义务，到期买方可以选择行权也可以放弃，且不需缴纳罚金，只有卖方承担履约义务，因此该表述错误。期权买方向卖方支付权利金，合约约定的行权价事先确定，标的资产可以是实物商品、金融资产、利率、汇率或各类价格指数。","chapter":"期权合约要素","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（4.14）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202304/14145108114181.html"}},{"id":"k2-0216","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于证券交易所，以下描述正确的是()。","options":[{"key":"A","text":"证泰交易所提供交易场所和服务人员，以便利证券交易商的交易与交割"},{"key":"B","text":"证券交易所本身不持有证券，也不进行证券的买卖"},{"key":"C","text":"证券交易所的设立和解散，由国务院证券监督管理机构决定"},{"key":"D","text":"证券交易所的理事会负责日常事项"}],"answer":"D","explain":"证券交易所是提供交易场所和设施、组织监督交易的自律组织，本身不持有证券也不参与证券买卖；其设立和解散由国务院决定；会员制交易所设会员大会、理事会和总经理，日常事务由总经理负责，理事会并不承担主持日常事务的职能。","chapter":"证券交易所性质","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：场内证券交易场所-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202308/07175426655506.html"}},{"id":"k2-0217","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于期货合约和远期合约的比较，下列叙述不正确的是()。","options":[{"key":"A","text":"期货合约在交易所交易，远期合约通常在场外交易"},{"key":"B","text":"期货合约实物交割比例非常低，远期合约实物交割比例非常高"},{"key":"C","text":"期货合约和远期合约都有杠杆效应"},{"key":"D","text":"期货合约是标准化合约，远期合约是非标准化合约"}],"answer":"C","explain":"期货合约采用保证金交易且每日无负债结算，具有明显的杠杆效应；远期合约通常不设保证金、到期以全额交收，一般不具备同样的杠杆特征，故“都有杠杆效应”的叙述不正确。期货在交易所交易、标准化程度高、实物交割比例低，远期合约则在场外交易、非标准化、实物交割比例高。","chapter":"期货与远期合约比较","disputed":false,"source":{"title":"6月基金从业《证券投资基金》真题考点：远期合约和期货合约-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202307/08112946184465.html"}},{"id":"k2-0218","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于杜邦等式，以下表述正确的是（）","options":[{"key":"A","text":"净资产收益率=销售利润率x净资产周转率x权益乘数"},{"key":"B","text":"净资产收益率=销售利润率x存货周转率x权益乘数"},{"key":"C","text":"净资产收益率=销售利润率x应收账款周转率x权益乘数"},{"key":"D","text":"净资产收益率=销售利润率x总资产周转率x权益乘数"}],"answer":"D","explain":"杜邦等式为：净资产收益率＝销售利润率×总资产周转率×权益乘数，三项分别体现盈利性、运营效率与财务杠杆。其余选项替换为净资产周转率、存货周转率或应收账款周转率，均不符合杜邦分解的逻辑。","chapter":"杜邦等式构成","disputed":false,"source":{"title":"2023年基金从业《证券投资基金》考前真题冲刺练习（5.28）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202305/28165033449205.html"}},{"id":"k2-0219","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于估值责任，以下表述错误的是（）。","options":[{"key":"A","text":"基金管理人在计算份额净值时参考估值工作小组意见的，则可免除其估值责任"},{"key":"B","text":"基金托管人对基金管理人的估值结果负有复核责任"},{"key":"C","text":"基金托管人应该审阅基金管理人采用的估值原则和程序"},{"key":"D","text":"基金估值的责任人是基金管理人"}],"answer":"A","explain":"基金管理人是基金估值的责任人，即使参考估值工作小组的意见也不能免除其估值责任；托管人对估值结果负有复核责任，并应审阅管理人采用的估值原则和程序，因此“可免除估值责任”的表述错误。","chapter":"基金估值责任","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.28）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/28173730701144.html"}},{"id":"k2-0220","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"小王于2017年10月20日（周五）赎回了某公募货币市场基金，他应享受的利润日包含（）。","options":[{"key":"A","text":"2017年10月20日、21日"},{"key":"B","text":"2017年10月20日"},{"key":"C","text":"2017年10月20日、21日、22日"},{"key":"D","text":"2017年10月20日、21日、22日、23日"}],"answer":"C","explain":"货币市场基金赎回时，投资者享有赎回申请日（含）之前的收益，自赎回申请日的下一交易日起不再享有。小王10月20日（周五）赎回，享有20日及随后的21日、22日两个休息日的收益，下一交易日23日（周一）起不再享有。","chapter":"货币基金收益计算日","disputed":false,"source":{"title":"2025年基金从业《基础知识》真题冲刺练习（7.23）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202507/23175853439409.html"}},{"id":"k2-0221","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"某投资者将其100万元资金分别投向A、B、C股票，投资金额分别为30万元、20万元、50万元，A、B、C股票的期望收益率分别为10%、10%、20%，则该投资者持有的股票组合期望收益率为（）。","options":[{"key":"A","text":"10%"},{"key":"B","text":"15%"},{"key":"C","text":"20%"},{"key":"D","text":"13.33%"}],"answer":"B","explain":"组合期望收益率是各资产期望收益率按其投资金额（权重）的加权平均，即30%×10%＋20%×10%＋50%×20%＝3%＋2%＋10%＝15%。简单算术平均10%、20%或不考虑权重的处理都会得出错误结果。","chapter":"组合期望收益率","disputed":false,"source":{"title":"2025年基金从业《基础知识》经典真题练习（8.3）-基金从业-233网校","url":"https://www.233.com/jjcy/jczs/zhenti/202508/03182109419906.html"}},{"id":"k2-0222","subject":"k2","subjectName":"证券投资基金基础知识","subjectShort":"科目二","session":"未标注场次","type":"single","stem":"关于基金利润分配，以下说法中正确的是()。","options":[{"key":"A","text":"对基金份额净值和投资者利益没有实际影响"},{"key":"B","text":"会导致基金份额净值和投资者利益的下降"},{"key":"C","text":"对基金份额净值没有实际影响，但会导致投资者利益下降"},{"key":"D","text":"会导致基金份额净值的下降，但对投资者利益没有实际影响"}],"answer":"D","explain":"基金分红是 校","url":"https://www.233.com/jjcy/jczs/zhenti/202401/06103758662818.html"}},{"id":"k3-0001","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2026年5月","type":"single","stem":"【考试原题】某只股权投资基金以有限合伙形式设立，基金解散依法进入清算程序时，以下表述正确的是（）","options":[{"key":"A","text":"基金合同中可约定对合伙人就基金财产的分配优先于交付基金清算费用"},{"key":"B","text":"如基金剩余财产不足以清偿所欠税款和基金所欠的其他债务，则应以其他债务优先清偿"},{"key":"C","text":"如以基金财产清偿员工工资、社会保障费用和法定补偿金后仍有剩余，可以将剩余财产向基金合伙人进行分配"},{"key":"D","text":"如基金剩余财产不足以清偿基金所欠的债务，则基金合伙人再无法在基金清算中从剩余财产获得分配"}],"answer":"D","explain":"合伙型基金清算时，剩余财产必须依次支付清算费用、职工工资及社保和法定补偿金、所欠税款、清偿债务后，才能向合伙人分配，因此约定分配优先于清算费用、或跳过税款债务直接分配都不成立。若剩余财产不足以清偿全部债务，合伙人自然无从取得剩余财产分配。","chapter":"基金清算财产分配","disputed":false,"source":{"title":"2026年5月基金从业《股权投资基金》真题考点：清算退出-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202606/21165649937243.html"}},{"id":"k3-0002","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2026年5月","type":"single","stem":"【考试原题】股权投资基金向目标公司提供少量债权投资应基于合理商业理由和以股权投资为目的，以下情形符合此目的的是()。","options":[{"key":"A","text":"股权投资交割后，目标公司因银行贷款利率较高，希望股东提供一笔五年期低息借款"},{"key":"B","text":"股权投资基金为有效利用闲置资金，为其一家被投资企业提供长期借款以获取利息收入"},{"key":"C","text":"股权交割前，目标公司账面资金紧张，需要少量短期借款"},{"key":"D","text":"基金为有效利用闲置资金，通过向多家公司发放短期借款来获取利息收入"}],"answer":"C","explain":"基金以股权投资为目的提供少量债权，应具有临时性和辅助性：股权交割前目标公司资金紧张、需要少量短期借款正属此类。以长期放贷赚取利息或为闲置资金寻找出路而向多家公司发放借款，已偏离股权投资目的。","chapter":"基金债权投资限制","disputed":false,"source":{"title":"2026年5月基金从业《股权投资基金》真题考点：债权投资的限制与投资目的-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202606/16105501804749.html"}},{"id":"k3-0003","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2026年5月","type":"single","stem":"【考试原题】某私募基金合伙协议约定基金存续期限为7年，其中前4年为投资期，基金运作至第6年末时，仍有3个已投项目尚未完成退出，此时基金管理人正确做法是（）","options":[{"key":"A","text":"管理人可自行延长2年存续期，并通知投资者延期事宜"},{"key":"B","text":"直接延长存续期，且存续期延长时间不得超过2年"},{"key":"C","text":"直接到期清算，管理人应及时启动清算相关准备工作"},{"key":"D","text":"需经基金合同当事人协商一致，相应延长基金存续期"}],"answer":"D","explain":"存续期是基金合同的核心条款，延长或缩短都必须由基金合同当事人协商 得超过公司股份总数的1%，故选C。把该档位误记为不受限制或按更严格的口径取值都不对。","chapter":"创投基金减持规定","disputed":false,"source":{"title":"2026年5月基金从业《股权投资基金》真题考点：减持股份-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202606/22165909183530.html"}},{"id":"k3-0007","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2026年5月","type":"single","stem":"【考试原题】关于政府投资基金，以下表述错误的是（）","options":[{"key":"A","text":"大多采用参股市场化股权投资基金的形式"},{"key":"B","text":"大多直接参与企业投资和日常管理"},{"key":"C","text":"对所投基金的投资范围进行限制"},{"key":"D","text":"发挥财政资金的杠杆放大效应，增加创业投资的资本供给"}],"answer":"B","explain":"政府投资基金主要通过参股市场化股权投资基金的方式运作，并限定所投基金的投资范围和投向，以财政资金撬动社会资本。它一般不直接参与企业投资和日常经营管理，B的说法与此相反，故表述错误。","chapter":"政府投资基金","disputed":false,"source":{"title":"2026年5月基金从业《股权投资基金》真题考点：政府投资基金-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202606/18165503701478.html"}},{"id":"k3-0008","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2026年5月","type":"single","stem":"【考试原题】某公司在现时条件下重新购入一项新状态的资产，其重置全价为40000元，综合贬值为5000元，如果使用成本法进行估值，其综合成新率为()。","options":[{"key":"A","text":"87.5%"},{"key":"B","text":"78.5%"},{"key":"C","text":"13.5%"},{"key":"D","text":"12.5%"}],"answer":"A","explain":"成本法下综合成新率=1-综合贬值率，也等于（重置全价-综合贬值）÷重置全价=（40000-5000）÷40000=87.5%，选A。78.5%、13.5%、12.5%分别是计算错误或仅取贬值率、漏算比例的结果。","chapter":"成本法估值方法","disputed":false,"source":{"title":"2026年5月基金从业《股权投资基金》真题考点：综合成新率-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202606/23170029412615.html"}},{"id":"k3-0009","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2026年5月","type":"single","stem":"【考试原题】关于并购基金的运作特点，以下表述错误的是（）。","options":[{"key":"A","text":"主要获得估值恢复或价值提升带来的增值效益"},{"key":"B","text":"从投资对象看，主要是成熟企业"},{"key":"C","text":"从投资方式看，通常采取参股型投资"},{"key":"D","text":"须借助于杠杆"}],"answer":"C","explain":"并购基金的投资方式以控股型投资为主，目的是取得对被投资企业的控制权并主导其整合与改造，因此“通常采取参股型投资”表述错误。并购基金主要投成熟企业，须借助杠杆，收益主要来自估值恢复与价值提升，其余选项均正确。","chapter":"并购基金运作特点","disputed":false,"source":{"title":"2026年5月基金从业《股权投资基金》真题考点：并购基金的运作特点-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202606/10104054791915.html"}},{"id":"k3-0010","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2026年5月","type":"single","stem":"【考试原题】从募集机构的角度，我国股权投资基金的合规募集方式包括（）","options":[{"key":"A","text":"广告募集"},{"key":"B","text":"公开募集"},{"key":"C","text":"上市募集"},{"key":"D","text":"自行募集"}],"answer":"D","explain":"我国股权投资基金只能以非公开方式募集，募集主体可以是管理人自行募集，也可以委托具备资格的第三方机构代销，故D正确。广告募集、公开募集和上市募集都属于公开募集方式，为合规募集所禁止。","chapter":"基金募集方式","disputed":false,"source":{"title":"2026年5月基金从业《股权投资基金》真题考点：股权投资基金的募集-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202606/13105102663171.html"}},{"id":"k3-0011","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】股权投资基金A的投资者甲起诉管理人乙公司，称乙公司未履行关联交易信息披露义务并通过A基金关联交易损害了甲的合法权益。经查，涉案基金的基金合同约定了关联交易的定义，未针对关联交易作出其他特别约定。关于本案，以下表述正确的是（）。","options":[{"key":"A","text":"如乙公司提供证据证明其已向A基金托管人披露关联交易，可以认定乙公司已履行应履行的关联交易信息披露义务"},{"key":"B","text":"因基金合同未禁止关联交易，乙公司无需对A基金实施关联交易造成的后果承担责任"},{"key":"C","text":"如乙公司提供证据证明关联交易给A基金产生收益而未损害A基金的利益，乙公司无需就未履行关联交易信息披露义务承担任何责任"},{"key":"D","text":"如乙公司拟募集新的基金，应依法在基金合同对关联交易的识别认定、交易决策、对价确定、信息披露和回避等机制作出约定"}],"answer":"D","explain":"新募集基金应当在基金合同中对关联交易的识别认定、交易决策、对价确定、信息披露和回避等机制作出约定，D正确。只向托管人披露不等于对投资者履行了披露义务；合同未禁止关联交易、关联交易最终获利，均不能免除管理人的披露与忠实义务。","chapter":"关联交易信息披露","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：关联交易-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/22151624676270.html"}},{"id":"k3-0012","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于尽职调查对股权投资基金投资决策辅助的作用，以下表述错误的是（）。","options":[{"key":"A","text":"评估项目退出方式时，其仅需作为投资决策的次要参考，核心应聚焦于当前投资估值与短期投利预期"},{"key":"B","text":"投资协议谈判中，估值调整、回购权等条款的谈判策略需以尽职调查信息为核心依据，同时保持必要的协商灵活性"},{"key":"C","text":"尽责调查应提前规划投后管理的重点领域（如业务整合、团队建设），并测算所需资源投入，以提升投资决策的精准度"},{"key":"D","text":"尽职调查所获的行业周期、企业竞争力等信息，可为项目退出方式（如IPO、并购）的可行性及退出成本测算提供支撑"}],"answer":"A","explain":"退出方式的选择直接决定投资能否顺利变现，属于投资决策的核心内容之一，不能仅作次要参考，A表述错误。尽调获取的行业周期、企业竞争力等信息应全面支撑估值调整、回购安排、投后管理重点和退出方式及成本测算。","chapter":"尽职调查作用","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：尽职调查-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/26152829759689.html"}},{"id":"k3-0013","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】基金治理应遵循专业审慎原则，基金管理人应完善内部治理，设置清晰的内容治理结构，下列描述中最符合该原则的是（）","options":[{"key":"A","text":"基金管理人在募集宣传材料中向投资者详细披露管理人的基本信息、历史基金运营情况和业绩回报"},{"key":"B","text":"基金管理人根据一定商业合理性，对同一基金投资者收取不同的基金管理费，并将情况告知投资者"},{"key":"C","text":"基金管理人通过股权激励、业绩分成、员工跟投等措施，建立系统有效的内部约束激励机制"},{"key":"D","text":"基金管理人在基金合同中约定，当基金尚未完成基金规模的70%以上投资时，不得募集下一只基金"}],"answer":"C","explain":"专业审慎原则要求管理人健全内部治理、设置清晰的内部治理结构，并建立系统有效的约束与激励机制，通过股权激励、业绩分成、员工跟投等安排使管理人利益与投资者一致，C最符合。宣传披露、差别收费、募集下一只基金的门槛约定均不属于该原则指向的内部治理安排。","chapter":"基金治理专业审慎","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：专业审慎原则-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/15115655751135.html"}},{"id":"k3-0014","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】某投资者投资一合伙型股权投资基金200万元，基金期限7年，持有1年后该投资者希望把基金份额转让，以下表述正确的是（）。","options":[{"key":"A","text":"受让人应当为基金持有人且基金份额受让后投资者人数应当不超过50人"},{"key":"B","text":"受让人应当为合格投资者且基金份额受让后投资者人数应当不超过50人"},{"key":"C","text":"受让人应当为基金持有人且基金份额受让后投资者人数应当不超过200人"},{"key":"D","text":"受让人应当为合格投资者且基金份额受让后投资者人数应当不超过200人"}],"answer":"B","explain":"合伙型股权投资基金的合伙人人数不得超过50人，受让人还必须是符合规定的合格投资者，故B正确。A、C把受让人限定为“基金持有人”没有依据，C、D的200人上限是公司型/股份公司层面的思路，不适用于有限合伙型基金。","chapter":"基金份额转让限制","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：合伙型基金的组织形式-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/111149025894.html"}},{"id":"k3-0015","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】下列反稀释条款，表述错误的是（）。","options":[{"key":"A","text":"与完全棘轮条款相比，加权平均的反稀释方式是对投资者更为有利的方式"},{"key":"B","text":"在境外架构下，反稀释主要通过调整优先股和普通股的转换比例实现"},{"key":"C","text":"反稀释条款本质上是一种价格保护机制，适用于后轮融资为降价融资时，保护前轮投资者的股权比例不因降价融资而被稀释"},{"key":"D","text":"完全棘轮条款不考虑下一轮新发行股份的数量，而是将对前轮投资者发行的所有股份按照后轮的新的最低价格全部重新计算"}],"answer":"A","explain":"完全棘轮条款直接按后轮最低价重算前轮全部股份，对前轮投资者保护更彻底；加权平均方式考虑了新发股份数量，稀释补偿幅度较小，对投资者不如完全棘轮有利，A表述错误。B、C、D关于实施方式、保护对象和完全棘轮计算方法的表述均正确。","chapter":"反稀释条款规则","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：反稀释条款-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/1016282070356.html"}},{"id":"k3-0016","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】股权投资基金可跟腱炎投资阶段分为不同类型，关于各类基金投资标的的特点，下列说法正确的是（）。I、狭义创业投资基金主要投资于初创期和小型成长期企业II、成长型股权基金更关注已具备一定规模且快速增长的企业III、并购基金主要投资于成熟期和转型重组期的企业IV、狭义创业投资基金与成长型股权基金的投资标的界限清晰","options":[{"key":"A","text":"II、III、IV"},{"key":"B","text":"I、II、III"},{"key":"C","text":"I、IV"},{"key":"D","text":"I、II、III、IV"}],"answer":"B","explain":"狭义创业投资基金投向初创期和小型成长期企业，成长型基金关注已具规模且高速成长的企业，并购基金主要投成熟期和转型重组期企业，Ⅰ、Ⅱ、Ⅲ正确。两类基金的投资标的在实践中存在交叉，界限并不清晰，Ⅳ错误，故选B。","chapter":"股权投资基金分类","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：各类基金投资标的特点-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/05161554708082.html"}},{"id":"k3-0017","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】股权投资基金拟对某目标公司进行法律尽职调查，需重点关注的高级管理人员问题包括（）Ⅰ、目标公司的首席技术官是否与目标公司签订协议，限制其离职后开展与公司类似的业务Ⅱ、目标公司的总经理薪酬高于同业50%Ⅲ、目标公司的前任CFO不满被公司开除，目前正与公司进行劳动仲裁，要求12个月的工资作为赔偿Ⅳ、目标公司的销售总监享受公司的房屋补贴情况","options":[{"key":"A","text":"Ⅰ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅲ"},{"key":"C","text":"Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅲ"}],"answer":"B","explain":"法律尽职调查关注高管问题，重点是竞业限制约定（首席技术官离职后的同业限制）和劳动争议纠纷（前任CFO的仲裁），Ⅰ、Ⅲ符合。薪酬高于同业属于商业合理性判断，房屋补贴属于薪酬福利安排，一般不属于法律尽调重点关注事项。","chapter":"法律尽职调查重点","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：法律尽职调查的作用-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/17180429365102.html"}},{"id":"k3-0018","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于私募基金争议的调解程序，以下表述正确的是（）。","options":[{"key":"A","text":"中国证券投资基金业协会对私募基金争议进行调整均系通过第三方调解组织进行"},{"key":"B","text":"私募基金争议经中国证券投资基金业协会调解不成的，当事人仍可依法通过诉讼、仲裁等途径维护自身合法权益"},{"key":"C","text":"调解原则上公开进行"},{"key":"D","text":"中国证券投资基金业协会有权调解投资者与私募基金管理人之间的基金业务纠纷，但无权条件私募基金管理人之间的基金业务纠纷"}],"answer":"B","explain":"调解不是终局程序，协会调解不成或当事人不愿继续调解的，仍可依法提起诉讼或申请仲裁，B正确。协会既可通过第三方调解组织，也可自行组织调解；调解原则上不公开进行；协会对投资者与管理人之间、管理人相互之间的基金业务纠纷均可调解。","chapter":"基金争议调解","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：私募基金争议的调解程序-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/12115107222950.html"}},{"id":"k3-0019","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】私募基金管理人运用私募基金财产与下列哪些主体进行交易时，应当履行基金合同约定的决策，并及时向投资者和私募基金托管人员提供相关信息（）I、私募基金管理人自身II、该私募基金的投资者III、该管理人管理的其他私募基金IV、该管理人的实际控制人控制的其他私募基金管理人管理的私募基金","options":[{"key":"A","text":"I、II、III"},{"key":"B","text":"I、II、III、IV"},{"key":"C","text":"I、IIII、IV"},{"key":"D","text":"II、III、IV"}],"answer":"B","explain":"私募基金财产与管理人自身、该基金投资者、管理人管理的其他基金，以及管理人实际控制人控制的其他管理人管理的基金之间的交易，均属于应履行约定决策程序并向投资者和托管人披露的关联交易，四项全选，B正确。","chapter":"关联交易范围","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：基金管理人关联交易管理制度-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202511/281149582277.html"}},{"id":"k3-0020","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于股权投资母基金的业务，以下表述正确的是()。Ⅰ、母基金开展直接投资业务时一般扮演领投角色，与其所投资的股权投资基金联合投资Ⅱ、在直接投资业务中，母基金通常侧重于投资其所投资的股权投资基金资产组合中的企业Ⅲ、在二手基金份额投资业务中，母基金能够得到底层资产组合Ⅳ、在实际操作中，母基金的联合投资项目往往由其自行获取","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"B","text":"Ⅱ、Ⅲ"},{"key":"C","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅲ、Ⅳ"}],"answer":"B","explain":"母基金开展直接投资时通常以跟投方式与所投基金联合投资，而非扮演领投角色，Ⅰ错误；联合投资项目在实践中多来自所投基金的项目资源，并非母基金自行获取，Ⅳ错误。母基金直投侧重所投基金组合中的企业，二手份额投资可取得底层资产组合，Ⅱ、Ⅲ正确，故选B。","chapter":"母基金直接投资业务","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：股权投资母基金的业务-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/041548553236.html"}},{"id":"k3-0021","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】股权投资基金投后管理的有效实施以充分获取被投资企业的各类信息为前提，主要原因包括（）Ⅰ、投资机构与被投资企业之间存在信息不对称Ⅱ、投资机构并不参与被投资企业的日常管理Ⅲ、及时了解被投资企业经营发展中的问题以便针对性地提供解决方案Ⅳ、以便对被投资企业进行准确、合理的估值","options":[{"key":"A","text":"II、III、IV"},{"key":"B","text":"I、III、IV"},{"key":"C","text":"I、II、III"},{"key":"D","text":"I、II、IV"}],"answer":"C","explain":"投后管理需要充分获取信息，是因为投资机构与被投企业之间存在信息不对称，且投资机构不参与日常管理，需要及时发现问题并提供解决方案，Ⅰ、Ⅱ、Ⅲ正确。Ⅳ中“为准确合理估值”并不是获取投后信息的直接原因，故排除，选C。","chapter":"投后管理信息获取","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：股权投资基金投后管理-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202511/24150918135191.html"}},{"id":"k3-0022","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于股权投资基金的协议转让退出，以下表述正确的是()。Ⅰ.股权转让方和受让方经初步谈判，可以签署股权转让意向书Ⅱ.股权回购的发起人可以是股权投资基金、公司控股股东Ⅲ.股权转让方可以根据保密原则对受让方的尽职调查不予配合Ⅳ.股权转让完毕后，不涉及标的公司控制权变化的无需向市场监督管理部门办理变更登记","options":[{"key":"A","text":"Ⅱ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅱ"},{"key":"C","text":"Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅲ"}],"answer":"B","explain":"股权转让双方初步谈判后可签署股权转让意向书，股权回购的发起人可以是基金，也可以是公司控股股东等，Ⅰ、Ⅱ正确。转让方负有配合受让方尽职调查的义务，不能以保密为由拒绝；股权转让后需要办理股东名册及工商变更登记，与是否发生控制权变化无关，Ⅲ、Ⅳ错误，选B。","chapter":"协议转让退出","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：股权投资基金的协议转让退出-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/09114605827093.html"}},{"id":"k3-0023","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】合伙型股权投资基金可按照合伙协议的约定，办理财产份额转让，合伙人向其他合伙人转让财产份额时，对转让方以外的合伙人应履行的义务通常为()。","options":[{"key":"A","text":"一般情况下，仅需通知其他合伙人，不必经过其他合伙人的一致同意"},{"key":"B","text":"需要经过1/2以上的其他合伙人的同意方可生效"},{"key":"C","text":"需要经过其他合伙人的一致同意方可生效"},{"key":"D","text":"需要经过2/3以上的其他合伙人的同意方可生效"}],"answer":"A","explain":"合伙人之间内部转让财产份额不改变合伙人的构成与信任基础，通常只需通知其他合伙人，无须经其他合伙人同意，A正确。需要其他合伙人一致同意的是向合伙人以外的第三人转让的情形。","chapter":"合伙份额内部转让","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：合伙人应履行的义务-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/09162705853823.html"}},{"id":"k3-0024","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于我国股权投资基金投资者，以下表述正确的是（）","options":[{"key":"A","text":"政府投资基金可理解为一类特殊的母基金，因此无法进行直接投资业务"},{"key":"B","text":"因投向股权投资基金的比重较大，全国社会保障基金一直以来为我国股权投资基金的最重要资金来源"},{"key":"C","text":"个人投资者参与股权投资基金投资，需符合合格投资者相关规定"},{"key":"D","text":"基于严格的分业监管政策，我国股权投资基金的投资者不包括金融机构"}],"answer":"C","explain":"个人投资者参与股权投资基金投资必须满足合格投资者的资产规模或收入及投资经历要求，C正确。政府投资基金在参股子基金之外也可开展直接投资；全国社保基金只是重要机构投资者之一，并非“最重要资金来源”；金融机构依法可以成为股权投资基金投资者。","chapter":"基金投资者类型","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：股权投资基金投资者-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/01153651438067.html"}},{"id":"k3-0025","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】企业A在获得股权投资基金B的投资后，业务逐渐趋于停滞，成本和费用开支未能得到有效控制，已有多年无法获得新投资人的关注且无法完成任何后续轮次投资，企业A创始人自身并无太多积蓄，如果股权投资基金B希望全部退出企业A，通常情况下，以下哪种方式最不可能是股权投资基金的退出方式（）。","options":[{"key":"A","text":"并购退出"},{"key":"B","text":"清算退出"},{"key":"C","text":"协议转让"},{"key":"D","text":"创始人回购"}],"answer":"D","explain":"创始人回购依赖创始人自身的资金实力，题干已说明其并无积蓄，在企业经营停滞、无人接盘的情况下回购几乎不可能实现，故选D。并购退出、协议转让虽难度大但仍存在可能，清算退出是经营失败时的常规通道。","chapter":"基金退出方式选择","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：股权回购-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/25152714862112.html"}},{"id":"k3-0026","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】某基金管理人和若干投资者拟共同设立一家公司型股权投资基金，在设计基金架构时，以下表达错误的是（）。","options":[{"key":"A","text":"可以设立为有限责任公司，也可以设立为股份有限公司"},{"key":"B","text":"投资者通过公司股东会和董事会，共同管理基金的投资和运营事务"},{"key":"C","text":"可以在公司章程或股东协议中规定管理人收取的管理费和业绩报酬"},{"key":"D","text":"管理人可以作为公司股东，也可以不作为公司股东"}],"answer":"B","explain":"公司型基金的投资者通过股东会行使重大事项表决权，具体投资和运营事务由董事会聘请的管理团队负责，并非投资者共同管理，B表述错误。公司型基金可设有限责任公司或股份有限公司，管理人可以是股东也可以不是，管理费和业绩报酬可在章程或股东协议中约定，A、C、D正确。","chapter":"公司型基金架构","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：公司型股权投资基金-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/07162137482043.html"}},{"id":"k3-0027","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于用现金流折现法对目标公司进行估值，下列表述错误的是（）。","options":[{"key":"A","text":"详细预测期应选取以目标公司进入稳定经营状态为基准"},{"key":"B","text":"对于在预测期之后目标公司的价值，可以采用终值倍数法或者永续增长模型进行估值"},{"key":"C","text":"对于周期性最明显的行业，详细预测期通常只考虑增长周期"},{"key":"D","text":"使用现金流折现法对目标公司进行估值时，一般需要预测目标公司未来每期现金流"}],"answer":"C","explain":"对周期性明显的行业，详细预测期应覆盖一个完整的经营周期，既包括上升期也包括下降期，只考虑增长周期会高估现金流，C错误。预测期长度以企业进入稳定经营状态为基准，预测期之后的终值可用终值倍数法或永续增长模型测算，估值需要预测各期现金流。","chapter":"现金流折现法估值","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：现金流折现法的估值步骤-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/021156406354.html"}},{"id":"k3-0028","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于股权投资基金后续募集，以下表述错误的是（）。","options":[{"key":"A","text":"基金管理人可以在符合法律法规和合同约定情况下，视情况安排多次后续募集"},{"key":"B","text":"后续募集过程中新增的合伙人通常可以自行选择是否参与其入伙前的基金已投项目"},{"key":"C","text":"除特定情况外，原则上增加的基金认缴总规模不得超过备案时基金认缴总规模的3倍"},{"key":"D","text":"后续募集只能发生在基金合同约定的投资期内"}],"answer":"D","explain":"后续募集并不限于基金合同约定的投资期内，在符合法律法规和合同约定的条件下，投资期结束后亦可安排，D表述错误。管理人可安排多次后续募集；新增合伙人通常可选择是否参与其入伙前已投项目；除特定情形外，增加的认缴总规模原则上不超过备案时认缴规模的3倍。","chapter":"基金后续募集","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：股权投资基金后续募集-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/18151146166926.html"}},{"id":"k3-0029","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于创业投资类政府投资基金，以下表述正确的是（）。","options":[{"key":"A","text":"政府投资基金的宗旨是引导社会资本投入，增加创业投资资本的供给"},{"key":"B","text":"政府投资基金可以通过政策性贷款方式支持创业投资基金的发展"},{"key":"C","text":"政府投资基金对创业投资基金的投资领域及投资阶段没有限制"},{"key":"D","text":"为了发挥财政资金的产业引导作用，政府投资基金通常会直接参与创业投资基金的投资业务"}],"answer":"A","explain":"创业投资类政府投资基金的宗旨是引导社会资本进入创业投资领域、增加创业投资资本供给，A正确。它以参股方式运作而非发放政策性贷款，通常对所投基金的投资领域和阶段作出限制，也不直接参与创业投资基金的具体投资业务。","chapter":"创业投资政府投资基金","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：创业投资类政府投资基金-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/29153000158815.html"}},{"id":"k3-0030","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于基金托管人职责，以下表述正确的是（）Ⅰ、对同一基金管理人所托管的不同基金设置资金池，确保高效调拨资金Ⅱ、基金托管人负责保管基金财产，确保基金财产安全Ⅲ、基金托管人应将托管的基金财产进行投资运作，使之保值增值Ⅳ、基金托管人应监督基金管理人运用基金财产进行投资运作的行为","options":[{"key":"A","text":"Ⅱ、Ⅳ"},{"key":"B","text":"Ⅲ、Ⅳ"},{"key":"C","text":"Ⅱ、Ⅲ"},{"key":"D","text":"Ⅰ、Ⅱ"}],"answer":"A","explain":"托管人的职责是安全保管基金财产并监督管理人的投资运作行为，Ⅱ、Ⅳ正确。为不同基金设置资金池、混同调拨资金属于禁止行为，Ⅰ错误；托管人不承担投资运作职责，使基金保值增值是管理人的职责，Ⅲ错误，故选A。","chapter":"基金托管人职责","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：基金托管人的职责-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/16120404565716.html"}},{"id":"k3-0031","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】增资协议的约定事项通常包括（）I、目标公司出售股权的数量、投资方支付的对价II、交割和交割时的交付物、交割的前提条件、过渡期的义务和交割后的义务III、给予投资方在一定时间内的排他投资权力IV、各方的陈述与保证","options":[{"key":"A","text":"I、II、III"},{"key":"B","text":"I、III、IV"},{"key":"C","text":"I、II、IV"},{"key":"D","text":"I、II、III、IV"}],"answer":"C","explain":"增资协议的约定事项通常包括投资方取得股权的数量与对价、交割及交割前提条件和过渡期义务、各方的陈述与保证，Ⅰ、Ⅱ、Ⅳ正确。投资方在一定期限内的排他投资权属于投资备忘录或条款清单中的排他性安排，不是增资协议的常规条款，故选C。","chapter":"增资协议条款","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：增资协议约定事项-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202511/22150533934404.html"}},{"id":"k3-0032","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于中国企业境外直接上市，以下表述错误的是（）","options":[{"key":"A","text":"中国企业境外直接上市也包括通过境外特殊目的公司的名义申请境外交易所上市交易的方式"},{"key":"B","text":"中国企业境外直接上市，需要向中国证监会备案"},{"key":"C","text":"境外直接上市的优点在于可直接进入境外资本市场，提升企业国际知名度和影响力"},{"key":"D","text":"中国企业境外直接上市，可获得外汇资金"}],"answer":"A","explain":"以境外注册的特殊目的公司名义申请境外交易所上市属于间接上市（红筹模式），不是境外直接上市，A错误。境外直接上市需按规定向中国证监会备案，优点是直接进入境外资本市场、提升国际知名度、可获得外汇资金，B、C、D正确。","chapter":"境外上市方式","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：境外直接上市-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/31153533730253.html"}},{"id":"k3-0033","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于风险资本估值法，下列表述错误的是()。Ⅰ、风险资本估值法一般适用于成熟期企业Ⅱ、若目标公司有后续轮次融资，计算投资时持股比例需要考虑股权稀释情况Ⅲ、估算目标公司在股权投资基金退出时股权价值可采用市场乘数法Ⅳ、一般先评估目标公司现在的股权价值","options":[{"key":"A","text":"Ⅱ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅳ"},{"key":"C","text":"Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅲ"}],"answer":"B","explain":"风险资本估值法适用于初创期等早期企业，而非成熟期企业，Ⅰ错误；该方法是先估算企业退出时点的股权价值，再按目标收益率折算为当前价值，而不是先评估现在的股权价值，Ⅳ错误。后续轮次融资需考虑股权稀释，退出时点价值可用市场乘数法估算，Ⅱ、Ⅲ正确，选B。","chapter":"风险资本估值法","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：风险资本估值法-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/23162928965520.html"}},{"id":"k3-0034","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】某企业融资前，创始股东持股数量为50,000股。前轮投资者以每股3元的价格购买了10,000股，后轮投资者以每股2元的价格购买了20,000股。因触发反稀释权，反稀释的方式为完全棘轮，创始股东需向前轮投资者补偿的股票数量为（）股。","options":[{"key":"A","text":"5000"},{"key":"B","text":"15000"},{"key":"C","text":"10000"},{"key":"D","text":"20000"}],"answer":"A","explain":"完全棘轮条款下，前轮投资者的全部股份按后轮最低价2元重新计算，应得股份数=10000×3÷2=15000股，其原持有10000股，故创始股东需补偿的股份为15000-10000=5000股，选A。15000是重算后的总股数而非补偿数，其余选项无计算依据。","chapter":"完全棘轮反稀释计算","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：完全棘轮条款-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/23151734253191.html"}},{"id":"k3-0035","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】投后管理部门组织架构中，以下关于“岗位设置”的表述正确的是()Ⅰ、应明确投后管理岗位的职责边界Ⅱ、需确保投后管理岗位人员具备相应的专业能力要求Ⅲ、投后管理岗位无需与项目团队岗位进行职责衔接Ⅳ、可根据项目数量与规模设置专职或兼职投后岗位","options":[{"key":"A","text":"Ⅱ、Ⅲ"},{"key":"B","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅰ、Ⅲ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅳ"}],"answer":"D","explain":"投后管理岗位设置应明确职责边界、保证人员具备相应专业能力，并可根据项目数量与规模设专职或兼职岗位，Ⅰ、Ⅱ、Ⅳ正确。投后岗位必须与项目团队等岗位做好职责衔接，Ⅲ说“无需衔接”错误，故选D。","chapter":"投后管理岗位设置","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：投后管理部门岗位设置-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/01115522218838.html"}},{"id":"k3-0036","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于并购基金，以下表述错误的是(）","options":[{"key":"A","text":"并购基金在海外的主要形式为杠杆收购基金"},{"key":"B","text":"并购基金主要投向未来有巨大增长潜力的企业"},{"key":"C","text":"并购基金的投资方式是指通过投资取得被投资企业股权而对其产权及经营管理实施部分或完全控制的行为"},{"key":"D","text":"并购基金的投资收益主要来源于因估值恢复或价值提升带来的增值收益"}],"answer":"B","explain":"并购基金主要投向成熟期企业，通过改善经营和整合提升价值；关注具有巨大增长潜力的企业是创业投资基金的取向，B表述错误。并购基金在海外的典型形式是杠杆收购基金，其投资方式强调取得控制权，收益主要来自估值恢复和价值提升。","chapter":"并购基金投资对象","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：并购基金-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202511/25151034791015.html"}},{"id":"k3-0037","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】关于股权投资基金合同中的关键人士条款，以下说法正确的是（）。","options":[{"key":"A","text":"若关键人士离职，基金可能会暂停投资并召开合伙人会议决定后续措施"},{"key":"B","text":"关键人士条款的设置的主要是为了维护管理人利益"},{"key":"C","text":"关键人士通常包括有限合伙人和核心投资团队成员"},{"key":"D","text":"关键人士条款的主要目的在于确定关键人士在职时的离职标准"}],"answer":"A","explain":"关键人士条款约定核心投资人员离职时基金可暂停投资、由合伙人会议决定后续安排，以保护投资者利益，A正确。该条款服务于投资者而非管理人，关键人士指核心投资团队成员而非有限合伙人，其目的也不是确定离职标准。","chapter":"关键人士条款","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：关键人士条款-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/14115526104399.html"}},{"id":"k3-0038","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","ty 、合伙企业的解散与清算Ⅳ.争议解决办法","options":[{"key":"A","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"C","text":"Ⅰ、Ⅱ"},{"key":"D","text":"Ⅱ、Ⅲ、Ⅳ"}],"answer":"A","explain":"合伙协议必备内容包括合伙企业名称和主要经营场所、合伙目的与经营范围、解散与清算、争议解决办法等，Ⅰ、Ⅲ、Ⅳ正确。“发起人认购的股份数、出资方式和出资时间”是公司章程的内容，合伙协议中应为合伙人的出资方式、数额和缴付期限，Ⅱ不选，故选A。","chapter":"合伙协议必备内容","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：合伙协议-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/0311591598879.html"}},{"id":"k3-0048","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】某新的私募基金融理人募集设立并管理一只合伙型股权投资基金，该基金主要投资初创期科技型企业。基金管理人进行基金备案时，必须报备的信息或材料不包括（）。","options":[{"key":"A","text":"主要投资方向"},{"key":"B","text":"基金名称"},{"key":"C","text":"基金合同"},{"key":"D","text":"管理人过往投资业绩"}],"answer":"D","explain":"基金备案需报送基金名称、主要投资方向、基金合同等基础信息与材料，管理人过往投资业绩并非备案必须报送的内容，故选D。备案审查关注的是基金本身是否合规，而不是管理人的历史业绩表现。","chapter":"基金备案材料","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：基金管理人的基金备案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202601/24163504789283.html"}},{"id":"k3-0049","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】并购投资项目投后管理中，主要关注问题包括()Ⅰ、组织架构调整Ⅱ、战略流程重构Ⅲ、战略调整和文化重塑Ⅳ、生产及供应链管理调整Ⅴ.客户管理调整","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"C","text":"Ⅱ、Ⅲ、Ⅳ、Ⅴ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ"}],"answer":"D","explain":"并购投资后管理需处理组织架构调整、战略与流程重构、战略调整与文化重塑、生产及供应链管理调整以及客户管理调整等问题，题干五项均属常见关注点，故选D。","chapter":"并购投后管理关注问题","disputed":false,"source":{"title":"2025年11月基金从业《股权投资基金》真题考点：并购投资项目投后管理-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202512/17150948692530.html"}},{"id":"k3-0050","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2025年11月","type":"single","stem":"【考试原题】计算截至某一时点的项目投资的内部收益率时，应考虑到必备参数不包括（）","options":[{"key":"A","text":"获得项目收益的时间及金额"},{"key":"B","text":"截至计算时点的项目资产净值"},{"key":"C","text":"对项目出资的时间及金额"},{"key":"D","text":"项目公司将资金陆续投入生 ；并购基金常用杠杆、以控股方式投资、投后侧重企业重整，A、B、D正确。","chapter":"创投与并购基金区别","disputed":false,"source":{"title":"2021年3月基金从业真题及答案：私募股权投资基础知识-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202103/17103309243.html"}},{"id":"k3-0087","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"法律尽职调查的作用是帮助股权投资基金全面评估企业资产和业务的合法性以及潜在法律风险，其主要内容包括（）。Ⅰ.查阅标的公司的纳税资料，调查公司及其控股子公司所执行的税种，税率，税基是否符合现行法律，法规的要求Ⅱ.获得标的公司包括产品/服务的基本情况，生产和销售情况，竞争对手，供应商及经销商情况Ⅲ.确认目标公司的有效存续Ⅳ.从合规角度检查目标公司所提供文件资料的真实性，准确性和完整性","options":[{"key":"A","text":"Ⅲ、Ⅳ"},{"key":"B","text":"Ⅱ、Ⅲ"},{"key":"C","text":"Ⅰ、Ⅳ"},{"key":"D","text":"Ⅱ、Ⅳ"}],"answer":"A","explain":"法律尽职调查的内容包括确认目标公司有效存续、从合规角度核查文件资料的真实准确完整，Ⅲ、Ⅳ正确。查阅纳税资料属于税务尽职调查，获取产品与销售、竞争对手与供应商情况属于业务尽职调查，Ⅰ、Ⅱ不属于法律尽调内容，故选A。","chapter":"法律尽职调查内容","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0088","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"股权投资基金与目标公司签订投资协议和投资备忘录时，关于优先认购权条款，以下表述正确的是（）。","options":[{"key":"A","text":"目标企业在与股权投资基金进行谈判过程中不得再与其他投资机构接触"},{"key":"B","text":"赋予了股权投资基金对一些特定重大事项的一票否决权"},{"key":"C","text":"目标企业发行新股或可转换债券时，作为老股东的股权投资基金可以按照比例优先于新进投资人进行认购"},{"key":"D","text":"目标企业的其他股东欲对外出售股权时，股权投资基金有权按一定原则参与该出售交易"}],"answer":"C","explain":"优先认购权指目标企业发行新股或可转债时，作为老股东的基金可按持股比例优先认购，C正确。A描述的是排他性条款，B描述的是保护性条款（一票否决权），D描述的是优先购买权（第一拒绝权/跟随出售权），三者与优先认购权不同。","chapter":"优先认购权条款","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0089","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"关于竞业禁止条款,表述正确的是()。","options":[{"key":"A","text":"竞业禁止条款只能限制在职的公司成员,对员工离职后的行为没有约束作用"},{"key":"B","text":"竞业禁止条款不仅可以限制员工本人生产与公司有竞争关系的同类产品或经营同类业务,也可以禁止员工劝诱其他员工从公司离职"},{"key":"C","text":"竞业禁止条款的目标是保障股权投资基金的利益,对目标公司的利益则有一定损害"},{"key":"D","text":"竞业禁止只能以约定形式出现,无基于法律直接规定而产生的竞业禁止义务"}],"answer":"B","explain":"竞业禁止条款既可限制员工在职及离职后从事同业竞争业务，也可禁止其劝诱其他员工离职，B正确。竞业禁止也能约束离职后行为；其目的在于保护目标公司及投资人利益；除约定外，法律对公司高管等也有法定的竞业禁止义务，A、C、D错误。","chapter":"竞业禁止条款","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0090","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"某企业正在与A股权投资基金进行洽谈，双方已经签署保密协议，该企业的以下行为可能违反保密义务的是（）。","options":[{"key":"A","text":"经A基金书面允许，将A基金对公司的估值建议告知企业的重要商业伙伴"},{"key":"B","text":"创始人向其一位股权投资基金行业的好友私下征求关于投资协议的意见"},{"key":"C","text":"将A基金主页上介绍的尽职调查流程转述给企业的A轮投资人"},{"key":"D","text":"创始人向企业重要股东沟通关于待签署投资协议的意见"}],"answer":"B","explain":"创始人将尚在磋商中的投资协议内容私下透露给基金行业的外部好友，未经A基金同意，可能泄露谈判信息并损害对方利益，违反保密义务，故选B。经书面许可的披露、转述基金公开主页上的信息、向本公司重要股东内部沟通，一般不构成违约。","chapter":"投资保密义务","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0091","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"小王、甲基金分别为某公司的天使投资人和A轮投资人,在该公司进行B轮融资时,乙基金欲购买小王所持全部该公司股权,如果甲基金按约定行使第一拒绝权可以进行的操作为（）","options":[{"key":"A","text":"应以同等价格与乙基金共同购买小王所持全部股权"},{"key":"B","text":"经考量后拒绝乙基金的购买意向"},{"key":"C","text":"可以优先于乙基金以同等价格购买小王所持全部股权"},{"key":"D","text":"可以优先于乙基金以折扣价格购买小王所持"}],"answer":"C","explain":"第一拒绝权赋予权利人在同等条件下优先于第三方购买拟转让股权的权利，故甲基金可以同一价格优先于乙基金受让小王所持全部股权，选C。该权利不是与第三方共同购买，也不是单纯的否决权，更不能以折扣价格行使。","chapter":"第一拒绝权行使","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0092","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"以下关于法律尽职调查,表述错误的是（）","options":[{"key":"A","text":"法律尽调更多的是定位于价值发现,审查评估企业法律方面重要问题"},{"key":"B","text":"法律尽调关注重点问题包括主要股东情况法律尽调的作用是帮助基金管理人全面地评"},{"key":"C","text":"估企业资产和业务的合法性以及潜在的法律风险"},{"key":"D","text":"法律尽调关注重点问题包括企业债务及对外担保情况、重大合同等"}],"answer":"A","explain":"法律尽职调查更多定位于风险发现而非价值发现，其作用是审查评估企业法律方面的重要问题，A表述错误。B、C、D关于其主要作用及主要股东、债务担保、重大合同等关注重点的表述都是正确的。","chapter":"法律尽职调查定位","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0093","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"关于杠杆收购使用的夹层资本，表述错误的是（）。","options":[{"key":"A","text":"夹层资本通常采取优先股和次级债券的形式，不会对普通股产生影响"},{"key":"B","text":"夹层资本通常无法要求融资方提供资产抵押或由第三方担保"},{"key":"C","text":"夹层资本会造成可用杠杆水平的提高"},{"key":"D","text":"夹层资本通常来自夹层基金、保险公司以及公开市场"}],"answer":"A","explain":"夹层资本通常以优先股、次级债券等形式提供，其权益安排会影响普通股股东的权利与收益分配，A说“不会对普通股产生影响”错误。夹层资本一般难以取得资产抵押或第三方担保，成本较高且能提高可用杠杆水平，资金多来自夹层基金、保险公司及公开市场。","chapter":"杠杆收购夹层资本","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0094","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"某投资者于2015年T日投资某基金200万元,T日该基金份额净值为1.00。截至2017年末基金份额净值为1.20,该投资者已获得现金分红60万元,其已分配收益倍数为()。","options":[{"key":"A","text":"0.5"},{"key":"B","text":"1.5"},{"key":"C","text":"0.3"},{"key":"D","text":"0.2"}],"answer":"B","explain":"该指标反映投资者已获得的回报与实缴出资的倍数关系：累计可归属金额=现金分红60万元+按期末份额净值计算的240万元（200万元×1.2）=300万元，300÷200=1.5，故选B。若只把60万元现金分红计入分子，会得到0.3这一遗漏未分配价值的错误结果。","chapter":"已分配收益倍数","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0095","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"某股权投资基金以投资当年的预计净利润为基数，按10倍市盈率对目标企业进行投资前估值。基金投资金额为2亿元，投资后持有股权比例为10%，投资当年的预计净利润为（）亿元。","options":[{"key":"A","text":"2"},{"key":"B","text":"1.75"},{"key":"C","text":"1.8"},{"key":"D","text":"1.6"}],"answer":"C","explain":"投资后估值=投资额÷持股比例=2÷10%=20亿元，投资前估值=20-2=18亿元，按10倍市盈率计算，投资当年预计净利润=18÷10=1.8亿元，选C。若直接用20亿元除以10会得到2亿元，属于把投后估值误当投前估值的错误。","chapter":"市盈率法估值","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0096","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"2019年10月","type":"single","stem":"股权投资基金的估值,是指通过对基金所持有的全部资产及应承担的全部负债按一定的原则和方法进行评估与计算,最终确定()的过程。","options":[{"key":"A","text":"基金资产净值"},{"key":"B","text":"基金资产净现值"},{"key":"C","text":"基金资产总值"},{"key":"D","text":"基金资产现值"}],"answer":"A","explain":"股权投资基金估值是对基金持有的全部资产和承担的全部负债按一定原则方法评估计算，最终确定基金资产净值的过程，选A。资产总值未扣减负债，净现值、现值属于现金流折现的概念，与基金估值定义不同。","chapter":"基金估值定义","disputed":false,"source":{"title":"2019年10月基金从业《股权投资基金》真题及答案-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/201910/09080040323.html"}},{"id":"k3-0097","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金的组织形式主要分为公司型、合伙型和信托(契约)型三种组织形式,关于基金组织形式及其投资决策描述正确的是()。","options":[{"key":"A","text":"合伙型基金的投资者一般以有限合伙人身份存在,有限合伙人可通过在投资决策委员会委派观察员或在咨询委员会中委派委员等方式,在一定程度上了解基金的投资决策并在合理的范围内提供建议"},{"key":"B","text":"公司型基金的最高权力机构是董事会，公司型基金的投资者可以通过参加公司型基金的董事会参与基金的运营决策"},{"key":"C","text":"公司型基金可由公司内部的基金管理运营团队进行管理,通常的形式是在股动会之下设置投资决策委员会,其成员一般由股东会委派"},{"key":"D","text":"信托(契约)型基金的基金份额持有人大会及其日常机构可以直接参与或者干涉基金的投资管理活动"}],"answer":"C","explain":"公司型基金既可委托外部管理人，也可由公司内部团队管理，后者通常在公司内部设投资决策委员会负责投资决策，C表述正确。A关于有限合伙人通过委派观察员等方式介入投资决策的表述不符合有限合伙人不执行合伙事务的规则；B错在公司最高权力机构是股东（大）会而非董事会；D错在份额持有人大会不得直接参与或干涉基金投资管理。","chapter":"基金组织形式与决策","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第三章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11164052665.html"}},{"id":"k3-0098","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股东持有该公司100%股权，持股数量为10000股；股权投资基金B于2019年6月30日投资了A公司，每股价格为10元，获得新发行股份1000股，投资时B基金与A公司及创始股东签订了反摊薄条款。A公司拟于近期开展后轮融资，针对后轮投资者，每股价格拟定为8元，新发行股份为1000股。A公司创股东需要向B基金进行补偿，则以下表述错误的是（）","options":[{"key":"A","text":"若B基金签署的是完全棘轮条款，应补偿股份数量为250股"},{"key":"B","text":"若B基金签署的是完全棘轮条款，应补偿股份价格为8元/股"},{"key":"C","text":"若B基金签署的是加权平均条款，应补偿股份数量为17股"},{"key":"D","text":"若B基金签署的是加权平均条款，经过反稀释调整后，B基金对A公司的每股投资成本降低为9.83元"}],"answer":"B","explain":"完全棘轮条款下，B基金原按10元/股投资的1000股需按后轮8元/股重新计算，应得1250股，由创始股东无偿（或以名义价格）补偿250股，A正确；补偿并非以8元/股的价格出售股份给投资者，B表述错误。加权平均方式下补偿数量及每股成本相应较低，C、D的表述成立，故选B。","chapter":"反稀释条款计算","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.31）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/31104222169746.html"}},{"id":"k3-0099","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"符合《上市公司创业投资基金股东减持股份的特别规定》的某创业投资基金2014年6月1日向A高新技术企业增资200万元人民币，2015年6月1日该基金对A企业追加投资800万元人民币，2018年6月30日A企业首次公开发行股份的材料被证监会正式受理，2019年7月1日A企业首次公开发行并上市该基金拟通过竞价交易减持其持有的A企业首次公开发行前的股份，以下表述正确的是（）","options":[{"key":"A","text":"在1个月内减持股份的总数不得超过公司股份总数的1%"},{"key":"B","text":"在2个月内减持股份的总数不得超过公司股份总数的1%"},{"key":"C","text":"在3个月内减持股份的总数不得超过公司股份总数的2%"},{"key":"D","text":"在3个月内减持股份的总数不得超过公司股份总数的1%"}],"answer":"D","explain":"创业投资基金减持首发前股份的比例限制与投资期限档位挂钩，投资期限自投资之日起计算至规定的时点。本题基金自2014年首次投资、后续又追加投资，应按规定口径计算投资期限并适用相应档位的减持窗口与比例上限，符合规定的表述是D（3个月内减持总数不超过公司股份总数的1%）；A、B、C的时间窗口与比例组合不符合规定档位。","chapter":"创投基金减持规定","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第九章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/13000000123.html"}},{"id":"k3-0100","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金A现拟对目标公司B进行财务尽职调查，B公司旗下拥有多家控股子公司及参股子公司，以下表述正确的（）","options":[{"key":"A","text":"B公司于财务尽职调查前2个月收购了F公司5%的股权，A基金应取得并审阅相关收购协议，如无异议则无需进一步核查财务情况"},{"key":"B","text":"A基金应获取B公司披露的参股子公司D最近一年的财务报告，但无需获得审计报告或进一步履行审慎核查程序"},{"key":"C","text":"A基金应获取B公司纳入合并报表范围的重要控股子公司C最近一年的财务报告及审计报告，但无需进一步履行审慎核查程序"},{"key":"D","text":"B公司于财务尽职调查前6个月对E公司完成的收购被视为重大收购，A基金应获得E公司被收购前一年的财务报表并核查其财务情况"}],"answer":"D","explain":"对尽调前不久（本题为6个月前）完成的重大收购，应取得被收购企业被收购前一年的财务报表并核查其财务状况，D正确。参股子公司和纳入合并范围的重要控股子公司均需取得财务报告并进一步审慎核查，不能因“无异议”而免于核查，A、B、C均以“无需进一步核查”为前提，表述错误。","chapter":"财务尽职调查范围","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.3）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/03105427961141.html"}},{"id":"k3-0101","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某股权投资基金《风险揭示书》中有如下一项风险揭示：“本基金可能存在不能满足成立条件从而无法成立的风险。对此，基金管理人承担责任的方式为：（1）以其固有财产承担募集行为而产生的债务和费用。（2）在基金募集期限届满（确认基金无法成立）后30日内返还投资人已交纳的款项，并加计银行同期存款利息。”就该项风险，描述错误的是（）","options":[{"key":"A","text":"相对于特殊风险，该风险揭示事项属于一般风险"},{"key":"B","text":"通常情况下，该风险仅适用于基金管理人资信不良的股权投资基金"},{"key":"C","text":"如投资者对此项风险有疑问，基金管理人有义务向投资者进一步解释、阐明"},{"key":"D","text":"该风险所描述的是基金募集失败所涉风险"}],"answer":"B","explain":"该风险揭示描述的是基金募集失败的风险，属于所有基金都可能面临的一般风险，B说“仅适用于资信不良的管理人”错误。投资者有疑问时管理人有解释说明义务，该风险与特殊风险相区别，A、C、D正确。","chapter":"风险揭示书内容","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第四章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/10173844491.html"}},{"id":"k3-0102","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某股权投资基金现对目标公司A进行法律尽职调查，发现A公司近期存在以下诉讼与仲裁事项，关于法律尽职调查应关注的主要内容，以下表述正确的是（）","options":[{"key":"A","text":"A公司就与某公司的业务往来争议进行仲裁并已获得当地仲裁委员会的支持，应主要关注该仲裁机构的委员构成"},{"key":"B","text":"A公司已结案的败诉案件中，应主要关注当事各方咋该案件过程中是否存在疑点等可能影响败诉的因素"},{"key":"C","text":"A公司的未决仲裁中，应主要关注起因，主要过程及双方在诉求上存在的差异等因素"},{"key":"D","text":"A公司在与某公司的诉讼终审中胜诉并判决某公司应对A公司进行赔款，应主要关注是否获得了法院出具的终审判决书"}],"answer":"C","explain":"对于未决仲裁，应重点关注争议起因、主要过程以及双方在诉求上的差异，以判断潜在影响，C正确。已决案件重点在于败诉原因及可能的赔偿影响，胜诉案件重点在于判决执行情况，仲裁机构委员构成、是否持有判决书都不是核心关注点，A、B、D表述不当。","chapter":"法律尽调诉讼仲裁","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0103","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某合伙型基金A于2008年1月1日募集完成并设立，认缴规模3医院人民币，全体合伙人自设立之日起每年1月1日缴款1亿元。连续3年缴清全部认缴额。从2012年1月1日起，基金A每年将2亿元现金用于分配。连续3年，至2014年1月1日分配后完成清算。根据合伙协议约定，基金A按照瀑布式分配收益。即在全体合伙人回收全部本金并将其每笔出资达到单科8%/年回报率后，基金管理人行使追赶机物并可最多提取20%的净投资收益作为业绩报酬。2013年6月30日基金的已分配收益倍数为（）。","options":[{"key":"A","text":"缺少条件无法计算"},{"key":"B","text":"1.33"},{"key":"C","text":"2"},{"key":"D","text":"0.67"}],"answer":"C","explain":"已分配收益倍数（DPI）=基金累计向投资者分配的金额÷投资者实缴出资总额。本题基金认缴规模已全部实缴，按累计分配额与实缴出资总额之比计算得2，故选C。只取某一年分配额（2亿元）会得0.67，只取部分年份分配额（4亿元）会得1.33，都是口径不完整的干扰项。","chapter":"已分配收益倍数","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第八章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/13000000790.html"}},{"id":"k3-0104","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于基金管理人在中国证券投资基金业协会登记时的业务范围问题，以下表述错误的是（）。","options":[{"key":"A","text":"对于兼营民间借贷、民间融资、配资业务、小额理财、小额借贷、P2P/P2B、众筹等业务的申请机构，需要提前进行业务剥离"},{"key":"B","text":"在管理人登记法律意见书中，律师需要对股权投资基金类管理人从事“投资咨询”业务进行审慎调查和论证说明"},{"key":"C","text":"对于兼营保理、担保、房地产开发、交易平台等业务的申请机构，需要提前进行业务剥离"},{"key":"D","text":"股权投资基金类管理人的“投资咨询”业务的实际经营范围可以存在《证券、期货投资咨询管理暂行办法》规定的“证券、期货投资咨询”业务"}],"answer":"D","explain":"股权投资基金类管理人的“投资咨询”业务不得涉及《证券、期货投资咨询管理暂行办法》规定的证券、期货投资咨询业务，D表述错误。兼营民间借贷、配资、保理、担保、房地产开发等业务的申请机构须先行业务剥离，律师在法律意见书中需对“投资咨询”业务作审慎调查论证，A、B、C正确。","chapter":"管理人登记业务范围","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.16）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/16141703545731.html"}},{"id":"k3-0105","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于我国二级股票市场的主要交易机制，以下表述正确的是（）","options":[{"key":"A","text":"大宗交易转让的买卖双方可以就交易价格和数量进行协商，具有有效率低成本的特点，但会对股票的交易价格形成巨大冲击"},{"key":"B","text":"上市公司股份的买卖双方可以就已达成的转让协议，向证券交易所和登记机构申请办理股份的转让过户，但该股份的转让仅限于流通股"},{"key":"C","text":"如果收购人自愿选择以要约方式收购上市公司股份，其可以选择向被收购的所有股东发出只收购其持有的部分股份的要约"},{"key":"D","text":"竞价交易的规则约定，ST股票和*ST股票价格的涨跌幅(一个交易日价格相对上一个交易日收市价格）均不超过20%"}],"answer":"C","explain":"收购人自愿以要约方式收购上市公司股份时，可以选择向全体股东发出只收购部分股份的要约，C ptions":[{"key":"A","text":"Ⅰ、Ⅱ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"C","text":"Ⅱ、Ⅲ"},{"key":"D","text":"Ⅰ、Ⅲ"}],"answer":"D","explain":"合伙人之间转让财产份额只需通知其他合伙人，不必经一致同意，Ⅰ正确；向合伙人以外的第三人转让会影响原有合伙信任关系，须经其他合伙人一致同意且其他合伙人在同等条件下享有优先购买权，Ⅲ正确，故选D。Ⅱ认为不影响信任关系，故不选。","chapter":"合伙份额转让规则","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.1）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/0110503746454.html"}},{"id":"k3-0114","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于公司型基金的所得税，以下表述错误的是（）Ⅰ、适用“先分后税”原则Ⅱ、公司型基金收到的来自被投企业的股利和利息属于免税收入Ⅲ、投资者如为公司，以股息红利形式取得的基金分配，需计算为应纳税所得额缴纳所得税Ⅳ、投资者如为合伙企业，无需对股息红利形式的基金分配缴纳所得税V、若自然人投资者收到的公司制基金的分配款全部来源于被投企业股利时，由于双重征税，自然人实际承担的所得税税负率高于20%","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ、V"},{"key":"B","text":"Ⅱ、Ⅳ、V"},{"key":"C","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅲ、Ⅳ"}],"answer":"A","explain":"公司型基金不适用“先分后税”，先分后税是合伙型基金的税务处理，Ⅰ错误；其取得的股息、利息并非一概免税，Ⅱ错误；投资者为公司的，取得的股息红利符合条件时可作免税收入处理，并不当然计入应纳税所得额，Ⅲ错误；Ⅳ、Ⅴ的说法成立，故选A。","chapter":"公司型基金所得税","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.30）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/30104839437339.html"}},{"id":"k3-0115","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于基金投资者和管理人间的收益分配，以下于属于单一项目分配的是（）","options":[{"key":"A","text":"每个投资项目退出后的全部资金，在投资者和管理人之间按约定分配，需先返还投资者本金"},{"key":"B","text":"每个投资项目退出后的每一笔资金，在投资者和管理人之间按约定分配，不必先返还投资者全部本金"},{"key":"C","text":"每个投资项目退出后的全部资金，在投资者和管理人之间按约定分配前，需先返还投资者本金和支付优先收益"},{"key":"D","text":"每个投资项目退出后的每一笔资金，在投资者和管理人之间按约定分配，需先支付优先收益，不必返还投资人本金"}],"answer":"C","explain":"单一项目分配是指每个投资项目退出后就该项目回收的全部资金进行分配，分配顺序上须先返还投资者本金并支付优先收益，剩余部分再在投资者与管理人之间按约定分配，C正确。A、B未明确支付优先收益，B、D按“每一笔资金”分配或颠倒本金与优先收益顺序，均不符合单一项目分配的安排。","chapter":"收益分配方式","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第八章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/13000000790.html"}},{"id":"k3-0116","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金为被投资企业提供增值服务，以下表述错误的是()。","options":[{"key":"A","text":"协助被投资企业进行后续再融资工作，以便投资机构能够参与被投资企业的后续轮次融资"},{"key":"B","text":"主要目的是提升被投资企业的价值,降低投资风险，最终实现投资机构对被投资项目的顺利退出"},{"key":"C","text":"对于发展较为成熟的被投资企业，增值服务侧重在资源导入、兼并收购、上市推动等方面"},{"key":"D","text":"对于早期阶段的被投资企业，增值服务侧重在规范管理、业务开拓、后续再融资等方面关于项目跟踪与监控中需要重点关注的管理事项，"}],"answer":"A","explain":"增值服务中的后续再融资是帮助被投资企业对接资本市场完成融资，而不是为了让投资机构自己参与后续轮次融资，A的目的表述错误。B、C、D关于增值服务目的及不同发展阶段侧重内容的表述正确。","chapter":"增值服务内容","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（6.4）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202306/04104959584643.html"}},{"id":"k3-0117","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金A针对目标公司B的投资流程已进入投资交割环节，以下表述错误的是（）。","options":[{"key":"A","text":"B公司和A基金在投资协议上约定将投资款转入B公司股东C的账户而不是B公司的账户"},{"key":"B","text":"A基金没有办理托管，在其内部决策批准后按照投资协议的要求将投资款直接转入B公司的账户"},{"key":"C","text":"投资交割作为股权投资基金流程中的一环，需待A基金与B公司的投资协议正式生效后进行"},{"key":"D","text":"B公司收到A基金转入的投资款后出具了加盖公司公章的收据和认可股权变更的说明，这标志了投资交割的完成"}],"answer":"D","explain":"投资交割的完成以投资协议约定的交割条件全部满足为标志，通常包括投资款支付到位和股权变更登记等；仅凭被投企业出具的收据和认可股权变更的说明，不足以认定交割完成，D表述错误。交割应在投资协议生效后进行，资金应按约定支付至目标公司账户并由基金履行内部决策和划款程序，A、B、C的做法符合流程要求。","chapter":"投资交割环节","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.19）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/19114407352698.html"}},{"id":"k3-0118","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于企业境内上市流程，以下表述错误的是（）","options":[{"key":"A","text":"在企业上市流程中，企业改制是指企业以在资本市场公开发行和交易股票为目的而进行的企业组织结构，资本资产等方面的改组行为"},{"key":"B","text":"股票发行申请经发行审核委员会核准后，企业将取得中国证监会同意发行的批文"},{"key":"C","text":"根据中国证监会的有关规定，拟公开发行股票的股份有限公司在向中国证监会提出股票发行申请前，均须由具有主承销资格的证券公司进行辅导"},{"key":"D","text":"证券交易所对收到企业和中介机构制作的上市申请文件，需进行受理和审核"}],"answer":"D","explain":"在企业境内上市流程中，股票发行申请由发行审核机构审核、中国证监会核准（注册）并发文，证券交易所主要负责上市受理、审核与上市安排，D把发行申请的受理审核一并归于交易所，表述错误。企业改制、取得证监会同意发行的批文、由具主承销资格的证券公司辅导，A、B、C正确。","chapter":"境内上市流程","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第七章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/12000000776.html"}},{"id":"k3-0119","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金投资者的主要类型，以下表述正确的是（）。","options":[{"key":"A","text":"大型企业可以选择不作为投资者，而以自有资金出资并通过子公司的形式直接进行创业投资业务"},{"key":"B","text":"公共养老基金是资本市场稳定的机构投资人，而公司养老基金受业绩表现的影响，无法提供长期的资金来源"},{"key":"C","text":"在国外股权投资市场中，富有的个人或家族通常倾向于作为基金管理人而非基金投资人参与到股权投资基金，以便管理其资产"},{"key":"D","text":"与美国市场不同，欧洲的商业银行不得作为投资者参与欧州市场的股权投资基金"}],"answer":"A","explain":"大型企业可以不作为基金投资者，而是以自有资金通过设立子公司等方式直接开展创业投资业务，A正确。公司养老基金同样能够提供长期资金；国外富有的个人或家族通常作为基金投资人；欧洲商业银行可以参与欧洲市场的股权投资基金，B、C、D错误。","chapter":"基金投资者类型","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.7）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/07110522152330.html"}},{"id":"k3-0120","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于基金服务机构为防范基金服务业务中的利益冲突应采取的措施，以下表述正确的是()。","options":[{"key":"A","text":"基金服务机构应当对提供服务业务所涉及的基金财产和投资者财产实行严格分账管理"},{"key":"B","text":"即使基金托管人能将其托管职能和基金服务职能进行分离，该托管人也不得被委托担任同一基金的基金服务机构"},{"key":"C","text":"基金服务机构破产或者清算时，基金服务业务所涉及的投资者财产属于其破产或者清算财产"},{"key":"D","text":"基金服务机构破产或者清算时，基金服务业务所涉及的基金财产属于其破产或者清算财产"}],"answer":"A","explain":"基金服务机构应对服务业务涉及的基金财产和投资者财产实行严格分账管理，且这些财产不属于服务机构的自有财产，服务机构破产或清算时不列入破产清算财产，A正确，C、D错误。托管人在能够将托管职能与服务职能有效分离的前提下，可以被委托担任同一基金的基金服务机构，B错误。","chapter":"基金服务机构利益冲突","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.14）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/14151513253320.html"}},{"id":"k3-0121","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"2017年底，股权投资基金A投资某创业企业1,000万元。持股占比10%；2018年初，该企业对基金分红派息100万元，同年9月该企业以700万元价格回购基金持有的该企业5%股权；2019年，该企业被某上市公司收购，基金转让剩余股权，作价800万元，已知增值税税率为6%，以下说法正确的是（）。","options":[{"key":"A","text":"基金公司合计需增纳增值税36万元"},{"key":"B","text":"基金公司无需缴纳增值税"},{"key":"C","text":"基金公司合计需缴纳增值税12万元"},{"key":"D","text":"基金公司合计需缴纳增值税30万元"}],"answer":"B","explain":"基金持有的标的是未上市企业股权，取得的100万元分红派息不属于增值税征税范围；以700万元回购部分股权、剩余股权被上市公司收购，本质上仍是转让非上市公司股权，不属于金融商品转让，因此基金无需缴纳增值税，选B。A、C、D的金额都是把股权转让价差当作金融商品转让销售额计算出的干扰结果。","chapter":"股权转让增值税","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.8）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/08110708819627.html"}},{"id":"k3-0122","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于投资后增值服务，以下表述错误的是（）","options":[{"key":"A","text":"投资机构协助企业建立规范的现代化财务管理体系，以“规范管理、风险控制和全面预算”为基本准则。"},{"key":"B","text":"后续再融资是指投资机构会利用自己在资本市场的关系网络，为被投资企业进行债券融资。"},{"key":"C","text":"为企业提供管理咨询服务，主要是指为被投资企业提供战略、组织、财务、人力资源市场营销等方面的咨询建议。"},{"key":"D","text":"被投资企业往往倾向于选择那些在投资行业中具有广泛关系网络的投资机构，保证后续轮次融资活动的顺利进行。"}],"answer":"B","explain":"后续再融资是指投资机构利用自身资本市场关系网络帮助被投资企业进行股权融资，B说“债券融资”与该服务内容不符，表述错误。协助建立规范的财务管理体系、提供战略与组织等管理咨询、企业倾向选择关系网络广泛的投资机构，A、C、D正确。","chapter":"增值服务后续再融资","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第六章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11171637139.html"}},{"id":"k3-0123","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"2016年8月1日，基金甲以每股2元的价格投资了某高新技术企业A公司500万股；2019年7月25日，A公司正式提交发行申请材料；2020年6月6日，A公司在创业板首次公开有A公司500万股。基金甲作为符合《上市公司创业投资基金股东减持股份的特别规定》所述的创业投资基金，可以通过证券交易所集中竞价交易在（）","options":[{"key":"A","text":"2个月内减持不超过5万股"},{"key":"B","text":"2个月内减持不超过30万股"},{"key":"C","text":"3个月内减持不超过30万股"},{"key":"D","text":"3个月内减持不超过5万股"}],"answer":"A","explain":"该基金2016年8月投资、2020年6月企业上市，投资期限在36个月以上不满48个月，适用2个月内减持股份总数不超过公司股份总数1%的规定。基金持有500万股，1%即5万股，故选A。3个月的窗口对应更短的投资期限档，30万股则是把6%或更高比例套用的错误结果。","chapter":"创投基金减持规定","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.29）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/29164325911679.html"}},{"id":"k3-0124","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某有限合伙型股权投资基金合伙协议约定管理费自基金成立日起开始计算，年度管理费为投资人总认缴出资的2%，且管理人可以视实际需要预先提取不超过2年的管理费，该基金于7月1日成立，投资人根据合伙协议的约定，在基金成立的当年已按认缴出资的40%实际出资2亿元，则基金成立成立当年年末，管理人可从基金实际支取的管理费的区间为（）","options":[{"key":"A","text":"200万元-2000万元"},{"key":"B","text":"200万元-800万"},{"key":"C","text":"500万元-800万元"},{"key":"D","text":"500万元-2000万元"}],"answer":"D","explain":"基金认缴总规模=实缴2亿元÷40%=5亿元，年度管理费=5亿元×2%=1000万元。基金7月1日成立，当年按约半年计算管理费约500万元；管理人可预先提取不超过2年的管理费，上限为2000万元，故当年实际支取区间为500万元至2000万元，选D。A、B、C的下限或上限计算错误。","chapter":"基金管理费计算","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.25）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/25155215531119.html"}},{"id":"k3-0125","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金向投资者披露信息，以下表述错误的是（）","options":[{"key":"A","text":"股权投资基金的管理人和托管人均按照规定进行信息披露"},{"key":"B","text":"信息披露指引由中国证监会制定，中国证券投资基金业协会依据指引进行信息披露行业自律管理"},{"key":"C","text":"股权投资基金的信息披露义务应当在基金合同中约定向投资者披露可能存在的利益冲突情况以及可能影响投资者合法权益的其他重大信息"},{"key":"D","text":"基金合同应当明确信息披露义务人向投资者进行信息披露的内容、披露频度、披露方式、披露责任以及披露渠道"}],"answer":"B","explain":"私募基金信息披露规则由基金业协会制定并实施自律管理，B把信息披露指引的制定主体说成中国证监会、由协会依据指引进行管理，表述错误。管理人和托管人按规定履行披露义务，基金合同应约定披露内容与重大信息（含利益冲突），内容、频度、方式、责任和渠道属于合同必备事项，A、C、D正确。","chapter":"信息披露规则制定","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第八章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/13000000790.html"}},{"id":"k3-0126","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金A股权投资基金B分别持有目标公司甲的股权10%，15%，其余股份均为公司创始人持有，目标公司甲拟通过增发500股融资1000万元用于拓展线下直营店。股权投资基金C有意向认购，创始人及股权投资基金B表示放弃优先认购权，股权投资基金A行使优先认购权，则股权投资基金C可以认购的股份数量以及对应的投资额分别为（）。","options":[{"key":"A","text":"450股，900万元"},{"key":"B","text":"375股，750万元"},{"key":"C","text":"225股，450万元"},{"key":"D","text":"400股，800万元"}],"answer":"A","explain":"本次增发500股，基金A持股10%，按比例优先认购50股，创始人和基金B放弃优先认购权，其余45
