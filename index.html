<style>
/* ============================================================
   基金从业在线刷题 · 样式
   桌面 / 平板 / 手机自适应
   ============================================================ */
:root{
  --bg:#f4f6fb;
  --bg-soft:#ffffff;
  --panel:#ffffff;
  --panel-2:#f8fafc;
  --text:#1a2233;
  --text-2:#5b6880;
  --text-3:#8a97ad;
  --line:#e6eaf2;
  --line-2:#eef1f7;
  --brand:#2f6bff;
  --brand-2:#1d4ed8;
  --brand-soft:#eaf0ff;
  --ok:#12a05c;
  --ok-soft:#e6f7ee;
  --bad:#e04a4a;
  --bad-soft:#fdecec;
  --warn:#d98a00;
  --warn-soft:#fff5e0;
  --shadow:0 2px 4px rgba(20,35,80,.04),0 8px 24px rgba(20,35,80,.06);
  --shadow-lg:0 12px 40px rgba(20,35,80,.12);
  --r:14px;
  --r-sm:9px;
  --tabbar-h:58px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
html[data-theme="dark"]{
  --bg:#0f1420;
  --bg-soft:#151b29;
  --panel:#171e2e;
  --panel-2:#1d2537;
  --text:#e8edf7;
  --text-2:#a3b0c7;
  --text-3:#78849c;
  --line:#26304a;
  --line-2:#222b40;
  --brand:#5b8cff;
  --brand-2:#7ba4ff;
  --brand-soft:#1b2744;
  --ok:#35c98a;
  --ok-soft:#12301f;
  --bad:#ff6b6b;
  --bad-soft:#331a1c;
  --warn:#f0b429;
  --warn-soft:#322711;
  --shadow:0 2px 4px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --shadow-lg:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  scroll-behavior:smooth;
}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  transition:background .2s,color .2s;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
a,label,select{-webkit-tap-highlight-color:transparent}
kbd{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel-2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--text-2)}
img{max-width:100%;height:auto}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg-soft) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.topbar-inner{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:1;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),#7c3aed);color:#fff;font-weight:700;font-size:17px}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-text strong{display:block;font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{color:var(--text-3);font-size:12px;line-height:1.3}
.topnav{display:flex;align-items:center;gap:4px}
.nav-btn{padding:7px 12px;border-radius:9px;font-size:13.5px;color:var(--text-2);display:flex;align-items:center;gap:5px;
  transition:.15s;white-space:nowrap}
@media (hover:hover){.nav-btn:hover{background:var(--panel-2);color:var(--text)}}
.nav-btn.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-btn.icon{font-size:16px;padding:7px 10px}
.pill{background:var(--line);color:var(--text-2);border-radius:20px;font-size:11px;padding:1px 6px;font-weight:600;min-width:18px;text-align:center}
.nav-btn.active .pill{background:var(--brand);color:#fff}

#app{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:24px 20px 64px}
.view[hidden]{display:none}

/* ---------- 首页 ---------- */
.hero{background:linear-gradient(135deg,var(--brand) 0%,#6d5ae6 55%,#8b5cf6 100%);border-radius:20px;
  padding:34px 32px;color:#fff;box-shadow:var(--shadow-lg);margin-bottom:28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:rgba(255,255,255,.12)}
.hero h1{font-size:26px;line-height:1.35;letter-spacing:.4px;margin-bottom:8px;position:relative}
.hero p{opacity:.92;font-size:14px;max-width:640px;position:relative}
.hero-stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap;position:relative}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:22px;font-weight:700;letter-spacing:.5px}
.hero-stats span{font-size:12px;opacity:.85}

.section-title{font-size:16px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brand)}

.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.subject-card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:18px;
  cursor:pointer;transition:.18s;position:relative;text-align:left;box-shadow:var(--shadow);width:100%}
@media (hover:hover){.subject-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}}
.subject-card.on{border-color:var(--brand);background:var(--brand-soft)}
.subject-card h3{font-size:15.5px;margin-bottom:6px;line-height:1.45}
.subject-card .sc-meta{font-size:12.5px;color:var(--text-3);display:flex;gap:10px;flex-wrap:wrap}
.subject-card .sc-count{margin-top:12px;font-size:24px;font-weight:700;color:var(--brand)}
.subject-card .sc-count em{font-size:12px;font-weight:400;color:var(--text-3);font-style:normal;margin-left:3px}
.subject-card .sc-bar{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.subject-card .sc-bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .4s}

.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;
  transition:.18s;box-shadow:var(--shadow);width:100%}
@media (hover:hover){.mode-card:hover{border-color:var(--brand);transform:translateY(-2px)}}
.mode-card:active{border-color:var(--brand);background:var(--brand-soft)}
.mode-card b{display:block;font-size:14.5px;margin-bottom:4px}
.mode-card span{font-size:12.5px;color:var(--text-3);line-height:1.55}
.mode-card .mc-icon{font-size:20px;display:block;margin-bottom:8px}

/* ---------- 筛选 ---------- */
.filter-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0;margin-top:20px;box-shadow:var(--shadow);overflow:hidden}
.filter-toggle{display:none;width:100%;padding:15px 18px;align-items:center;gap:10px;text-align:left}
.filter-toggle strong{font-size:14.5px;flex:none}
.filter-toggle .ft-state{flex:1;font-size:12.5px;color:var(--text-3);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-toggle .ft-arrow{flex:none;color:var(--text-3);transition:transform .2s;font-size:13px}
.filter-panel[data-open="false"] .ft-arrow{transform:rotate(-90deg)}
.filter-body{padding:16px 18px}
.filter-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.filter-head-hint{display:none;font-size:12.5px;color:var(--text-3)}
.filter-row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.filter-row:first-of-type{border-top:0}
.filter-row>label{flex:none;width:70px;font-size:13px;color:var(--text-3);padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--text-2);transition:.15s;background:var(--panel-2);min-height:32px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
select{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;
  font-size:13px;color:var(--text);max-width:100%;font-family:inherit}
.filter-tip{font-size:12.5px;color:var(--text-3);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.filter-tip b{color:var(--brand)}

.notice{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:var(--r-sm);padding:13px 16px;font-size:12.5px;color:var(--text-3);line-height:1.75;box-shadow:var(--shadow);word-break:break-word}
.notice b{color:var(--text-2)}

/* ---------- 按钮 ---------- */
.primary-btn{background:var(--brand);color:#fff;border-radius:10px;padding:9px 18px;font-size:13.5px;font-weight:600;
  transition:.15s;box-shadow:0 2px 8px color-mix(in srgb,var(--brand) 35%,transparent);min-height:40px}
@media (hover:hover){.primary-btn:hover{background:var(--brand-2);transform:translateY(-1px)}}
.primary-btn:active{background:var(--brand-2);transform:scale(.98)}
.primary-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ghost-btn{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--text-2);
  background:var(--panel);transition:.15s;min-height:40px}
@media (hover:hover){.ghost-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}}
.ghost-btn:active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.ghost-btn.danger:active{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ghost-btn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.link-btn{color:var(--brand);font-size:13px;padding:6px 2px}

/* ---------- 答题 ---------- */
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.quiz-head-left,.quiz-head-right{display:flex;align-items:center;gap:10px;min-width:0}
.quiz-mode-tag{font-size:12.5px;color:var(--brand);background:var(--brand-soft);border-radius:20px;padding:4px 11px;
  font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quiz-counter{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.quiz-timer{font-size:13.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:4px 11px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.quiz-timer.low{color:var(--bad);background:var(--bad-soft);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.progress-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--brand),#8b5cf6);transition:width .3s;border-radius:3px}

.quiz-body{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:20px;align-items:start}
.q-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);min-height:400px}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:12px}
.tag{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--text-3)}
.tag.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand);font-weight:600}
.tag.multi{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:600}
.tag.warn{background:var(--bad-soft);border-color:transparent;color:var(--bad);font-weight:600}
.q-stem{font-size:16.5px;line-height:1.85;margin-bottom:20px;word-break:break-word}
.q-stem .qno{color:var(--brand);font-weight:700;margin-right:6px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:13px 15px;cursor:pointer;transition:.14s;background:var(--panel);text-align:left;width:100%;min-height:48px}
@media (hover:hover){.opt:hover{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));background:var(--brand-soft)}}
.opt:active{background:var(--brand-soft);border-color:var(--brand)}
.opt .key{flex:none;width:25px;height:25px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--text-2);transition:.14s}
.opt .txt{flex:1;font-size:14.5px;line-height:1.65;padding-top:1px;word-break:break-word}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .key{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}

.explain{margin-top:18px;border-radius:var(--r-sm);padding:15px 17px;font-size:14px;line-height:1.8;
  background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--brand);animation:fade .2s}
.explain .ex-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px;font-weight:700;flex-wrap:wrap}
.explain .ex-head .verdict{padding:2px 9px;border-radius:6px;font-size:12.5px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.explain .ex-body{color:var(--text-2);word-break:break-word}
.explain .ex-warn{margin-top:9px;font-size:12.5px;line-height:1.6;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:7px 10px}
.explain .ex-src{margin-top:10px;font-size:11.5px;color:var(--text-3);word-break:break-all}
.explain .ex-src a{color:var(--text-3)}

.q-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
.q-actions .spacer{flex:1}

.side-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.side-box h3{font-size:13.5px;margin-bottom:12px;color:var(--text-2);font-weight:600}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(31px,1fr));gap:6px;max-height:280px;overflow-y:auto}
.card-cell{aspect-ratio:1;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;
  color:var(--text-3);background:var(--panel-2);transition:.14s;font-variant-numeric:tabular-nums}
.card-cell:active{border-color:var(--brand);color:var(--brand)}
.card-cell.done{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 50%,transparent);color:var(--brand)}
.card-cell.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.card-cell.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.card-cell.cur{outline:2px solid var(--brand);outline-offset:1px;font-weight:700}
.card-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11.5px;color:var(--text-3)}
.card-legend span{display:flex;align-items:center;gap:4px}
.lg{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.lg-done{background:var(--brand-soft);border-color:var(--brand)}
.lg-right{background:var(--ok-soft);border-color:var(--ok)}
.lg-wrong{background:var(--bad-soft);border-color:var(--bad)}
.lg-cur{background:transparent;border-color:var(--brand);outline:1px solid var(--brand)}
.side-actions{display:flex;flex-direction:column;gap:8px}
.side-actions .ghost-btn{width:100%;text-align:center}
.kbd-tip{font-size:11.5px;color:var(--text-3);margin-top:12px;line-height:2}

/* 抽屉把手 / 头部：仅移动端可见 */
.sheet-grab,.sheet-head{display:none}

/* ---------- 结果 ---------- */
.result-hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px;text-align:center;
  box-shadow:var(--shadow);margin-bottom:20px}
.result-hero .score{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1px}
.result-hero .score.pass{color:var(--ok)}
.result-hero .score.fail{color:var(--bad)}
.result-hero .verdict-line{margin-top:10px;font-size:15px;font-weight:600}
.result-hero .sub{color:var(--text-3);font-size:13px;margin-top:8px;line-height:1.8}
.result-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chapter-stats{display:flex;flex-direction:column;gap:11px}
.cs-row{font-size:13px}
.cs-row .cs-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;color:var(--text-2)}
.cs-row .cs-top b{color:var(--text);font-weight:600;word-break:break-word}
.cs-row .cs-top span{flex:none}
.cs-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.cs-bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.cs-bar i.mid{background:var(--warn)}
.cs-bar i.bad{background:var(--bad)}
.wrong-list{display:flex;flex-direction:column;gap:9px;max-height:420px;overflow-y:auto}
.wrong-item{border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:var(--r-sm);padding:10px 13px;
  font-size:13px;background:var(--panel-2);cursor:pointer}
@media (hover:hover){.wrong-item:hover{border-color:var(--brand)}}
.wrong-item:active{border-color:var(--brand);background:var(--brand-soft)}
.wrong-item .wi-stem{color:var(--text);line-height:1.6;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrong-item .wi-ans{font-size:12px;color:var(--text-3);line-height:1.6}
.wrong-item .wi-ans b.ok{color:var(--ok)}
.wrong-item .wi-ans b.bad{color:var(--bad)}
.result-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center}

/* ---------- 列表 / 统计 ---------- */
.list-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.list-head h2{font-size:19px}
.list-head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.list-body{display:flex;flex-direction:column;gap:10px}
.list-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;box-shadow:var(--shadow)}
.list-card .lc-stem{font-size:14.5px;line-height:1.7;margin-bottom:9px;word-break:break-word}
.list-card .lc-opts{font-size:13px;color:var(--text-2);display:flex;flex-direction:column;gap:3px;margin-bottom:9px;word-break:break-word}
.list-card .lc-opts .ok{color:var(--ok);font-weight:600}
.list-card .lc-meta{font-size:12px;color:var(--text-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:22px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}
.stat-card b{display:block;font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.3}
.stat-card span{font-size:12.5px;color:var(--text-3);line-height:1.5;display:block}
.danger-zone{margin-top:34px;text-align:center}
.empty{padding:52px 20px;text-align:center;color:var(--text-3);font-size:14px}
.empty .em-icon{font-size:38px;display:block;margin-bottom:12px;opacity:.5}

/* ---------- 其它 ---------- */
.footer{border-top:1px solid var(--line);padding:20px;text-align:center;font-size:12px;color:var(--text-3);line-height:1.8}
.toast{position:fixed;left:50%;bottom:calc(36px + var(--safe-b));transform:translateX(-50%);background:rgba(20,28,45,.94);color:#fff;
  padding:10px 20px;border-radius:10px;font-size:13.5px;z-index:200;box-shadow:var(--shadow-lg);animation:toastIn .2s;
  max-width:calc(100vw - 40px);text-align:center}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}

/* ---------- 底部标签栏 / 抽屉遮罩（默认桌面隐藏） ---------- */
.tabbar{display:none}
.sheet-backdrop{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:80;animation:fade .2s}
.sheet-backdrop[hidden]{display:none}

/* ============================================================
   平板
   ============================================================ */
@media (max-width:1024px){
  .quiz-body{grid-template-columns:1fr}
  .q-side{order:2}
}

/* ============================================================
   手机
   ============================================================ */
@media (max-width:768px){
  /* 顶栏：只留品牌与主题按钮 */
  .topnav .nav-btn[data-nav]{display:none}
  .topbar-inner{padding:9px 14px;gap:8px}
  .brand-mark{width:30px;height:30px;font-size:15px}
  .brand-text small{display:none}
  .brand-text strong{font-size:14.5px}

  #app{padding:14px 14px calc(var(--tabbar-h) + var(--safe-b) + 22px)}

  /* 首页 */
  .hero{padding:22px 18px;border-radius:16px;margin-bottom:22px}
  .hero h1{font-size:20px}
  .hero p{font-size:13px}
  .hero-stats{gap:0;margin-top:18px}
  .hero-stats div{flex:1 1 50%;padding:6px 0;min-width:0}
  .hero-stats b{font-size:20px}
  .hero-stats span{font-size:11.5px}
  .section-title{font-size:15px;margin:20px 0 10px}

  .subject-grid{grid-template-columns:1fr;gap:10px}
  .subject-card{padding:15px 16px}
  .subject-card h3{font-size:15px}
  .subject-card .sc-count{font-size:21px;margin-top:9px}

  .mode-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .mode-card{padding:14px 13px}
  .mode-card b{font-size:13.5px}
  .mode-card span{font-size:11.5px}
  .mode-card .mc-icon{font-size:18px;margin-bottom:6px}

  /* 筛选：可折叠 */
  .filter-toggle{display:flex}
  .filter-head-hint{display:block}
  .filter-head .link-btn{display:none}
  .filter-panel[data-open="false"] .filter-body{display:none}
  .filter-row{flex-direction:column;gap:8px;padding:10px 0}
  .filter-row>label{width:auto;padding-top:0;font-size:12.5px;font-weight:600}
  .chips{gap:6px}
  .chip{padding:6px 11px;font-size:12px}
  select{font-size:16px;padding:10px 12px;width:100%}   /* 16px 可避免 iOS 聚焦时自动放大 */
  .notice{padding:12px 14px;font-size:12px;margin-top:16px}

  /* 答题：隐藏站点顶栏与底栏，操作栏固定到底部 */
  body.in-quiz .topbar{display:none}
  body.in-quiz .tabbar{display:none}
  body.in-quiz .footer{display:none}
  body.in-quiz #app{padding:10px 12px 0}

  .quiz-head{position:sticky;top:0;z-index:30;background:var(--bg);
    padding:6px 0 8px;margin-bottom:8px;gap:8px;flex-wrap:nowrap}
  .quiz-head-left{flex:1;min-width:0}
  .quiz-head-right{flex:none;gap:8px}
  .quiz-mode-tag{font-size:11.5px;padding:3px 9px}
  .quiz-counter{font-size:12.5px}
  .quiz-timer{font-size:12.5px;padding:4px 9px}
  #quitBtn{padding:8px 11px;font-size:12.5px}
  #cardBtn{padding:8px 12px;font-size:12.5px}
  .progress-track{margin-bottom:12px}

  .quiz-body{display:block}
  .q-card{padding:16px 15px 96px;border-radius:14px;min-height:0}
  .q-meta{margin-bottom:11px;gap:6px}
  .tag{font-size:11.5px;padding:2px 7px}
  .q-stem{font-size:16px;line-height:1.8;margin-bottom:15px}
  .opts{gap:9px}
  .opt{padding:12px 13px;gap:10px;border-radius:10px}
  .opt .key{width:24px;height:24px;font-size:12px}
  .opt .txt{font-size:15px;line-height:1.6}
  .explain{padding:13px 14px;font-size:13.5px;line-height:1.78;margin-top:15px}
  .explain .ex-head{font-size:12.5px}

  /* 底部固定操作栏 */
  .q-actions{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;
    padding:9px 12px calc(9px + var(--safe-b));
    padding-left:max(12px,var(--safe-l));padding-right:max(12px,var(--safe-r));
    background:color-mix(in srgb,var(--panel) 96%,transparent);
    backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    border-top:1px solid var(--line);gap:8px;
    box-shadow:0 -3px 16px rgba(20,35,80,.08)}
  .q-actions .spacer{display:none}
  .q-actions .primary-btn{flex:1 1 auto;min-height:46px;font-size:15px;border-radius:11px}
  .q-actions .ghost-btn{flex:1 1 auto;min-height:46px;font-size:14px;border-radius:11px}
  .q-actions #favToggle{flex:0 0 auto;padding:8px 12px;font-size:13px}

  /* 答题卡：底部抽屉 */
  .q-side{position:fixed;left:0;right:0;bottom:0;z-index:90;
    max-height:82dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    background:var(--panel);border-radius:20px 20px 0 0;
    padding:6px 14px calc(20px + var(--safe-b));
    box-shadow:0 -10px 44px rgba(10,16,30,.3);
    transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1),visibility .3s;
    visibility:hidden;margin:0;order:0}
  body.sheet-open .q-side{transform:translateY(0);visibility:visible}
  body.sheet-open{overflow:hidden}
  .sheet-grab{display:block;padding:8px 0 4px;text-align:center}
  .sheet-grab span{display:inline-block;width:38px;height:4px;border-radius:3px;background:var(--line)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}
  .sheet-head strong{font-size:15px}
  .q-side .side-box{border:0;box-shadow:none;padding:0;margin:0 0 18px;background:transparent}
  .q-side .side-box:last-child{margin-bottom:0}
  .q-side .side-box h3{display:none}
  .q-side .side-box:last-child h3{display:block}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;max-height:none}
  .card-cell{font-size:13px;border-radius:9px;min-height:42px}
  .card-legend{font-size:12px;gap:12px;margin-top:14px}
  .side-actions .ghost-btn{min-height:46px;font-size:14.5px}
  .kbd-tip{display:none}

  /* 结果 */
  .result-hero{padding:22px 18px;border-radius:14px}
  .result-hero .score{font-size:44px}
  .result-hero .verdict-line{font-size:14px}
  .result-hero .sub{font-size:12.5px}
  .result-cols{grid-template-columns:1fr;gap:12px}
  .result-actions{gap:8px}
  .result-actions .primary-btn,.result-actions .ghost-btn{flex:1 1 calc(50% - 4px);min-height:46px}
  .wrong-list{max-height:none}
  .wrong-item{padding:12px 13px}

  /* 错题本 / 收藏 */
  .list-head{flex-direction:column;align-items:stretch;gap:10px}
  .list-head h2{font-size:17px}
  .list-head-actions{gap:8px}
  .list-head-actions select{flex:1 1 100%}
  .list-head-actions .primary-btn{flex:1}
  .list-card{padding:14px}

  /* 统计 */
  .stat-cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}
  .stat-card b{font-size:22px}

  /* 底部标签栏 */
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:color-mix(in srgb,var(--bg-soft) 94%,transparent);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);
    padding:6px 4px calc(6px + var(--safe-b));
    padding-left:max(4px,var(--safe-l));padding-right:max(4px,var(--safe-r))}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:5px 2px;border-radius:10px;color:var(--text-3);font-size:10.5px;position:relative;
    min-height:46px;transition:.15s}
  .tab-btn .tab-ico{font-size:17px;line-height:1;filter:grayscale(1) opacity(.65);transition:.15s}
  .tab-btn:active{background:var(--panel-2)}
  .tab-btn.active{color:var(--brand);font-weight:600}
  .tab-btn.active .tab-ico{filter:none}
  .tab-pill{position:absolute;top:1px;right:calc(50% - 24px);background:var(--bad);color:#fff;font-style:normal;
    font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:9px;padding:0 4px}
  .tab-pill[data-empty="1"]{display:none}

  .footer{padding:16px 14px calc(var(--tabbar-h) + var(--safe-b) + 16px);font-size:11.5px}
}

/* 小屏手机 */
@media (max-width:380px){
  .mode-grid{grid-template-columns:1fr}
  .q-actions #favToggle{font-size:12.5px;padding:8px 9px}
  .stat-cards{grid-template-columns:1fr}
}

/* 横屏手机：压缩纵向留白 */
@media (max-width:900px) and (orientation:landscape) and (max-height:520px){
  .hero{padding:16px}
  .hero-stats{margin-top:12px}
  .q-card{padding:14px 15px 92px}
  .card-cell{min-height:36px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  html{scroll-behavior:auto}
}

</style>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" data-nav="home">
      <span class="brand-mark">基</span>
      <span class="brand-text">
        <strong>基金从业 · 在线刷题</strong>
        <small id="brandSub">历年真题 · 三科合集</small>
      </span>
    </a>
    <nav class="topnav">
      <button class="nav-btn" data-nav="home">首页</button>
      <button class="nav-btn" data-nav="wrong">错题本<span class="pill" data-badge="wrong">0</span></button>
      <button class="nav-btn" data-nav="fav">收藏<span class="pill" data-badge="fav">0</span></button>
      <button class="nav-btn" data-nav="stats">统计</button>
      <button class="nav-btn icon" id="themeBtn" title="切换深色 / 浅色" aria-label="切换深色或浅色主题">◐</button>
    </nav>
  </div>
</header>

<main id="app">

  <!-- ============ 首页 ============ -->
  <section class="view" id="view-home">
    <div class="hero">
      <h1>基金从业资格考试题库</h1>
      <p id="heroDesc">从公开网络整理的最新考生回忆版真题，覆盖科目一、科目二、科目三。</p>
      <div class="hero-stats" id="heroStats"></div>
    </div>

    <h2 class="section-title">选择科目</h2>
    <div class="subject-grid" id="subjectGrid"></div>

    <h2 class="section-title">选择模式</h2>
    <div class="mode-grid" id="modeGrid"></div>

    <div class="filter-panel" id="filterPanel" data-open="true">
      <button class="filter-toggle" id="filterToggle" aria-expanded="true">
        <strong>筛选范围</strong>
        <span class="ft-state" id="filterState"></span>
        <span class="ft-arrow">▾</span>
      </button>
      <div class="filter-body" id="filterBody">
        <div class="filter-head">
          <span class="filter-head-hint">按场次与考点缩小范围</span>
          <button class="link-btn" id="resetFilter">重置为全部</button>
        </div>
        <div class="filter-row">
          <label>考试场次</label>
          <div class="chips" id="sessionChips"></div>
        </div>
        <div class="filter-row">
          <label>考点章节</label>
          <select id="chapterSelect"><option value="">全部考点</option></select>
        </div>
        <div class="filter-tip" id="filterTip"></div>
      </div>
    </div>

    <div class="notice" id="sourceNotice"></div>
  </section>

  <!-- ============ 答题 ============ -->
  <section class="view" id="view-quiz">
    <div class="quiz-head">
      <div class="quiz-head-left">
        <button class="ghost-btn" id="quitBtn">← 退出</button>
        <span class="quiz-mode-tag" id="quizModeTag"></span>
      </div>
      <div class="quiz-head-right">
        <span class="quiz-counter" id="quizCounter"></span>
        <span class="quiz-timer" id="quizTimer" hidden></span>
        <button class="ghost-btn" id="cardBtn">答题卡</button>
      </div>
    </div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>

    <div class="quiz-body" id="quizBody">
      <article class="q-card" id="qCard"></article>

      <aside class="q-side" id="qSide">
        <div class="sheet-grab" id="sheetGrab"><span></span></div>
        <div class="sheet-head">
          <strong>答题卡</strong>
          <button class="ghost-btn" id="sheetClose">收起</button>
        </div>
        <div class="side-box">
          <h3>答题卡</h3>
          <div class="card-grid" id="cardGrid"></div>

:"未公开信息泄露禁止","disputed":true,"source":{"title":"2026年7月基金从业《基金法律法规》考试真题及答案已更新-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/16153916351484.html"}},{"id":"k1-0003","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年7月","type":"single","stem":"下列选项中，不属于私募资产管理计划可以投资的标准化资产的是()。","options":[{"key":"A","text":"中期票据"},{"key":"B","text":"银行定期存款"},{"key":"C","text":"存托凭证"},{"key":"D","text":"未上市公司股权"}],"answer":"D","explain":"标准化资产一般指在银行间或交易所市场发行交易、具有公开定价的债权类和权益类品种，中期票据、存托凭证以及银行定期存款均可归入此类。未上市企业股权缺乏公开交易和定价机制，属于典型的非标准化资产。","chapter":"私募资管计划投资范围","disputed":false,"source":{"title":"2026年7月基金从业《基金法律法规》考试真题及答案已更新-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/16153916351484.html"}},{"id":"k1-0004","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年7月","type":"single","stem":"基金监管的首要目标是()。","options":[{"key":"A","text":"规范基金活动"},{"key":"B","text":"促进基金行业健康发展"},{"key":"C","text":"依法保护基金投资人的合法权益"},{"key":"D","text":"防范系统性风险"}],"answer":"C","explain":"基金监管把依法保护基金投资人的合法权益摆在首要位置，规范基金活动、促进行业健康发展和防范系统性风险都是围绕这一核心展开的目标。","chapter":"基金监管目标","disputed":false,"source":{"title":"2026年7月基金从业《基金法律法规》考试真题及答案已更新-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/16153916351484.html"}},{"id":"k1-0005","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年7月","type":"single","stem":"下列不属于基金合同当事人的是()。","options":[{"key":"A","text":"基金托管人"},{"key":"B","text":"基金销售机构"},{"key":"C","text":"基金份额持有人"},{"key":"D","text":"基金管理人"}],"answer":"B","explain":"基金合同的当事人只有基金管理人、基金托管人和基金份额持有人三方。基金销售机构只是受托提供销售服务的机构，不是基金合同的签约主体。","chapter":"基金合同当事人","disputed":false,"source":{"title":"2026年7月基金从业《基金法律法规》考试真题及答案已更新-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/16153916351484.html"}},{"id":"k1-0006","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】关于基金公司的廉洁从业报告责任，以下情形中，基金公司无需向监管部门报告的是（）。","options":[{"key":"A","text":"从业人员D为某基金公司交易员，对于各基金经理下达的投资指令，不考虑其组合规模大小，均统一执行公平交易制度"},{"key":"B","text":"从业人员B为某基金公司研究员，在对证券公司评价过程中，对其所在机构存在关联关系的证券公司给予适当的倾斜"},{"key":"C","text":"从业人员C为某基金公司注册登记人员，在某基金已发布限制大额申购公告的情况下，根据领导授意、对某客户的大额申购给予特殊办理"},{"key":"D","text":"从业人员A为某公司销售人员，在向客户充分告知风险并获得客户同意的前提下，向其介绍其他公司的私密资管计划"}],"answer":"A","explain":"廉洁从业报告针对的是从业人员的违规或不当行为，A中交易员对所有投资指令统一执行公平交易制度本身就是合规做法，无需报告。对关联方不当倾斜、违规办理受限申购、泄露他人资管计划信息都会损害廉洁从业要求，应当报告。","chapter":"廉洁从业报告义务","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：基金公司的廉洁从业报告责任-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202606/14102205166593.html"}},{"id":"k1-0007","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】关于基金经营机构廉洁从业内控制度建设及廉洁从业管理，以下表述错误的是()。","options":[{"key":"A","text":"基金经营机构应当聘请外部审计机构对本机构及其工作人员的廉洁情况进行监督，每年开展1次廉洁从业检查"},{"key":"B","text":"基金经营机构应当建立健全财务管理制度，强化财经纪律，杜绝账外账、虚假列支或者变相发放费用等不规范行为"},{"key":"C","text":"基金经营机构应当定期开展廉洁从业培训和教育，确保全体工作人员熟悉廉洁从业的相关规定，提高工作人员廉洁意识"},{"key":"D","text":"基金经营机构应当制定合理完善的机构营销制度，明确可纳入营销费用的具体事项、内容、标准、额度等"}],"answer":"A","explain":"廉洁从业检查是机构自身应当常态化开展的内部工作，法规并未要求必须聘请外部审计机构对全员廉洁情况进行监督，A的表述超出了规定要求。B、C、D关于财务纪律、廉洁培训、营销费用管理的要求都属制度应有内容。","chapter":"廉洁从业内控管理","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：廉洁从业管理-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/02175108788989.html"}},{"id":"k1-0008","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】对于公募基金管理人，以下关于私募资产管理计划从事关联交易的表述，正确的是（）。","options":[{"key":"A","text":"私募资产管理计划投资的同一发行人及其关联方发行的债券未超过其净资产50%的、其资产管理机会的资产占净资产的与资产管理计划关联方的资产占净资产的比例最高可不受限制"},{"key":"B","text":"私募资产管理计划在事前取得投资者同意后可以从事所有关联交易"},{"key":"C","text":"私募资产管理计划从事重大关联交易需要事前取得托管人的同意"},{"key":"D","text":"私募资产管理计划包括一般关联交易和重大关联交易，其中，只有开展重大关联交易，才需要事后及时告知投资者"}],"answer":"C","explain":"资管计划从事重大关联交易须履行更严格的程序，事前取得托管人同意并及时向投资者披露，C的表述正确。B称取得投资者同意即可从事所有关联交易过于绝对；D不当缩小了应告知投资者的范围。","chapter":"私募资管关联交易","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：关联交易-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202606/13102018644542.html"}},{"id":"k1-0009","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】以下关于中国特色金融文化“五要五不”内涵的表述中，错误的是（）。","options":[{"key":"A","text":"“要守正创新，不脱实向虚”允许金融行业机构通过金融创新，突破监管规定"},{"key":"B","text":"“要诚实守信，不逾越底线”强调金融行业要严守契约精神，对严重失信者实施终身禁业等惩戒措施"},{"key":"C","text":"“要稳健审慎，不急功近利”主张金融行业应平衡短期利益与长期发展，避免因追求短期暴利而过度冒险"},{"key":"D","text":"“要以义取利，不唯利是图”要求金融行业将社会功能发挥置于盈利性之上，实现经济、社会、环境共生共荣"}],"answer":"A","explain":"「要守正创新，不脱实向虚」要求金融创新在依法合规前提下服务实体经济，绝不意味着可以突破监管规定，A属于对内涵的曲解。其余各项对契约精神、稳健审慎、以义取利的理解符合「五要五不」。","chapter":"中国特色金融文化","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：中国特色金融文化“五要五不”-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/03175323560541.html"}},{"id":"k1-0010","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】以下关于私募股权投资基金的说法中，表述错误的是（）。","options":[{"key":"A","text":"私募股权投资基金中的并购基金，通常是寻找价值被低估的企业，改善其经营情况、提升其价值、最终获得投资收益"},{"key":"B","text":"私募股权投资基金一般投向中小微企业未上市股权，通常不涉及公众利益"},{"key":"C","text":"私募股权投资基金普遍聚焦于企业发展的特定阶段，而不涉及企业不同生命周期阶段资金需求"},{"key":"D","text":"私募股权投资基金的流动性较差，但能够深度介入被投企业的运营"}],"answer":"C","explain":"私募股权基金可以覆盖初创、成长、成熟等不同生命周期阶段企业的资金需求，C把两者对立起来的说法错误。并购基金通过改善被投企业价值获利、主要投向非上市股权且不涉公众利益、流动性差但介入运营较深，均成立。","chapter":"私募股权基金特点","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：私募股权投资基金-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202606/12101813436747.html"}},{"id":"k1-0011","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】下列关于私募股权投资基金投资限制的说法，错误的是（）","options":[{"key":"A","text":"投资区域性股权市场可转股的，投资金额应当不超过基金实缴金额的50%"},{"key":"B","text":"投资资产支持证券的，限于不动产持有型资产支持证券"},{"key":"C","text":"投资上市公司股票的，应当通过定向增发、大宗交易和协议转让等方式，不得参与公开发行或者公开交易"},{"key":"D","text":"投资首发企业股票，存在优先股的，应当通过战略配售、基石投资等方式，不得参与网下申购和网上申购"}],"answer":"A","explain":"私募股权基金投资区域性股权市场可转债的规模上限远低于基金实缴金额的50%（通常按20%把握），A的比例不符合投资限制。B、C、D关于资产支持证券、上市公司股票、首发企业股票的投资方式限制均属规定内容。","chapter":"私募股权基金投资限制","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：私募股权投资基金投资限制-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/14175404726703.html"}},{"id":"k1-0012","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】为确保会计核算系统的正常运转，基金管理人应当采取适当的会计控制措施，以下措施不合规的是（）。","options":[{"key":"A","text":"建立财务的授权和岗位管理体系，设置会计账簿，控制会计记账程序"},{"key":"B","text":"建立凭证制度，通过凭证设计、登录、传递、归档等流程，确保记载正确"},{"key":"C","text":"建立复核制度，合规部门妥善保管重要、业务用章、支票等重要凭证和会计档案"},{"key":"D","text":"建立账务组织和账务处理体系，正确设置会计账簿，事中和事后监督"}],"answer":"C","explain":"重要凭证、业务用章、支票及会计档案应由专门部门或专人保管，并与复核、合规职责相互分离，把它们交由合规部门保管且并入复核制度的做法不合规。A、B、D的授权岗责、凭证管理、账务处理体系均属正常的会计控制措施。","chapter":"会计系统控制","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：会计控制措施-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202606/24162230479479.html"}},{"id":"k1-0013","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】中国证监会收到对某私募基金管理公司的举报，显公司的员工甲某可能存在操纵市场、内幕交易的嫌疑。对此，中国证监会有权采取的措施是()。Ⅰ.进公司调查取证Ⅱ.询公司相关负责人及甲某，要求其对与被调查事件有关的事项作出说明Ⅲ.可不经批准在法定期限内限制甲某的证券买卖Ⅳ.对可能被转移、隐匿或者销毁的文件和资料予以封存","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅱ"},{"key":"C","text":"Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅳ"}],"answer":"B","explain":"证监会在调查中有权进场调查取证、询问当事人；限制证券买卖和对文件资料封存属于强制性措施，须依法定程序并经批准才能实施，不能随意采取，故含Ⅲ、Ⅳ的选项不正确。","chapter":"证监会监管措施","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：中国证监会采取的措施-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/24181252154077.html"}},{"id":"k1-0014","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】关于公募基金管理人的内部治理与风险防范，以下表述错误的是（）。","options":[{"key":"A","text":"基金管理人应建立与股东之间的关键信息隔离制度"},{"key":"B","text":"基金管理人的董事会和董事长不得越权干预经营层的具体经营活动，因此总经理不得为董事会成员"},{"key":"C","text":"基金管理人的股东、实际控制人应当通过股东会依法行使权利"},{"key":"D","text":"当基金管理人与基金份额持有人利益发生冲突时，应以基金份额持有人利益优先"}],"answer":"B","explain":"总经理担任董事会成员并不被禁止，B的说法错误。建立与股东之间的关键信息隔离制度、股东通过股东会依法行使权利、管理人与持有人利益冲突时以持有人利益优先，都是公司治理的应有要求。","chapter":"基金管理人公司治理","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：内部治理与风险防范-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/17175815242347.html"}},{"id":"k1-0015","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】下列事件中，不属于操作风险的是()。","options":[{"key":"A","text":"某投资经理未执行投资限额制度而导致买入股票持仓超标，突破了资产管理计划合同比例限额"},{"key":"B","text":"债券型基金持有的某公司发行的债券由于该公司违反环保规定受到处罚导致债券价格下跌"},{"key":"C","text":"某基金公司投资管理关键岗位员工突然离职导致原投资目标难以正常实现"},{"key":"D","text":"某基金公司的估值系统出现了故障导致估值工作无法正常进行"}],"answer":"B","explain":"债券因发行人受环保处罚而价格下跌，源自发行人信用状况恶化，属于信用（市场）风险，而非内部流程或系统失灵造成的操作风险。持仓突破比例限额、关键投资人员突然离职、估值系统故障都属于操作风险。","chapter":"操作风险识别","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：操作风险-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/15175523523608.html"}},{"id":"k1-0016","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】公募基金管理人由公募基金管理公司或者经中国证监会核准取得公募基金管理业务资格的其他资产管理机构担任，前述其他资产管理机构包括（）。Ⅰ商业银行理财子公司Ⅱ在中国证券投资基金业协会登记的专门从事私募股权管理业务的机构Ⅲ保险资产管理公司Ⅳ证券公司资产管理子公司","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅲ、Ⅳ"}],"answer":"D","explain":"商业银行理财子公司、保险资产管理公司、证券公司资产管理子公司经核准均可开展公募基金管理业务。仅在基金业协会登记的私募股权管理机构不在可以申请公募资格的主体范围内。","chapter":"公募基金管理人资格","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：其他资产管理机构-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/23180957380901.html"}},{"id":"k1-0017","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】根据《私募投资基金管理人内部控制指引》，私募基金管理人应当建立完善的财产分离制度，包括（）要实行独立运作、分别核算。Ⅰ不同基金财产之间Ⅱ基金管理人固有财产和托管人固有财产之间Ⅲ基金财产和托管人固有财产之间Ⅳ基金财产和基金管理人固有财产之间","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"B","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅳ"}],"answer":"B","explain":"财产分离要求不同基金财产之间、基金财产与管理人固有财产之间、基金财产与托管人固有财产之间独立运作、分别核算。管理人固有财产与托管人固有财产之间并不需要相互分离，故Ⅱ不选。","chapter":"基金财产分离制度","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：私募基金管理人财产分离制度-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/06175520519071.html"}},{"id":"k1-0018","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】金融市场按照交割期限可以划为现货市场、期货和衍生品市场，关于上述三种市场，以下表述错误的是（）。","options":[{"key":"A","text":"现货市场的买卖双方达到交易后必须立即进行交割"},{"key":"B","text":"期货和衍生品交易的协议成立和标的交割是分离的"},{"key":"C","text":"期货和衍生品交易的交割要按协议成立时的协议价格进行"},{"key":"D","text":"对现货市场的交易双方来说，利率和汇率风险都很小"}],"answer":"A","explain":"现货市场成交后按约定安排交割，并非必须立即交割，A的绝对化表述错误。期货及衍生品市场协议成立与标的交割相分离、按约定价格交割，现货交易面临的利率汇率风险相对较小，这些说法均正确。","chapter":"金融市场分类","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：金融市场的分类-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202606/19160844500428.html"}},{"id":"k1-0019","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】基金销售人员在向投资者介绍产品时，下列行为符合诚实守信原则的是（）。","options":[{"key":"A","text":"隐瞒产品申购赎回费用、管理费率等成本信息"},{"key":"B","text":"根据投资者风险承受能力推荐匹配的产品，并如实说明产品风险"},{"key":"C","text":"强调产品过往业绩优秀，但未说明过往业绩不代表未来收益表现"},{"key":"D","text":"为帮助投资者快速决断，将复杂高风险产品描述为普通稳健型产品"}],"answer":"B","explain":"诚实守信要求如实揭示风险并按投资者风险承受能力推荐相匹配的产品，B符合要求。隐瞒费用信息、只强调历史业绩却不提示过往业绩不代表未来、把复杂高风险产品说成稳健型，分别构成隐瞒、遗漏和误导。","chapter":"诚实守信销售原则","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：诚实守信原则-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202606/10101451612780.html"}},{"id":"k1-0020","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】关于申请注册基金从业资格的必备条件，以下表述错误的是（）。","options":[{"key":"A","text":"最近3年未被中国证监会撤销基金从业资格或者被中国证券投资基金业协会取消基金从业资格"},{"key":"B","text":"通过基金从业资格考试，或者符合中国证券投资基金业协会规定的其他条件"},{"key":"C","text":"最近3年未因犯罪被判处刑罚"},{"key":"D","text":"品行良好，具有良好的职业道德"}],"answer":"A","explain":"申请注册基金从业资格要求的是最近5年内未被撤销或被取消基金从业资格，A把期限写成3年，表述错误。通过考试或符合协会规定的其他条件、最近3年未因犯罪被判刑、品行良好均为必备条件。","chapter":"基金从业资格注册","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：申请注册基金从业资格条件-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/16175700677784.html"}},{"id":"k1-0021","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】关于现代金融体系，以下说法正确的是（）","options":[{"key":"A","text":"现代金融体系中的成熟金融市场不需要金融监管"},{"key":"B","text":"现代金融体系包括金融机构、商品市场、金融监管、金融产品等"},{"key":"C","text":"现代金融体系通过金融机构和运用各种金融工具，实现货币资金的有效配置"},{"key":"D","text":"现代金融体系的两大运作载体是金融市场和金融基础设施"}],"answer":"C","explain":"现代金融体系借助各类金融机构和金融工具实现货币资金的有效配置，C正确。成熟市场同样需要金融监管，其构成中包含金融市场而非商品市场，运作载体通常概括为金融市场和金融机构。","chapter":"现代金融体系构成","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：现代金融体系-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/07175710369338.html"}},{"id":"k1-0022","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】某证券期货经营机构集合资产管理计划产品风险等级为R4，现投资者风险等级为C3，该机构以下做法中正确的是（）","options":[{"key":"A","text":"可以让该投资者重新测评风险等级到C4"},{"key":"B","text":"需要做特别警示并取得该投资者书面确认"},{"key":"C","text":"不可以让该投资者购买"},{"key":"D","text":"可直接向该投资者销售，因风险等级接近"}],"answer":"B","explain":"产品风险等级高于投资者承受能力时机构不得主动推介，投资者主动要求购买的，应作特别警示并取得书面确认，B正确。引导投资者重新测评以提高等级、或认为等级接近就直接销售，都不符合适当性要求。","chapter":"投资者适当性匹配","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：普通投资者-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/08175925848834.html"}},{"id":"k1-0023","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】关于基金托管人职责终止的相关内容，以下表述错误的是（）。","options":[{"key":"A","text":"及时办理基金财产和基金托管业务的移交手"},{"key":"B","text":"新基金托管人产生前，由中国证监会指定临时基金托管"},{"key":"C","text":"应当按照规定聘请会计师事务所对基金财产进行审"},{"key":"D","text":"基金管理人应当在6个月内聘任新基金托管人"}],"answer":"D","explain":"托管人职责终止后须办理财产和业务移交、聘请会计师事务所审计并公告，新托管人产生前由证监会指定临时托管人，选任新托管人的主体和期限均有法定安排，D关于聘任主体与期限的表述与规定不符。A、B、C符合职责终止后的处理流程。","chapter":"基金托管人职责终止","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：基金托管人职责-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202607/18175933867199.html"}},{"id":"k1-0024","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】某基金的一家机构持有人原为普通投资者，如果申请转化为专业投资者，需满足下列哪个必要条件？（）","options":[{"key":"A","text":"最近一年末总资产不低于1000万元"},{"key":"B","text":"最近一年末净资产不低于2000万元"},{"key":"C","text":"最近一年末净资产不低于500万元"},{"key":"D","text":"最近一年末金融资产不低于100万元"}],"answer":"A","explain":"普通投资者中的机构申请转为专业投资者，需资产规模达到最近一年末1000万元的门槛并具备相应投资经历，A符合要求。净资产2000万元是专业投资者的认定标准之一，500万元净资产和100万元金融资产均不是该转换条件的正确表述。","chapter":"普通投资者转专业","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：普通投资者转化为专业投资者-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202606/21161156859867.html"}},{"id":"k1-0025","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】关于我国公募基金的作用，以下说法错误的是（）。","options":[{"key":"A","text":"公募基金是广大投资者拓宽非上市企业股权投资策略的重要工具"},{"key":"B","text":"公募基金是资本市场稳定发展的压舱石"},{"key":"C","text":"公募基金是资本市场对外开放和全球化、国际化的执行者"},{"key":"D","text":"公募基金是金融服务于实体经济的推进器"}],"answer":"A","explain":"公募基金主要投资于公开市场的标准化品种，开展非上市企业股权投资并非其功能，A的说法错误。作为资本市场压舱石、对外开放的执行者、服务实体经济的推进器，都是关于公募基金作用的常见表述。","chapter":"公募基金的作用","disputed":false,"source":{"title":"2026年5月基金从业《法律法规》真题考点：公募基金的作用-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202606/23161935909193.html"}},{"id":"k1-0026","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2026年5月","type":"single","stem":"【考试原题】关于公募基金合同终止的特定情形，表述错误的是（）。","options":[{"key":"A","text":"基金合同期限届满而未延期"},{"key":"B","text":"基金管理人与基金托管人一致决定终止"},{"key":"C","text":"基金管理人、基金托管人职责终止，在6个月内没有新基金管理人、基金托管人承接"},{"key":"D","text":"基金份额持有人大会决定终止"}]," ","options":[{"key":"A","text":"该券商承销某证券过程中，该基金经理考虑到同学关系，则在符合基金合同约定的投资范围和比例内较多地投资了该证券"},{"key":"B","text":"该券商研究所具有一定市场影响力，该基金经理向公司推荐了该券商，经基金公司内部评估后在该券商开立交易席位,并分配交易佣金"},{"key":"C","text":"该券商同时为该基金公司代销机构，该券商经内部流程评估后将该基金经理管理的基金列入重点销售基金"},{"key":"D","text":"该券商在销售该基金经理管理的基金的过程中，举办了销售人员培训会议，邀请该基金经理参加，并分析市场情况和该基金投资机会"}],"answer":"A","explain":"基金经理仅因同学关系就在合规范围内加大对某券商承销证券的投资，属于以私人关系影响投资决策、损害持有人利益，违反客户至上原则。推荐券商经内部评估、代销机构内部决策重点销售、受邀参加销售人员培训，均不构成违规。","chapter":"客户至上原则","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：客户至上原则-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202512/03114108612518.html"}},{"id":"k1-0043","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】某商业银行在经济下行期，为降低不良贷款率，大幅缩减对小微企业的货款审批额度，却将更多信贷资源投向高收益的房地产短期融资项目，结合金融双重属性逻辑，该银行存在的问题是（）。","options":[{"key":"A","text":"正确发挥了商业属性，且通过高收益项目反哺实体经济，符合双重属性要求"},{"key":"B","text":"片面追求商业属性(盈利性)，弱化服务小微企业的功能属性，违背盈利服从功能的原则"},{"key":"C","text":"平衡了功能属性与商业属性，但未考虑经济下行时的特殊市场环境"},{"key":"D","text":"过度侧重功能属性，忽视服务实体经济需求，导致商业属性难以发挥"}],"answer":"B","explain":"银行只顾及盈利性而大幅缩减小微企业信贷，弱化了金融服务实体经济的功能属性，违背盈利服从功能的原则。金融的双重属性要求功能性与商业性统一，不能牺牲功能去追求短期收益。","chapter":"金融双重属性","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：金融的双重属性-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202511/30113128168939.html"}},{"id":"k1-0044","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】王先生计划投资私募基金，其全部资产包括价值300万元的写字楼、公募基金30万元、银行存款50万元、信托计划200万元。下列表述正确的包括（）。Ⅰ.王先生资产超过500万元，可以认定为合格投资人Ⅱ.若王先生为私募基金从业人员，可以投资任何私募基金Ⅲ.若王先生为私募基金从业人员，可以投资其所任职的私募基金公司担任管理人的私募基金Ⅳ.王先生金融资产280万元，不能认定为私募基金的合格投资人","options":[{"key":"A","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"C","text":"Ⅰ、Ⅱ"},{"key":"D","text":"Ⅲ、Ⅳ"}],"answer":"D","explain":"王先生的金融资产为公募基金30万元、银行存款50万元、信托计划200万元，合计280万元，未达到300万元门槛，不能认定为合格投资者；从业人员不得投资任何私募基金，但可以投资其任职机构管理的私募基金，故Ⅲ、Ⅳ正确。","chapter":"私募合格投资者","disputed":false,"source":{"title":"2025年11月基金 。投资决策交易执行、营销团队管理、激励约束机制均不属于其职责，故Ⅰ、Ⅲ正确。","chapter":"合规负责人职责","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：公募基金管理人合规负责人职责-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202511/28112726643695.html"}},{"id":"k1-0048","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】基金经理王某在渠道交流中透露投资计划以促进其产品销售，私募基金销售人员李某得知该信息后，提前购买了王某拟投资的股票。王某的行为主要违反了《私募投资基金监管暂行办法》规定不得有行为中的(）。","options":[{"key":"A","text":"从事内幕交易"},{"key":"B","text":"泄露因职务便利获取的未公开信息"},{"key":"C","text":"玩忽职守，不按照规走履行职责"},{"key":"D","text":"利用职务之便，为本人或投资者以外的人牟取利益，进行利益输送"}],"answer":"B","explain":"王某在渠道交流中把因职务获知的投资计划透露给他人，属于泄露因职务便利获取的未公开信息，李某借此提前买入正说明该信息已被不当利用，其行为性质不是直接的利益输送。","chapter":"未公开信息泄露禁止","disputed":true,"source":{"title":"2025年11月基金从业《法律法规》真题考点：私募基金从业人员行为规定-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202512/09163754798172.html"}},{"id":"k1-0049","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】风险管理是基金公司经营管理的重要组成部分，下列表述符合风险管理全面性原则要求的是()Ⅰ、根据内部和外部环境的变化及时对风险进行评估Ⅱ、风险管理必须基金管理人的所有部门和岗位Ⅲ、风险管理必须覆盖涵盖所有风险类型Ⅳ、风险管理贯穿于所有业务流程和业务环节","options":[{"key":"A","text":"Ⅱ、Ⅲ"},{"key":"B","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅲ"}],"answer":"B","explain":"风险管理的全面性要求覆盖所有部门岗位、所有风险类型以及所有业务流程和环节。根据内外部环境变化及时评估风险属于适时性或动态性要求，故Ⅰ不选。","chapter":"风险管理全面性原则","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：全面性原则-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202601/10141538632910.html"}},{"id":"k1-0050","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】根据私募基金财产独立运作、独立核算的要求，以下做法错误的是（）","options":[{"key":"A","text":"私募基金管理人管理的多只私募基金委托同一托管人进行托管"},{"key":"B","text":"私募基金管理人管理的多只私募基金投资于同一证券"},{"key":"C","text":"私募基金管理人自有资金认购其管理的私募基金份额"},{"key":"D","text":"私募基金管理人自有资金借用其管理的私募基金证券账户进行投资"}],"answer":"D","explain":"管理人自有资金借用所管理基金的证券账户投资，会混淆固有财产与基金财产，违反财产独立运作、独立核算的要求。 tName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】A公司在B公司控股占比20%，但不是第一大股东，那么A是（）。","options":[{"key":"A","text":"实际控股人"},{"key":"B","text":"比例超过5%但是低于20%的主要股东"},{"key":"C","text":"比例超过5%但是低于20%的非主要股东"},{"key":"D","text":"比例低于5%的非主要股东"}],"answer":"C","explain":"未达到主要股东标准但持股超过5%的股东属于非主要股东，A持股20%且不是第一大股东即属此类，须履行相应报告和信息披露义务。","chapter":"基金管理公司股东分类","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：公募基金管理公司股东类型-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202601/0516391657379.html"}},{"id":"k1-0058","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】从基金管理人的角度看，基金运作管理活动包括（）。","options":[{"key":"A","text":"市场营销、投资管理、后台管理"},{"key":"B","text":"市场营销、投资管理、信息披露"},{"key":"C","text":"投资管理、后台管理、信息披露"},{"key":"D","text":"市场营销、后台管理、信息披露"}],"answer":"A","explain":"从基金管理人角度看，基金运作管理活动由市场营销、投资管理和后台管理三部分组成。信息披露属于后台管理中的工作内容，不与三者并列。","chapter":"基金运作管理活动","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：基金运作管理活动-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202601/03163548732927.html"}},{"id":"k1-0059","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】关于资产管理活动应当遵循的基本原则，以下表述错误的是()。","options":[{"key":"A","text":"活动要求风险和收益相匹配"},{"key":"B","text":"管理人必须坚持“卖者尽责\""},{"key":"C","text":"投资者应当做到\"买者自负”"},{"key":"D","text":"产品承担保证责任"}],"answer":"D","explain":"资产管理活动不得承诺保本保收益，产品和销售机构都不承担保证责任，D错误。风险与收益相匹配、卖者尽责、买者自负都是资产管理应当遵循的基本原则。","chapter":"资产管理基本原则","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：资产管理活动原则-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202512/18113836110686.html"}},{"id":"k1-0060","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】关于私募资产管理计划的风险管理，以下属于私募资产管理计划特殊风险的是(）","options":[{"key":"A","text":"本金损失风险"},{"key":"B","text":"流动性风险"},{"key":"C","text":"税收风险"},{"key":"D", 114630920716.html"}},{"id":"k1-0064","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】证券期货经营机构以资产管理计划资产从事关联交易，需事先（）。","options":[{"key":"A","text":"向托管人报告"},{"key":"B","text":"取得投资者同意"},{"key":"C","text":"向中国证监会派出机构报告"},{"key":"D","text":"向证券期货业协会备案"}],"answer":"B","explain":"证券期货经营机构以资产管理计划资产从事关联交易，应当事先取得投资者同意，并遵守合同约定。仅向托管人报告、向派出机构报告或事后备案，都不满足事先同意的要求。","chapter":"资产管理计划关联交易","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：证券期货经营机构关联交易-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202512/30162344841029.html"}},{"id":"k1-0065","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】货币市场包括（）。Ⅰ、同业拆借市场Ⅱ、回购市场Ⅲ、票据市场Ⅳ、大面额可转让存单市场","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅳ"},{"key":"C","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"}],"answer":"D","explain":"货币市场主要由同业拆借市场、回购市场、票据市场和大面额可转让存单市场等构成，四个选项均属其组成部分。","chapter":"货币市场构成","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：货币市场-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202601/09141430688652.html"}},{"id":"k1-0066","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】我国公募基金管理公司的注册资本应不低于()，且必须为实缴货币资本。","options":[{"key":"A","text":"5000万元人民币"},{"key":"B","text":"1亿元人民币"},{"key":"C","text":"3亿元人民币"},{"key":"D","text":"5亿元人民币"}],"answer":"B","explain":"设立公募基金管理公司，注册资本不得低于1亿元人民币，并且必须为实缴货币资本，以保证其具备承担相应责任的能力。","chapter":"公募基金管理人注册资本","disputed":false,"source":{"title":"2025年11月基金从业《法律法规》真题考点：公募基金管理公司的注册资本-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202601/11141702797484.html"}},{"id":"k1-0067","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2025年11月","type":"single","stem":"【考试原题】基金管理公司（）负责确定公司风险管理总体目标，制定公司风险管理战略和风险应对策略。","options":[{"key":"A","text":"监事会"},{"key":"B","text":"股东大会"},{"key":"C","text":"董事会"},{"key":"D","text ","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"关于货币市场基金的宣传推介，以下做法正确的是()。I.保证投资人本金安全II.照同期银行存款利率保证投资人最低收益III.投资人本金可能受损IV.取市场真实数据比较基金与定期存款收益率","options":[{"key":"A","text":"I、II"},{"key":"B","text":"III"},{"key":"C","text":"III、IV"},{"key":"D","text":"I、III、IV"}],"answer":"B","explain":"货币市场基金不得保证本金安全，也不得承诺最低收益，宣传中应提示投资人本金可能受损；用真实数据与定期存款收益率作比较同样为宣传推介所禁止，故只有Ⅲ正确。","chapter":"货币基金宣传推介","disputed":false,"source":{"title":"2024年5月基金从业法律法规真题及答案21-30题-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/12122725402169.html"}},{"id":"k1-0116","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"A基金持有的一只债券的发行人违约，基金管理人在该基金年度报告中披露其代表基金起诉并获得赔偿，但事实上法院尚未就该案做出判决。基金管理人上述行为涉嫌()等信息披露违法行为。","options":[{"key":"A","text":"承诺效应"},{"key":"B","text":"虚假记载"},{"key":"C","text":"重大遗漏"},{"key":"D","text":"误导性陈述"}],"answer":"B","explain":"把法院尚未判决的诉讼在年度报告中披露为已获赔偿，属于对客观事实的不实记载，构成虚假记载。重大遗漏是不披露应披露事项，误导性陈述是用模糊表述使人产生错误理解。","chapter":"信息披露虚假记载","disputed":false,"source":{"title":"2024年5月基金从业法律法规真题及答案1-10题-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/12121735397584.html"}},{"id":"k1-0117","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"关于货币市场基金的宣传推介，以下做法正确的是（）。Ⅰ．保证投资人本金安全Ⅱ．按照同期银行存款利率保证投资人最低收益Ⅲ．投资人本金可能受损Ⅳ．取市场真实数据比较基金与定期存款收益率","options":[{"key":"A","text":"Ⅰ、Ⅱ"},{"key":"B","text":"Ⅲ"},{"key":"C","text":"Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅲ、Ⅳ"}],"answer":"B","explain":"货币市场基金的宣传推介不得保本保收益，也不得与定期存款收益率作比较，只有提示本金可能受损的表述正确，故应选Ⅲ。","chapter":"货币基金宣传推介","disputed":false,"source":{"title":"2024年5月基金从业《基金法律法规》考点+真题解析：货币市场基金宣传推介的规定-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202407/01114805658106.html"}},{"id":"k1-0118","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"关于基金宣传推介材料的内容，以下表述合规的是()。","options":[{"key":"A","text":"A基金只募集一天，欲购从速"},{"key":"B","text":"货币基金主要投资银行存款，基本没风险"},{"key":"C","text":"A基金为保障持有人利益限定募集规模，不超过30亿元"},{"key":"D","text":"A基金分红后，净值归1，申购良机"}],"answer":"B","explain":"四个选项中只有B属于对产品投资方向和风险特征的一般性说明。「欲购从速」是片面强调集中营销时间限制的表述，以限定募集规模作为卖点、以分红后净值归1作为申购理由，都属于不当宣传。","chapter":"基金宣传推介内容","disputed":false,"source":{"title":"2024年5月基金从业法律法规真题及答案11-20题-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/12122616474476.html"}},{"id":"k1-0119","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"下列机构中不可以办理开放式基金份额登记业务的有()。I.基金管理人II.基金托管人III.中国证券登记结算有限责任公司IV.第三方独立销售机构","options":[{"key":"A","text":"II、III"},{"key":"B","text":"II、IV"},{"key":"C","text":"I、III"},{"key":"D","text":"III、IV"}],"answer":"B","explain":"开放式基金份额登记业务可由基金管理人自行办理，也可委托中国证券登记结算公司等机构办理。基金托管人和第三方独立销售机构不得办理份额登记，故Ⅱ、Ⅳ。","chapter":"基金份额登记机构","disputed":false,"source":{"title":"2024年5月基金从业法律法规真题及答案11-20题-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/12122616474476.html"}},{"id":"k1-0120","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"基金管理公司董事会审议事项中必须经2/3以上独立董事通过的是(）I、公司审计事务II、基金审计事务II、公司年度报告IV、基金年度报告","options":[{"key":"A","text":"I、II、III"},{"key":"B","text":"I、II、IV"},{"key":"C","text":"I、III"},{"key":"D","text":"II、IV"}],"answer":"B","explain":"须经2/3以上独立董事通过的事项包括公司审计事务、基金审计事务和基金年度报告。公司年度报告不在必须由2/3以上独立董事通过的范围之内，故Ⅰ、Ⅱ、Ⅳ。","chapter":"独立董事审议事项","disputed":false,"source":{"title":"2024年5月基金从业《基金法律法规》考点+真题解析：相关方的权利和义务-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202407/08141916271382.html"}},{"id":"k1-0121","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"关于基金销售机构，以下表述正确的是()。","options":[{"key":"A","text":"商业银行均可以销售基金"},{"key":"B","text":"保险公司只能销售保险资管公司发行的基金"},{"key":"C","text":"基金管理公司可以开展直销业务"},{"key":"D","text":"资产规模低于200亿元的证券公司不能销售基金"}],"answer":"B","explain":"保险公司开展基金销售须取得相应资格，销售范围限于保险资产管理公司发行的基金产品。商业银行并非均具备基金销售资格，证券公司也不以资产规模作为能否销售基金的门槛，A、D的绝对化表述错误。","chapter":"基金销售机构范围","disputed":false,"source":{"title":"2024年5月基金从业法律法规真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/12142141993121.html"}},{"id":"k1-0122","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"银行大堂经理陆经理在进行产品销售前，先对客户李先生进行风险评估，再根据李先生的投资风险承受能力推荐不同风险等级的产品，符合基金销售()要求。","options":[{"key":"A","text":"适用性"},{"key":"B","text":"风控性"},{"key":"C","text":"持续性"},{"key":"D","text":"专业性"}],"answer":"A","explain":"先对投资者进行风险承受能力评估、再推荐风险等级相匹配的产品，体现的是基金销售的适用性要求。持续性和专业性分别强调服务过程的延续与人员专业能力。","chapter":"基金销售适用性","disputed":false,"source":{"title":"2024年5月基金从业法律法规真题及答案21-30题-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/12122725402169.html"}},{"id":"k1-0123","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"客户身份资料自业务关系结束当年起至少保存____年，与销售业务有关的其他资料自业务发生当年起至少保存____年。()","options":[{"key":"A","text":"5;5"},{"key":"B","text":"10;5"},{"key":"C","text":"10;10"},{"key":"D","text":"15;15"}],"answer":"D","explain":"基金销售机构应当妥善保管客户身份资料和与销售业务有关的其他资料，按规定两者的保存期限均不少于15年，5年、10年的选项期限不足。","chapter":"销售资料保存期限","disputed":false,"source":{"title":"2024年5月基金从业法律法规真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/12142141993121.html"}},{"id":"k1-0124","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"沪、深证券投资基金账户不能参与的投资为（）。","options":[{"key":"A","text":"证券公司代销的开放式基金认购"},{"key":"B","text":"ETF基金场内现金认购"},{"key":"C","text":"封闭式基金(网上发售)认购"},{"key":"D","text":"ETF基金证券认购"}],"answer":"D","explain":"沪、深证券投资基金账户只能用于基金相关业务，ETF的证券认购需要交付成分股股票，必须使用证券账户而非基金账户。场内现金认购、证券公司代销的开放式基金认购、封闭式基金网上认购均可通过基金账户办理。","chapter":"证券投资基金账户","disputed":false,"source":{"title":"2024年5月基金从业法律法规真题及答案21-30题-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/12122725402169.html"}},{"id":"k1-0125","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"交易双方达成一笔银行间债券回购业务，在回购到期日，正回购方因资金不足无法支付到期款项，该风险属于()。","options":[{"key":"A","text":"信用风险"},{"key":"B","text":"流动性风险"},{"key":"C","text":"市场风险"},{"key":"D","text":"利率风险"}],"answer":"B","explain":"正回购方到期因资金不足无法支付购回款项，反映的是资金调度和变现能力不足，属于流动性风险。市场风险和利率风险源于价格与利率变动，信用风险则着重交易对手的信用状况与违约可能。","chapter":"债券回购风险类型","disputed":false,"source":{"title":"2024年5月基金从业法律法规真题及答案31-40题-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/12142141993121.html"}},{"id":"k1-0126","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"基金托管人召集基金份额持有人大会的，应至少提前（）日公告大会的召开时间、会议形式、审议事项、议事程序和表决方式等事项。","options":[{"key":"A","text":"7"},{"key":"B","text":"30"},{"key":"C","text":"60"},{"key":"D","text":"90"}],"answer":"B","explain":"基金托管人召集基金份额持有人大会，同样应当至少提前30日公告大会的召开时间、会议形式、审议事项、议事程序和表决方式等事项。","chapter":"持有人大会公告期限","disputed":true,"source":{"title":"2024年5月基金从业《基金法律法规》考点+真题解析：基金份额持有人大会-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/22151313172384.html"}},{"id":"k1-0127","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"基金管理人应当在基金中期报告和基金年度报告中披露从基金财产中计提的相关费用，以下费用无需披露（）。","options":[{"key":"A","text":"托管费"},{"key":"B","text":"客户维护费"},{"key":"C","text":"管理费"},{"key":"D","text":"广告费"}],"answer":"D","explain":"基金管理人应在中期报告和年度报告中披露从基金财产中计提的管理费、托管费、客户维护费等费用。广告费属于管理人自行承担的营销支出，无需在基金报告中披露。","chapter":"中期年度报告披露","disputed":false,"source":{"title":"2024年5月基金从业《基金法律法规》考点+真题解析：基金销售费用具体规范-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202405/23152820222374.html"}},{"id":"k1-0128","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"2024年5月","type":"single","stem":"私募股权投资基金管理人应当在私募股权基金募集完毕后()个工作日内，通过私募基金登记备案系统进行备案。","options":[{"key":"A","text":"5"},{"key":"B","text":"60"},{"key":"C","text":"10"},{"key":"D","text":"20"}],"answer":"D","explain":"私募股权 道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"2014年12月8日，ZT证券收到私募证券投资基金公司JT基金管理的A基金、B基金参与某上市公司HDKJ公司非公开发行股票申购报价单。2014年12月8日至9日，JT基金凭借已填报HDKJ公司非公开发行股票申购报价单的名义，以向投资者收取高额管理费用为条件，在设置特定对象确认程序的电话上推介A基金。2014年12月9日，A基金完成所有投资者的合同签订，募集资金同日全部到账。2014年12月10日，A基金、B基金备案后正式成立，同日，JT基金收到HDKJ公司和ZT证券的《缴款通知书》和《认购协议》。2014年12月11日，JT基金完成缴款，两只基金报价单的缴款均从A基金财产账户中划出。由于JT基金在询价时提供的两只私募基金名单与实际缴款的A基金账户不符，ZT证券取消了JT基金认购资格。2015年2月13日，中国证券投资基金业协会就上述违规事实对JT基金进行了纪律处分在上述私募基金的募集阶段，JT基金主要的违规行为是（）","options":[{"key":"A","text":"承诺收益"},{"key":"B","text":"提前投资运作认购基金款项"},{"key":"C","text":"公开推介"},{"key":"D","text":"虚假宣传"}],"answer":"D","explain":"JT基金以拟参与申购报价的名义向投资者推介，且提交的基金名单与实际缴款账户不符，构成以不实信息误导投资者的虚假宣传。其推介通过设置特定对象确认程序的电话进行，尚不构成公开推介，故募集阶段的违规定性为虚假宣传。","chapter":"私募基金募集违规","disputed":false,"source":{"title":"2025年基金从业《法律法规》真题冲刺练习（7.21）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202507/21173038200564.html"}},{"id":"k1-0133","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"在宣传销售基金产品时，基金从业人员应当以诚实的态度和合法的方式执业，如实告知投资人可能影响其利益的重要情况，正确向其揭示投资风险不能作出不当承诺或保证，关于基金销售以下表述，不正确的是()。","options":[{"key":"A","text":"基金从业人员对基金产品进行宣传，必须是基金合同和招募说明书的原文表述"},{"key":"B","text":"基金从业人员不得向投资人作出投资不受损失或保证最低收益的承诺"},{"key":"C","text":"基金从业人员分发或公布的基金宣传推介材料应为基金管理机构或基金代销机构统一制作的材料"},{"key":"D","text":"基金从业人员在陈述所推荐基金或同一基金管理人管理的其他基金的过往业绩时，应当客观、全面、准确"}],"answer":"A","explain":"基金宣传并非必须逐字引用基金合同和招募说明书原文，只要不违背其内容、表述客观准确即可，A的说法不正确。不得承诺保本保收益、材料须由机构统一制作、过往业绩陈述应客观全面，都是正确要求。","chapter":"基金宣传推介规范","disputed":false,"source":{"title":"2025年基金从业《法律法规》真题冲刺练习（7.17）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202507/17165537817238.html"}},{"id":"k1-0134","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"下列关于基金份额持有人大会召开的说法，不正确的是（）。","options":[{"key":"A","text":"每一基金份额具有一票表决权，基金份额持有人可以委托代理人出席基金份额持有人大会并行使表决权"},{"key":"B","text":"基金份额持有人大会应当有代表2/3以上基金份额的持有人参加，方可召开"},{"key":"C","text":"参加基金份额持有人大会的 t":"科目一","session":"未标注场次","type":"single","stem":"某公募基金管理人拟募集发售一只新的股票型基金。以下宣传推介行为中，不符合告知义务相关要求的是（）。","options":[{"key":"A","text":"根据拟任基金经理的历史业绩情况，通过历史模拟法并结合对市场走势的前瞻分析，预测改基金可能的收益区间和最大回撤区间"},{"key":"B","text":"根据基金合同的相关条款，宣传该基金的投资范围和投资策略"},{"key":"C","text":"根据基金合同的相关条款，提示该基金的费率结构和费率水平"},{"key":"D","text":"根据经基金托管人复核的内外相关数据，按照相关法规规定宣传拟任基金经理所管理的同类基金的历史业绩"}],"answer":"A","explain":"预测基金未来收益区间和最大回撤属于对收益的预测和暗示，不符合告知义务的相关要求。依据合同宣传投资范围与策略、提示费率结构与水平、根据经复核数据客观宣传同类基金历史业绩，均属合规做法。","chapter":"基金宣传告知义务","disputed":false,"source":{"title":"12月基金从业《基金法律法规》真题考点：宣传推介材料业绩登载规范-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202402/29160241952001.html"}},{"id":"k1-0138","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"某资产管理公司拟开展营销活动，销售其管理的私募基金产品，以下行为不合规的是（）。Ⅰ、通过与投资者签订《委托投资协议书》的方式，间接向投资金额不足20万元的投资者募集资金Ⅱ、鼓励员工通过拨打不特定陌生客户电话，推介公司的基金产品Ⅲ、在其网站上用“使投资利润呈现出最大化的奇迹效应”宣传其投资经理Ⅳ、在其网站上设置特定对象确定程序，向已注册的用户定期推送私募基金投资策略报告","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"C","text":"Ⅰ、Ⅲ、"},{"key":"D","text":"Ⅰ、Ⅲ、Ⅳ"}],"answer":"A","explain":"以委托投资协议变相向不足20万元的投资者募集、拨打不特定陌生客户电话推介、使用夸大性宣传语，均明确违反私募基金募集规定；Ⅳ虽设置了特定对象确定程序，但仅凭注册即定期推送投资策略报告仍属变相公开推介，故四项均不合规。","chapter":"私募基金募集禁止","disputed":false,"source":{"title":"2023年基金从业《法律法规》考前真题冲刺练习（6.5）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202306/05100150471052.html"}},{"id":"k1-0139","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"王先生计划投资私募基金，其全部资产包括价值300万元的写字楼，公募基金30万元，银行存款50万元，信托计划200万元，下列表述正确的包括()。Ⅰ王先生资产超过500万元，可以认定为合格投资人Ⅱ若王先生为私募基金从业人员，可以投资任何私募基金Ⅲ若王先生为私募基金从业人员，可以投资其所任职的私募基金公司担任管理人的私募基金Ⅳ王先生金融资产280万元，不能认定为私募基金的合格投资人","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"B","text":"Ⅰ、Ⅱ"},{"key":"C","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅲ、Ⅳ"}],"answer":"D","explain":"王先生的金融资产为公募基金30万元、银行存款50万元、信托计划200万元，合计280万元，未达到300万元门槛，不能认定为合格投资者；从业人员不得投资任何私募基金，但可以投资其任职机构管理的私募基金，故Ⅲ、Ⅳ正确。","chapter":"私募合格投资者","disputed":false,"source":{"title":"2025年基金从业《法律法规》经典真题练习（8.3）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202508/03181322617089.html"}},{"id":"k1-0140","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"以下不属于基金信息披露义务人应当发布基金澄清公告的情形的是（）。","options":[{"key":"A","text":"基金管理人发现有多家媒体报道或转载某只债券面临重大信用风验的不实报道，且基金持仓中含该只债券"},{"key":"B","text":"基金管理人发现被主流媒体频繁曝光的某重污染企业的企业字号与其相同，认为对其品牌和商誉构成不利影响"},{"key":"C","text":"基金管理人发现有媒体发布关于基金管理人面临重大财务危机的不实报道"},{"key":"D","text":"基金管理人发现不法分子冒用其旗下基金的名义，通过微信群、APP客户端等方式骗取投资者资金"}],"answer":"B","explain":"澄清公告适用于媒体报道或市场传闻可能对基金份额持有人权益或基金价格产生误导性影响的情形。仅因被曝光企业的字号与自身相同、担心品牌商誉受影响，不属于应当发布澄清公告的情形。","chapter":"基金澄清公告","disputed":false,"source":{"title":"2023年基金从业《法律法规》考前真题冲刺练习（6.5）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202306/05100150471052.html"}},{"id":"k1-0141","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"材料:某基金公司公开发售一只非发起式开放式基金，基金份额面值为1元，募集期为2018年5月6日至5月29日，合同生效日为2018年6月1日。某投资人投资5万元认购了该基金，认购资金在募集期间产生的利息为15元，其对应的认购费率为1.5%，基金份额面值为1元，则其认购费用及认购份额分别为()","options":[{"key":"A","text":"738.92元和49276.08份"},{"key":"B","text":"750元和50000份"},{"key":"C","text":"750元和50015份"},{"key":"D","text":"738.92元和49261.08份"}],"answer":"A","explain":"净认购金额为50000÷(1+1.5%)≈49261.08元，认购费用为50000与净认购金额之差约738.92元；募集期间产生的利息15元也折算为份额，故认购份额为49261.08+15=49276.08份。","chapter":"基金认购费用计算","disputed":false,"source":{"title":"12月基金从业《基金法律法规》真题考点：基金的认购-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202401/16093533660553.html"}},{"id":"k1-0142","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"材料：某基金公司公开发售一只非发起式开放式基金，基金份额面值为1元，募集期为2018年5月6日至5月29日，合同生效日为2018年6月1日。基金募集期限届满以下哪种情形属于基金募集失败?()","options":[{"key":"A","text":"募集份额总额为2亿份，基金份额持有人人数为300人"},{"key":"B","text":"募集份额总额为10亿份，基金份额持有人人数为150人"},{"key":"C","text":"募集份额总额为3亿份，基金份额持有人人数为250人"},{"key":"D","text":"募集份额总额为2.5亿份，基金份额持有人人数为500人"}],"answer":"B","explain":"基金募集成功的条件是募集份额总额不少于2亿份且基金份额持有人人数不少于200人。B虽有10亿份，但持有人只有150人，未达到人数要求，属于募集失败。","chapter":"基金募集失败情形","disputed":false,"source":{"title":"12月基金从业《基金法律法规》真题考点：基金的募集程序-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202401/15093307255904.html"}},{"id":"k1-0143","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"关于基金管理公司的风险管理，投资者甲认为，风险管理限制了基金的投资，因此会降低基金业绩，损害基金份额持有人利益；投资者乙认为，风险管理只是为了维护基金管理公司股东的利益，对基金份额持有人并没有影响。针对两位投资者的看法，下列判断正确的是()。","options":[{"key":"A","text":"投资者甲的看法错误，投资者乙的看法错误"},{"key":"B","text":"投资者甲的看法错误，投资者乙的看法正确"},{"key":"C","text":"投资者甲的看法正确，投资者乙的看法正确"},{"key":"D","text":"投资者甲的看法正确，投资者乙的看法错误"}],"answer":"A","explain":"风险管理的目的是保护基金份额持有人利益和公司稳健经营，并不必然降低基金业绩，也不是只维护股东利益，两位投资者的看法都不正确，故选A。","chapter":"风险管理意义","disputed":false,"source":{"title":"12月基金从业《基金法律法规》真题考点：风险管理的目标和原则-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202401/19152711728861.html"}},{"id":"k1-0144","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"关于公募基金管理公司基金交易业务控制的主要内容，以下表述正确的是（）。I.公司对基金交易实行集中交易制度，基金经理应直接向交易员下达投资指令II.公司应建立交检测系统、预警系统和交易反馈系统，完善相关的安全设施III.公司应执行公司的交易分配制度，确保不同投资者的利益能够得到公平对待IV.公司应建立完善的交易记录制度，每周核对投资组合列表并存档保管","options":[{"key":"A","text":"I、III"},{"key":"B","text":"II、III"},{"key":"C","text":"II、IV"},{"key":"D","text":"I、II"}],"answer":"B","explain":"基金交易业务控制要求建立交易监测与预警、交易反馈系统，并执行公平的交易分配制度。Ⅰ关于基金经理直接向交易员下达指令、Ⅳ关于每周核对投资组合列表的说法，与集中交易和每日核对的制度要求不符，故Ⅱ、Ⅲ正确。","chapter":"基金交易业务控制","disputed":false,"source":{"title":"12月基金从业《基金法律法规》真题考点：基金交易业务控制的主要内容-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202403/0516095858776.html"}},{"id":"k1-0145","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"中国基金管理公司基金经理甲，利用业余时间在某私募机构兼职提供投资咨询。该情形被发现后，甲声称绝没有泄露基金管理公司投资信息。关于甲的行为，以下表述错误的是（）。","options":[{"key":"A","text":"甲的行为违反了忠诚尽责的职业道德规范"},{"key":"B","text":"甲应家意识到该行为与所在基金管理公司存有利益中突，应主动回避"},{"key":"C","text":"在甲没有泄露基金管理公司投资信息的前提下，甲可以为私募机构提供投资咨询服务"},{"key":"D","text":"甲的行为不符合廉洁公正规范的要求，也违反了竞业禁止的一般规则"}],"answer":"C","explain":"基金从业人员不得在存在利益冲突的其他机构兼职从事营利性活动，为私募机构提供投资咨询本身就违反忠实义务和竞业禁止的一般规则。C以没有泄露公司投资信息为由认为可以兼职，说法错误。","chapter":"从业人员兼职限制","disputed":false,"source":{"title":"2023年基金从业《法律法规》考前真题冲刺练习（6.6）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202306/0616283816233.html"}},{"id":"k1-0146","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"关于基金体现的信托法原理，以下表述错误的是()。","options":[{"key":"A","text":"基金财产独立于基金管理人，基金托管人的固有财产，体现了基金财产作为信托财产的独立性"},{"key":"B","text":"基金管理人因基金财产的管理、运用而取得的财产和收益，不属于基金管理人作为受托人的固有财产"},{"key":"C","text":"基金管理人可在同一证券账户中同时管理固有资金和受托资金，并区分独立账户分别估值核算登记"},{"key":"D","text":"基金财产的债务由基金财产本身承担，基金份额持有人以其出资为限对基金财产的债务承担责任"}],"answer":"C","explain":"基金管理人应当将固有资金与受托管理的基金财产分户管理，不能在同一证券账户中同时运作固有资金和受托资金并混同估值核算，C违反财产独立原则。基金财产独立于管理人和托管人固有财产、受托管理取得的财产不属固有财产、基金债务由基金财产承担，均体现信托法原理。","chapter":"基金信托法原理","disputed":false,"source":{"title":"2025年基金从业《法律法规》经典真题练习（8.13）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202508/13172603754755.html"}},{"id":"k1-0147","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"投资经理王某在调研中得知某上市公司尚未公布的业绩报告中存在显著超越市场预期的内容，于是其个人购买了该公司股票，但未向所在基金管理公司备案。一个月之后，该公司公告了超预期的业绩，王某认为他所在基金管理公司应该重视这家上市公司的投资机会，随后在所在公司交流会议上重点推荐了这家公司。王某的行为已涉嫌()。","options":[{"key":"A","text":"将固有资产和他人财产混同于基金资产进行投资"},{"key":"B","text":"操纵交易价格"},{"key":"C","text":"内幕交易"},{"key":"D","text":"传播虚假信息、扰乱市场秩序"}],"answer":"C","explain":"王某从调研中获知尚未公开的重大业绩信息并据此买入相关股票，属于利用未公开信息进行交易的内幕交易行为；题干并未涉及资产混同、操纵价格或编造虚假信息，故A、B、D均不成立。","chapter":"内幕交易禁止行为","disputed":false,"source":{"title":"2025年基金从业《法律法规》经典真题练习（8.9）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202508/09171949801709.html"}},{"id":"k1-0148","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"关于证券投资基金对证券市场稳定及健康发展的作用，以下表述错误的是（）","options":[{"key":"A","text":"证券投资基金发挥专业理财优势，对公开与非公开信息进行理性分析，推动上市公司完善治理结构"},{"key":"B","text":"证券投资基金管理人形成了规范的制应化投研休系，倡导理性的投资文化"},{"key":"C","text":"不同类型、不同风险与收益特征的证券投资基金成为资本市场不断变革和金融产品不断创新的源泉之一"},{"key":"D","text":"证券投资基金管理人对证券进行深入研究与分析，有利于市场合理定价和资源的合理配置"}],"answer":"A","explain":"基金倡导的是对公开信息的理性分析，内幕信息不属于可以分析利用的信息来源，因此A的表述有悖基金应有的合规底线；B、C、D都是基金对市场稳定与发展的积极作用。","chapter":"基金对证券市场作用","disputed":false,"source":{"title":"12月基金从业《基金法律法规》真题考点：有利于证券市场的稳定和健康发展-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202403/11162018559039.html"}},{"id":"k1-0149","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"某货币基金T日总份额为100亿份，T+1日接受申购3亿份，赎回15亿份，基金转换转出1亿份，转入4亿份。以下说法正确的是（）。","options":[{"key":"A","text":"T+1日触发巨额赎回，管理人认为兑付全部赎回有困难，可以拒绝金额较大的赎回申请"},{"key":"B","text":"T+1日触发巨额赎回，管理人认为有能力兑付全部赎回申请时，可以接受全额赎回"},{"key":"C","text":"T+1日未触发巨额赎回，管理人需接受全额赎回"},{"key":"D","text":"T+1日触发巨额赎回，管理人认为兑付全部赎回有困难，可以暂停赎回"}],"answer":"C","explain":"判定巨额赎回要看净赎回额：赎回15亿加转出1亿，减去申购3亿和转入4亿，净赎回为9亿份，未超过上日总份额100亿份的10%，故未触发巨额赎回，管理人应全额办理赎回。","chapter":"巨额赎回认定标准","disputed":false,"source":{"title":"6月基金从业《基金法律法规》真题考点：巨额赎回的认定及处理-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202306/30160606123679.html"}},{"id":"k1-0150","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"关于开放式基金份额登记，表述错误的是（）。","options":[{"key":"A","text":"对于投资者T日的申购和赎回申请，注册登记机构根据T+1日的基金份额净值进行确认处理"},{"key":"B","text":"注册登记机构完成对基金份额持有人的基金份额登记后需将登记数据发送至基金托管人"},{"key":"C","text":"基金份额申购和赎回的资金清算是注册登记机构根据确认的投资者申购和赎回数据信息进行的"},{"key":"D","text":"基金管理人应当自收到投资者的申购、赎回申请之日起3个工作日内，对该申购、赎回申请的有效性进行确认"}],"answer":"A","explain":"投资者T日提出的申购赎回申请应按T日的基金份额净值计算，T+1日只是登记机构的确认处理时点，故A的表述错误；B、C、D符合份额登记与资金清算的规定。","chapter":"开放式基金份额登记","disputed":false,"source":{"title":"6月基金从业《基金法律法规》真题考点：基金份额登记流程-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202308/21092805560481.html"}},{"id":"k1-0151","subject":"k1","subjectName":"基金法律 ,"subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"关于基金从业人员职业道德规范中的专业审慎，以下表述正确的是()。Ⅰ.基金管理公司的公司财务人员应具备基金会计知识和分析能力Ⅱ.基金管理公司的基金销售人员应具备相关销售知识和执业能力Ⅲ.基金管理公司的基金经理应具备相关投资管理能力和投资经验Ⅳ.基金管理公司的监察稽核人员应理解并能够应用相关法律法规","options":[{"key":"A","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"B","text":"Ⅱ、Ⅲ"},{"key":"C","text":"Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅳ"}],"answer":"D","explain":"专业审慎要求各岗位人员具备与职责匹配的专业知识和胜任能力：财务人员要懂基金会计、销售人员要有销售知识与执业能力、监察稽核人员要通晓法规；基金经理的投资经验另由任职资格规定，故选D。","chapter":"专业审慎职业道德","disputed":false,"source":{"title":"2025年基金从业《法律法规》真题冲刺练习（7.14）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202507/14165052796950.html"}},{"id":"k1-0170","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"下列符合封闭式基金上市交易条件的是（）。","options":[{"key":"A","text":"基金合同期限为3年，基金募集金额为4.5亿元，基金份额持有人为900人"},{"key":"B","text":"基金合同期限为5年，基金募集金额为4.5亿元，基金份额特有人为900人"},{"key":"C","text":"基金合同期限为3年，基金募集金额为2.5亿元，基金份额持有人为1500人"},{"key":"D","text":"基金合同期很为5年，基金募集金额为2.5亿元，基金份额持有人为1500人"}],"answer":"D","explain":"封闭式基金上市需同时满足合同期限5年以上、募集金额不低于2亿元、持有人不少于1000人，只有D三项条件全部达标。","chapter":"封闭式基金上市条件","disputed":false,"source":{"title":"2025年基金从业《法律法规》真题冲刺练习（7.24）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202507/24174746947376.html"}},{"id":"k1-0171","subject":"k1","subjectName":"基金法律法规、职业道德与业务规范","subjectShort":"科目一","session":"未标注场次","type":"single","stem":"关于金融与居民理财，下列说法错误的是()。","options":[{"key":"A","text":"所谓金融,简单来讲即货币资金的融通,而货币资金的来源为居民(包括个人和企业)从事的生产活动"},{"key":"B","text":"居民的消费、储蓄与投资意愿跟金融市场的表现关联度较低"},{"key":"C","text":"居民理财的主要方式是货币储蓄与投资两类"},{"key":"D","text":"在生产经营活动中，收入产生盈余的居民希望将他们的货币盈余使用出去，以获得更多的回报，因此产生理财的需求"}],"answer":"B","explain":"居民的消费、储蓄和投资意愿与金融市场表现密切相关，市场涨跌会直接影响其资产配置行为，故B表述错误；A、C、D符合金融与理财的基本关系。","chapter":"金融与居民理财","disputed":false,"source":{"title":"2025年基金从业《法律法规》真题冲刺练习（7.13）-基金从业-233网校","url":"https://www.233.com/jjcy/jichu/zhenti/202507/13164933932568.html"}},{"id":"k1-0172","subject":"k1","subjectName":"基金
