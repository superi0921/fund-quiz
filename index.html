ectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"以下分配方式符合合伙型股权投资基金“瀑布式收益分配体系”的是()。","options":[{"key":"A","text":"按照约定门槛收益率，先分配门槛收益给所有合伙人，然后返还本金，分配超额收益"},{"key":"B","text":"先向有限合伙人返还本金和门槛收益，然后向普通合伙人返还本金，分配超额收益"},{"key":"C","text":"按照约定门槛收益率，先分配门槛收益给有限合伙人，再返还本金，然后向普通合伙人返还本金和分配超额收益"},{"key":"D","text":"先向所有合伙人返还本金，再按照约定门槛收益率向所有合伙人分配门槛收益，然后分配超额收益"}],"answer":"D","explain":"瀑布式收益分配体系的顺序是：先向所有合伙人返还出资本金，再按约定的门槛收益率向全体合伙人分配门槛收益，最后在投资者与管理人之间分配超额收益（管理人可提取业绩报酬），故选D。A、C把门槛收益放在返还本金之前，B对普通合伙人与有限合伙人区别对待，都不符合该体系。","chapter":"瀑布式收益分配","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.13）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/13151306407049.html"}},{"id":"k3-0133","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某公司拟申请私募股权投资基金管理人登记，下述拟聘人员符合基金管理人登记要求的是（）","options":[{"key":"A","text":"拟聘风控总监，入职后同时在律师事务所挂职律师，具有基金从业资格"},{"key":"B","text":"拟聘投资总监，曾在一家知名的股权投资基金机构专门从事生物医药投资5年，即将取得基金从业资格"},{"key":"C","text":"拟聘总经理兼法定代表人，具有股权投资基金业行业10年以上的投资工作经验，具有基金从业资格"},{"key":"D","text":"拟聘行政专员，入职后同时在另一家国有企业负责人力管理工资，具有基金从业资格"}],"answer":"C","explain":"拟任总经理兼法定代表人具有十年以上股权投资行业投资经验并已取得基金从业资格，符合管理人登记对高管人员的要求，C正确。风控总监在律师事务所挂职、行政专员在外单位任职均存在兼职冲突；B项人员尚未取得基金从业资格，不符合要求。","chapter":"管理人人员要求","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第九章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/13000000123.html"}},{"id":"k3-0134","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"以下分配方式符合合伙型股权投资基企“瀑布式收益分配体系”的是（）","options":[{"key":"A","text":"按照约定门槛收益率，先分配门槛收益给所有合伙人，然后返还本金，分配超额收益"},{"key":"B","text":"先向有限合伙人返还本金和门槛收益，然后向普通合伙人返还本金，分配超额收益"},{"key":"C","text":"按照约定门槛收益率，先分配门槛收益给有限合伙人，再返还本金，然后向普通合伙人返还本金和分配超额收益"},{"key":"D","text":"先问所有合伙人返还本金，再按照约定门槛收益率向所有合伙人分配门槛收益，然后分配超额收益"}],"answer":"D","explain":"瀑布式收益分配的顺序为先向所有合伙人返还本金，再按约定门槛收益率向全体合伙人分配门槛收益，然后分配超额收益，故选D。先分门槛收益、只向有限合伙人返本、或对普通合伙人另行安排的顺序，都不符合该分配体系。","chapter" :"C","text":"300"},{"key":"D","text":"765"}],"answer":"C","explain":"基金A按持股比例认购10%×1000=100股；基金B按持股占除创始人外股东持股的比例认购，即15%÷（10%+15%）×1000=600股。两者合计认购700股，剩余1000-700=300股，故选C。275股、750股、765股均源于行使规则或基数取值的错误。","chapter":"优先认购权计算","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.10）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/10111358785893.html"}},{"id":"k3-0138","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某股权投资基金管理人发行了一只信托（契约）型基金，在基金运作期间，发生了触发基金合同终止的情形，经基金份额持有人、基金管理人、基金托管人协商一致决定于T日进入基金清算期，则基金管理人应当（）","options":[{"key":"A","text":"在5个工作日内向中国证券投资基金业协会报告"},{"key":"B","text":"在当年度结束之日起20个工作日内向中国证券投资基金协会报告"},{"key":"C","text":"在10个工作日内向中国证券投资基金协会报告"},{"key":"D","text":"在当季度结束之日起10个工作日内向中国证券投资基金协会报告"}],"answer":"A","explain":"基金发生触发基金合同终止、进入清算程序的情形，管理人应当在5个工作日内向中国证券投资基金业协会报告，故选A。10个工作日、20个工作日及按季度报告的口径与本情形规定的报告时限不符。","chapter":"基金清算报告义务","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第十章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/14000000586.html"}},{"id":"k3-0139","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于信托（契约）型股权投资基金，以下表述错误的是（）","options":[{"key":"A","text":"除基金合同另有约定外，每份基金份额应具有同等权益"},{"key":"B","text":"通常情况下基金份额的转让只涉及出让方、受让方及基金管理人，按照基金合同的约定办理转让手续即可"},{"key":"C","text":"由基金管理人在市场监督管理部门办理工商登记，基金权益登记事项可由基金管理人自行办理，也可以委托持牌的基金服务机构办理"},{"key":"D","text":"基金的清算由基金清算小组负责，清算小组由基金管理人，托管人及相关中介服务机构组成"}],"answer":"C","explain":"信托（契约）型基金不具有市场主体资格，不需要也不应当在市场监督管理部门办理工商登记，基金权益登记由管理人自行办理或委托基金服务机构办理，C表述错误。份额权益平等、份额转让仅涉及出让方、受让方与管理人、清算由清算小组负责，A、B、D正确。","chapter":"契约型基金特点","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第八章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/13000000790.html"}},{"id":"k3-0140","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金行业自律与政府监管，表述错误的是()。","options":[{"key":"A","text":"行业自律除了依据国家的有关法律，法规，规章和政策外，还依据行业自律组织制定的章程，业务规定，细则"},{"key":"B","text":"政府监管带有行政管理的性质，而行业自律是行业的自我约束"},{"key":"C","text":"政府监管机构可以对违法的市场主体采取责令改正，监管会话，出具警示函，公开谴责等行政监管措施和行政处罚"},{"key":"D","text":"由政府监管机构和基金管理人，市场服务机构共同成立的行业协会是股权投资基金的自律组织"}],"answer":"D","explain":"股权投资基金的自律组织是由行业内的基金管理人、市场服务机构等自愿组成的行业协会，并非由政府监管机构与基金管理人共同成立，D表述错误。行业自律依据法律法规和自律组织章程及业务规则，属于自我约束，与带行政管理性质的政府监管不同，A、B、C正确。","chapter":"行业自律与政府监管","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第二章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11163023404.html"}},{"id":"k3-0141","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资母基金A近期完成两项投资，一是认购了半年前已工商设立但仍在募集期的股权投资基金B的份额，二是购买了4年前设立的股权投资基金C所持有的全部投资组合。关于前述业务，以下表述错误的是()。Ⅰ.对基金B的投资属于母基金的一级投资业务Ⅱ.对基金C投资组合的投资属于母基金的直接投资业务Ⅲ.母基金A在投资后成为基金B的出资人Ⅳ.母基金A在投资后成为基金C的出资人","options":[{"key":"A","text":"Ⅰ、Ⅲ"},{"key":"B","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅱ、Ⅳ"},{"key":"D","text":"Ⅱ、Ⅲ"}],"answer":"C","explain":"认购尚在募集期的基金B份额属于母基金的一级投资业务，母基金由此成为基金B的出资人，Ⅰ、Ⅲ正确。购买基金C持有的全部投资组合属于二级投资（二手份额/资产组合）业务而非直接投资，且母基金取得的是该组合资产权益，并不因此成为基金C的出资人，Ⅱ、Ⅳ错误，故选C。","chapter":"母基金业务分类","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第三章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11164052665.html"}},{"id":"k3-0142","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金A现拟对目标公司B进行法律尽职调查，以下表述正确的是（）。","options":[{"key":"A","text":"法律尽职调查的作用是帮助基金A评估公司B资产和业务的合法性及潜在的法律风险"},{"key":"B","text":"基金A的尽职调查人员在法律尽职调查中需要发现并分析公司B业务各方面问题"},{"key":"C","text":"法律尽职调查人员可以针对公司B的调查工作出具最终法律意见，但不能作为准备交易文件的重要依据"},{"key":"D","text":"基于法律尽职调查所需的专业角度，基金A必须聘请职业的外部律师团队进行尽职调查工作"}],"answer":"A","explain":"法律尽职调查的作用是帮助基金评估目标公司资产和业务的合法性及潜在法律风险，A正确。法律尽调聚焦法律风险而非业务各方面问题；法律意见可作为准备交易文件的重要依据；基金也可以由内部团队开展法律尽调，并非必须聘请外部律师，B、C、D错误。","chapter":"法律尽职调查作用","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.26）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/26155427310402.html"}},{"id":"k3-0143","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金的核算，以下表述错误的是（）","options":[{"key":"A","text":"基全管理人应当对各基金独立建账、独立核算，保证不同基金在名额登记、账户设置、资金拨付、账簿记录等方面相互独立"},{"key":"B","text":"股权投资基金会计核算工作的核算主体为基金，会计责任主体为基金管理人"},{"key":"C","text":"股权投资基金在运作过程中，可能发生的费用（包括但不限于管理费、托管费、与基金运作相关的）应由基金管理人承担"},{"key":"D","text":"基金托管人对基金管理人编制的财务报告的相关内容负有复核义务"}],"answer":"C","explain":"基金管理费、托管费以及基金运作过程中发生的相关费用应由基金财产承担，而不是由基金管理人承担，C表述错误。管理人应对各基金独立建账、独立核算，会计核算主体为基金、会计责任主体为管理人，托管人对财务报告相关内容负有复核义务，A、B、D正确。","chapter":"基金费用核算","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第八章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/13000000790.html"}},{"id":"k3-0144","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于创业投资估值法，表述错误的是()。","options":[{"key":"A","text":"当前股权价值=退出时的股权价值/(1+n×目标收益率)，n为退出时点距离投资时间的年度，目标收益率为年化内部收益率"},{"key":"B","text":"将目标公司退出时的股权价值折算为当前投资时的股权价值时，既可以使用目标回报倍数也可以使用收益率来折算"},{"key":"C","text":"若当前公司有后续轮次的股权融资，则需要估计股权稀释情况，倒推出投资时的持股比例"},{"key":"D","text":"预测目标公司退出时点的股权价值一般使用相对估值法"}],"answer":"A","explain":"将退出时点股权价值折算为当前价值时，应按复利折现，即当前股权价值=退出时股权价值÷（1+目标收益率）的n次方，A中除以（1+n×目标收益率）用的是单利，表述错误。折算可用目标回报倍数或收益率，有后续轮次融资时需考虑稀释并倒推投资时持股比例，退出时点价值一般用相对估值法预测，B、C、D正确。","chapter":"创业投资估值法","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11170419065.html"}},{"id":"k3-0145","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"基金管理人应通过授权控制来控制业务活动的运作,授权控制应当贯穿于管理人经营活动的始终，下列关于授权控制主要内容的表述错误的是（）。","options":[{"key":"A","text":"对已获授权的部门和人员应建立有效的评价和反馈机制"},{"key":"B","text":"所有业务的授权应当采取书面形式，授权书应当明确授权内容和时效"},{"key":"C","text":"股东会、董事会、监事会和管理层应当充分了解和履行各自的职权，建立健全公司授权标准和程序"},{"key":"D","text":"授权要适当，对于已经不适用的授权应当及时修改或者取消"}],"answer":"A","explain":"授权控制的主要内容是：股东会、董事会、监事会和管理层充分了解并履行各自职权、建立健全授权标准和程序；所有业务授权采取书面形式并明确授权内容和时效；授权要适当，已不适用的授权及时修改或取消。A所说的“评价和反馈机制”不属于授权控制的主要内容，故选A。","chapter":"管理人授权控制","disputed":false,"source":{"title":"6月基金从业《私募股权投资》真题考点：管理人内部控制的要素构成-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202307/08110839913336.html"}},{"id":"k3-0146","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金管理人高管及从业人员要求,以下表述正确的是（）。Ⅰ、基金管理人的法定代表人或执行事务合伙人委派代表最近2年内不得因重大违法违规行为受到行业禁入等行政处罚Ⅱ、基金从业人员的资质应当通过证券从业资格考试或者认定的方式取得Ⅲ、管理人应当指定至少1名高级管理人专职担任合规风控负责人Ⅳ、股权投资基金的高管包括总经理、副总经理、合规风控负责人等","options":[{"key":"A","text":"Ⅰ、Ⅳ"},{"key":"B","text":"Ⅲ、Ⅳ"},{"key":"C","text":"Ⅰ、Ⅲ"},{"key":"D","text":"Ⅱ、Ⅲ"}],"answer":"B","explain":"管理人应当指定至少1名高级管理人员专职担任合规风控负责人，高管通常包括总经理、副总经理、合规风控负责人等，Ⅲ、Ⅳ正确，故选B。基金从业人员资质通过基金从业资格考试或认定方式取得，而非证券从业资格考试，Ⅱ错误；对法定代表人的从业限制年限表述为“最近2年”不符合规定的年限要求，Ⅰ错误。","chapter":"管理人高管及从业人员要求","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.22）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/22114906736096.html"}},{"id":"k3-0147","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金为被投资企业提供增值服务，以下表述错误的是（）","options":[{"key":"A","text":"对于发展较为成熟的被投资企业，增值服务侧重在资源导入、兼并收购、上市推动等方面"},{"key":"B","text":"对于早期阶段的被投资企业，增值服务侧重在规范管理、业务开拓、后续再融资等方面"},{"key":"C","text":"主要目的是提升被投资企业的价值，降低投资风险，最终实现投资机构对被投资项目的顺利退出"},{"key":"D","text":"协助被投资企业进行后续再融资工作，以便投资机构能够参与被投资企业的后续轮次融资"}],"answer":"D","explain":"增值服务的后续再融资是协助被投资企业完成融资，而不是为了让投资机构能够参与被投企业的后续轮次融资，D的目的表述错误。成熟企业侧重资源导入、并购和上市推动，早期企业侧重规范管理与再融资，增值服务的总体目的是提升企业价值、降低投资风险并顺利退出，A、B、C正确。","chapter":"增值服务内容","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.4）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/04105616965998.html"}},{"id":"k3-0148","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金管理人与投资者的互动，以下表述不正确的是（）。","options":[{"key":"A","text":"基金运行阶段，就某被投企业参与上市公司重大资产重组事宜，为应对投资者关切，基金管理人及时全面地披露了相应进程"},{"key":"B","text":"基金运行阶段，基金管理人需根据约定的时间和内容要求发布报告"},{"key":"C","text":"基金运行阶段，除发布定期报告外，基金管理人需根据约定召开投资者会议"},{"key":"D","text":"基金募资阶段，投资者可要求充分调研基金管理人历史业绩及核心团队成员从业经历等"}],"answer":"A","explain":"被投企业参与上市公司重大资产重组属于敏感信息，管理人应遵守保密与公平对待投资者的要求，不能以“应对投资者关切”为由及时全面披露交易进程，A表述不正确。按约定发布报告、召开投资者会议，以及募集阶段允许投资者调研管理人历史业绩和团队经历，B、C、D做法正确。","chapter":"管理人与投资者互动","disputed":false,"source":{"title":"12月基金从业《私募股权投资》真题考点：各阶段与投资者互动的重点-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202402/17170451911369.html"}},{"id":"k3-0149","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金所投资项目的上市转让退出，以下表述错误的是（）。","options":[{"key":"A","text":"从退出收益的角度来看，上市转让退出的收益一般要比挂牌转让退出的收益高"},{"key":"B","text":"从退出成本的角度来看，首发上市需要支付给承销商及其他市场服务机构相对较高的费用"},{"key":"C","text":"从退出效率的角度来看，首次公开发行股票并上市不存在限售期"},{"key":"D","text":"从退出风险的角度来看，首发上市后到将所持上市企业的股票卖出期间的股票价格波动会影响到股权投资基金的收益"}],"answer":"C","explain":"首发上市后原股东所持股份通常存在法定或约定的限售期，不能在上市当日全部卖出，故“不存在限售期”错误。上市转让的收益一般高于挂牌转让，也要向承销商等机构支付较高费用，退出期间股价波动还会影响基金实际收益。","chapter":"股权投资基金上市转让退出","disputed":false,"source":{"title":"12月基金从业《私募股权投资》真题考点：项目退出的主要方式-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202402/13165742593734.html"}},{"id":"k3-0150","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"根据资料，回答问题某服权投资基金A拟向合格投资者募集4亿元资金投资于B公司，B公司管理层预期投资当年的净利润不低于1.5亿元。B公司的企业所得税税率为25%，利息每年2000万元，拟采用相对估值法对B公司进行估值。关于企业估值的特点，以下表述错误的是（）","options":[{"key":"A","text":"部分只有在整体中才能体现出其价值"},{"key":"B","text":"整体价值来源于要素的结合方式"},{"key":"C","text":"整体价值只有在运行中才能体现出来"},{"key":"D","text":"整体是各部分的简单相加"}],"answer":"D","explain":"企业估值强调价值整体性：整体价值来自各要素的结合方式，各部分只有在整体中、在运行中才能体现其价值，整体并非各部分的简单相加，故D项错误。","chapter":"企业估值的基本特点","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0151","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"下列股权投资基金投资者中，属于合规投资者的是","options":[{"key":"A","text":"退休的张先生持有200万元银行存款，最近三年年均收入为5万元，现将150万元存款投资于一直股权投资基金"},{"key":"B","text":"拥有1500万元净资产的A公司为其员工所设立的企业年金"},{"key":"C","text":"总资产为1000万元的B公司，现投资200万元于一只股权投资基金"},{"key":"D","text":"银行职员李先生持有500万元银行理财产品，最近三年年均收入为60万元，先投资50万元于一只股权投资基金"}],"answer":"B","explain":"企业年金等养老基金属于当然合格投资者，B项符合。个人需金融资产不低于300万元或近三年年均收入不低于50万元，A、D年均收入不达标；C项用“总资产”而非净资产衡量，且不足1000万元，不合格。","chapter":"合格投资者认定标准","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第九章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/13000000123.html"}},{"id":"k3-0152","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于创业投资基金对中小微企业所提供的融资服务，以下表述错误的是()。","options":[{"key":"A","text":"创业投资基金通过丰富的投后管理手段，提高所投资企业的创业成功概率"},{"key":"B","text":"创业投资基金尝试多种机制来获取项目真实信息，缓和投资者获取企业真实信息难度和成本均较高的情况"},{"key":"C","text":"创业投资基金采取明股实债的创新方式，实现风险和期望收益的均衡匹配"},{"key":"D","text":"创业投资基金是按企业发展阶段开展分阶段投资，且不会要求被投资企业提供担保措施"}],"answer":"C","explain":"“明股实债”本质上是债权性安排，与创业投资基金以股权投资、共担风险的方式服务中小企业不符，C项错误。通过投后管理提高成功率、以多种机制缓解信息不对称、分阶段投资且一般不要求担保，均是其常见做法。","chapter":"创业投资基金中小微企业服务","disputed":false,"source":{"title":"6月基金从业《私募股权投资》真题考点：创业投资基金对解决中小微企业融资问题的贡献-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202307/13150301805233.html"}},{"id":"k3-0153","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于公司型基金、合伙型基金和信托（契约）型基金，以下表述正确的是（）Ⅰ、公司型基金是法人企业、信托（契约）型基金是非法人企业Ⅱ、合伙型基金是法人企业、信托（契约）型基金是非法人企业Ⅲ、公司型基金全体股东承担有限责任、合伙型基金的有限合伙人投资者承担有限责任Ⅳ、合伙型基金按照合伙协议运营基金、信托（契约）型基金有利于避免双重征税","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅱ、Ⅲ"},{"key":"D","text":"Ⅰ、Ⅱ、Ⅲ"}],"answer":"B","explain":"公司型基金是法人企业，合伙型与信托（契约）型基金均非法人企业，故Ⅱ错误、Ⅰ正确；公司型基金股东以出资为限担责，合伙型基金的有限合伙人同样承担有限责任，Ⅲ正确；合伙型基金依合伙协议运营，信托（契约）型基金有利于避免双重征税，Ⅳ正确。","chapter":"股权投资基金组织形式","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.29）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/29164325911679.html"}},{"id":"k3-0154","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于项目退出方式，以下表述错误的是（）。Ⅰ、从退出成本的角度来看，相对于首发上市来说，在场外交易市场挂牌所需费用相对较低Ⅱ、协议转让的退出风险主要表现为由信息不对称所引起的价格不能充分反映被投资企业实际价值的不确定性Ⅲ、从退出效率的角度来看，一般上市转让退出比协议转让的方式效率高Ⅳ、从退出收益的角度来看,一般清算退出的收益较高","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"B","text":"Ⅰ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅲ、Ⅳ"}],"answer":"D","explain":"清算退出是在投资失败时收回残值，收益通常最低，Ⅳ错误；上市转让要经申报审核和限售期，退出效率低于协议转让，Ⅲ错误。场外挂牌费用低于首发（Ⅰ正确），协议转让存在信息不对称导致定价不充分的风险（Ⅱ正确）。","chapter":"股权投资基金退出方式","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.19）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/19152728423736.html"}},{"id":"k3-0155","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于投资协议中的拖售权条款，以下表述错误的是()。","options":[{"key":"A","text":"在多数情形下，拖售权条款会被被投资企业创始股东拒绝，或者对拖售权的行使设置一定的条件"},{"key":"B","text":"拖售权设计的初衷是保障股权投资基金通过被投资企业被第三方并购而成功实现项目退出的权利"},{"key":"C","text":"相比随售权，拖售权赋予股权投资基金更大的权利"},{"key":"D","text":"拖售权是股权投资基金欲强行进入其他股东与第三方的交易，交易价格以其他股东与第三方协商确定的价格为准"}],"answer":"D","explain":"拖售权行使时的交易价格通常由股权投资基金与收购方协商确定，而不是以其他股东与第三方协商的价格为准，故D错误。拖售权旨在保障基金借助并购实现退出，其权利大于随售权，实务中创始股东常对其行使设置条件。","chapter":"投资协议拖售权条款","disputed":false,"source":{"title":"6月基金从业《私募股权投资》真题考点：投资协议主要条款-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202306/27161632889883.html"}},{"id":"k3-0156","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于基金服务机构为防范基金服务业务中的利益冲突和输送，符合要求的（）Ⅰ基金服务机构破产时，基金服务业务所涉及的基金财产和投资者财产属于其破产财产Ⅱ基金服务机构不得以任何形式挪用基金资产Ⅲ基金服务机构可将不同基金财产混同进行管理IV.基金服务机构在任何条件下均可同时担任同一基金的托管人V.基金服务机构应建立严格的防火墙制度与业务隔离制度","options":[{"key":"A","text":"Ⅲ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅱ"},{"key":"C","text":"Ⅱ、Ⅴ"},{"key":"D","text":"Ⅲ、Ⅴ"}],"answer":"C","explain":"基金服务机构不得以任何形式挪用基金资产（Ⅱ），并应建立严格的防火墙与业务隔离制度（Ⅴ）。基金财产和投资者财产不属于其破产财产（Ⅰ错误），不得混同管理（Ⅲ错误），也不得无条件兼任同一基金的托管人（Ⅳ错误）。","chapter":"基金服务机构利益冲突防范","disputed":false,"source":{"title":"2020年基金从业《私募 ":"投资协议拖售权条款","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0160","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于企业自由现金流折现模型，以下表述错误的是（）","options":[{"key":"A","text":"企业自由现金流是指公司在保持正常运营的情况下，可以向股东进行自由分配的现金流"},{"key":"B","text":"企业自由现金流=息税前利润-调整的所得税+折旧+摊销-营运资金的增加+长期经营性负债的增加-长期经营性资产的增加-资本性支出"},{"key":"C","text":"企业自由现金流折现模型估值公式对应的折现率为加权平均资本成本"},{"key":"D","text":"通过企业自由现金流折现模型计算得到的是企业价值"}],"answer":"A","explain":"可以向股东自由分配的现金流是股权自由现金流，企业自由现金流则是可向股东和债权人共同分配的自由现金流，A项张冠李戴。B为其计算公式，C对应折现率为加权平均资本成本，D得到的是企业价值，均正确。","chapter":"企业自由现金流折现模型","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.29）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/29164325911679.html"}},{"id":"k3-0161","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金拟对目标公司进行财务尽职调查，以下表述错误的是（）","options":[{"key":"A","text":"财务尽职调查的分析经常会用到场景分析和敏感分析等方法"},{"key":"B","text":"财务尽职调查应涵盖目标公司的历史经营业绩、未来盈利预测等内容"},{"key":"C","text":"基金的财务尽职调查团队应收集目标公司相关的财务报告进行分析，重点考察目标公司的现金流、盈利及资产事项"},{"key":"D","text":"财务尽职调查与审计同样的重要意义，强调发现目标公司财务收支和会计资料的真实、正确"}],"answer":"D","explain":"财务尽职调查并不像审计那样强调查证财务收支与会计资料的真实正确，而是重在发现企业投资价值与潜在风险、为估值和谈判服务，故D错误；A、B、C均为财务尽调的常规内容。","chapter":"财务尽职调查要点","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0162","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某股权投资基金管理人募集并设立了公司型基金A，基金A尚未在中国证券投资基金业协会完成基金备案，暂未进行基金托管，并聘请了投资顾问对投资提供建议，拟投资新材料、新技术行业初创型企业，则基金管理人在基金募集过程中安排投资人签署风险揭示书时，属于基金A一般风险的是（）","options":[{"key":"A","text":"聘请投资顾问所涉及风险"},{"key":"B","text":"投资标的的风险"},{"key":"C","text":"未在中国证券投资基金业协会备案的风险"},{"key":"D","text":"基金未托管所涉风险"}],"answer":"B","explain":"投资标的本身的风险属于基金的一般风险，B正确。聘请投资顾问、未在协会完成备案、基金未托管都是在特定情形下产生的特殊风险，需在风险揭示书中专门揭示，A、C、D不选。","chapter":"基金风险揭示书内容","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第十章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/14000000586.html"}},{"id":"k3-0163","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权协议转让退出，以下表述正确的是（）I.股权转让方和受让方经初步谈判，可以签署股权转让意向书II.股权回购的发起人可以是股权投资基金、被投资企业原股东和管理层III.股权转让方可以根据保密原则对受让方的尽职调查不予配合IV.股权转让完毕后，不涉及标的公司控制权变化的可以不向工商行政管理部门办理变更登记","options":[{"key":"A","text":"II、IV"},{"key":"B","text":"I、II、IV"},{"key":"C","text":"I、II"},{"key":"D","text":"III、IV"}],"answer":"C","explain":"协议转让通常先签署股权转让意向书（Ⅰ正确），股权回购可由基金、原股东或管理层发起（Ⅱ正确）。受让方尽职调查时转让方应予配合（Ⅲ错误）；股权转让完成后应办理工商变更登记（Ⅳ错误）。","chapter":"股权协议转让退出流程","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第七章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/12000000776.html"}},{"id":"k3-0164","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"有关股权投资基金的投资决策，以下安排相对合理的是()。","options":[{"key":"A","text":"投资决策委员会需由具备丰富投资管理经验的基金管理人担任"},{"key":"B","text":"为保障投资决策的审慎，投资决策须经投资决策委员会一致通过"},{"key":"C","text":"为保障投资决策的效率，投资决策流程可由投资经理或项目小组在项目立项时直接进行投资决策"},{"key":"D","text":"投资决策委员会作为行使投资决策权的重要内部机构，于基金设立时约定其职能，委员组成与变更以及议事项等事项"}],"answer":"A","explain":"投资决策委员会应由具备丰富投资管理经验的人员组成，A项安排合理。投资决策不要求全体一致通过（B错误），投资经理或项目小组无权在立项时直接决策（C错误），其职能、组成与议事规则应在基金合同等文件中明确约定（D表述不准确）。","chapter":"基金投资决策机制","disputed":false,"source":{"title":"12月基金从业《私募股权投资》真题考点：股权投资基金一般投资流程-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202312/3115044195192.html"}},{"id":"k3-0165","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"对于有限合伙型创业投资基金而言，法人合伙人投资于多个符合条件的创业投资企业的，可享受的税收优惠措施有（）。","options":[{"key":"A","text":"不可合并计算其可抵扣的投资额，也不可合并计算其应分得的应纳税所得额"},{"key":"B","text":"不可合并计算其可抵扣的投资额，但可以合并计算其应分得的应纳税所得额"},{"key":"C","text":"可抵扣的投资额和应分得的应纳税所得额都可合并计算"},{"key":"D","text":"可以合并计算其可抵扣的投资额，但不可合并计算其应分的应纳税所得额"}],"answer":"C","explain":"符合条件的法人合伙人投资于多个创业投资企业时，其可抵扣的投资额与应分得的应纳税所得额均可合并计算，从而充分享受投资额抵扣优惠，故选C，其余选项都对合并计算作了限制。","chapter":"创投企业税收优惠","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.28）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/28155921161484.html"}},{"id":"k3-0166","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金清算情形包括()。I.全部投资项目都已经实现退出，但因基金未到存续期，基金管理人决定拟继续投资符合投资条件的项目II.基金合同约定的期限未满，但基金全体合伙人决定提前清算III.基金存续期为7年，现已到期IV.3位初创合伙人中2位离职，按照基金合同约定则触发基金清算条件","options":[{"key":"A","text":"I、III、IV"},{"key":"B","text":"III、IV"},{"key":"C","text":"II、III、IV"},{"key":"D","text":"I、II、III、IV"}],"answer":"C","explain":"Ⅰ项尚有符合投资条件的项目可以继续投资，不属于应当清算的情形；基金合同期限未满但全体合伙人决定提前清算（Ⅱ）、存续期届满（Ⅲ）、触发合同约定的清算条件（Ⅳ）都应安排清算，故选C。","chapter":"基金清算情形","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.9）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/09111200538242.html"}},{"id":"k3-0167","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于增值服务的价值，表述错误的是()。","options":[{"key":"A","text":"增值服务属于投资机构投资后管理的重要组成部分，贯穿于投资后管理的整个环节"},{"key":"B","text":"对于处在不同成长阶段的被投资企业，投资机构对其在投资后管理中参与的程度和侧重点有所不同"},{"key":"C","text":"投资机构提供增值服务的目的主要是完善公司治理结构以满足公司上市要求"},{"key":"D","text":"投资机构提供增值服务，一方面可以协助被投资企业更好的发展，另一方面也可以有效降低投资风险"}],"answer":"C","explain":"增值服务的目的是提升被投资企业价值、降低投资风险并协助其更好发展，而不只是完善治理结构以满足上市要求，C项以偏概全。A、B、D关于增值服务的定位与作用表述正确。","chapter":"投后增值服务价值","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第六章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11171637139.html"}},{"id":"k3-0168","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于锁定期的表述错误的是()","options":[{"key":"A","text":"锁定期分为强制锁定和资源锁定两种"},{"key":"B","text":"强制锁定是根据法律法规或公司章程规定的关于股份锁定的规则"},{"key":"C","text":"锁定期的设置,通常是为了保护中小投资者的利益,防止“内部人”利用信息优势获得不当利益"},{"key":"D","text":"自愿锁定是指在强制锁定的基础上,为了提升投资者信 on":"未标注场次","type":"single","stem":"某股权投资基金A为合伙型基金，合伙协议约定：A基金目标认缴出资额为10亿人民币，主要对境内设立的优质子基金进行投资，子基金的投资方向为新能源领域。A基金向中国证券投资基金业协会备案时，应报送的信息和材料包括（）。Ⅰ.目标认缴出资额Ⅱ.投资方向及基金类别Ⅲ.合伙协议、营业执照正副本复印件Ⅳ.法律意见书","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"C","text":"Ⅰ、Ⅱ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅲ"}],"answer":"A","explain":"基金备案应报送目标认缴出资额、投资方向及基金类别、合伙协议与营业执照复印件等材料，Ⅰ、Ⅱ、Ⅲ正确；法律意见书不是协会备案的必备材料，Ⅳ不选。","chapter":"私募基金备案材料","disputed":false,"source":{"title":"12月基金从业《私募股权投资》真题考点：登记与备案的方式和内容-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202402/10165257184479.html"}},{"id":"k3-0178","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于信托（契约）型股权投资基金的权益登记，以下表述错误的是（）。","options":[{"key":"A","text":"基金投资者持有的基金份额全部退出后，就不再是基金合同的当事人"},{"key":"B","text":"基金管理人可以自行办理基金权益登记事项，也可以委托有资质的基金服务机构代为办理，后者情况下管理人不再承担权益登记相关的职责"},{"key":"C","text":"退出金额由权益登记机构根据最终确定的退出价格计算"},{"key":"D","text":"投资人退出和基金的份额转让均会涉及基金权益登记"}],"answer":"B","explain":"管理人委托基金服务机构办理权益登记，并不免除管理人自身在权益登记事项上的职责，B项“不再承担相关职责”错误。份额全部退出后投资者不再是基金合同当事人、退出金额由登记机构按确定价格计算、退出和转让均涉及权益登记，A、C、D正确。","chapter":"基金权益登记","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.13）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/13140645450769.html"}},{"id":"k3-0179","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于项目跟踪与监控中需要重点关注的管理事项，以下表述错误的是（）","options":[{"key":"A","text":"投资机构凭借自己的经验积累，可以帮助被投资企业构建更为科学的公司战略与业务发展定位"},{"key":"B","text":"企业的经营管理所面临的不同风险是相互联系，共同作用于企业的"},{"key":"C","text":"高效和稳定的股东结构是企业长远健康发展的核心因素"},{"key":"D","text":"公司治理不仅是企业发展和价值增值的重要基础，同时也是保障投资机构投资权益的重要制度安排"}],"answer":"C","explain":"公司治理与管理团队等才是企业长远健康发展的关键，股东结构稳定并非教材所指的核心因素，C项表述不当。A、B、D关于投资机构帮助构建战略、各类风险相互联系以及公司治理作用的表述正确。","chapter":"投后跟踪管理事项","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.19）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/19114407352698.html"}},{"id":"k3-0180","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金A对公司B的投资框架协议存在以下条款：“为保障股权投资基金A的权益，在A实现退出之前，创始人股东甲某应将全部个人工作时间服务于B公司，不得从事其他工作或经营其他公司，B公司核心技术人员在离职后1年内，不得加入与B公司有竞争关系的公司或从事与B公司有竞争关系的业务，”这一条款属于（）","options":[{"key":"A","text":"第一拒绝权条款"},{"key":"B","text":"保护性条款"},{"key":"C","text":"竞业禁止条款"},{"key":"D","text":"保密条款"}],"answer":"C","explain":"该条款既要求创始人股东全职服务于公司，又限制核心技术人员离职后一年内从事竞争业务，属于竞业禁止条款，C正确；其与第一拒绝权、保护性条款、保密条款的含义均不相同。","chapter":"竞业禁止条款","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0181","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金的初步尽职调查与正式尽职调查，以下表述正确的是（）","options":[{"key":"A","text":"初步尽调会聘请外部机构参与完成；正式尽调会由内部投资管理小组完成"},{"key":"B","text":"初步尽调后，与项目方签署投资框架协议；正式尽调后，与项目方签署投资协议"},{"key":"C","text":"初步尽调是对项目进行价值判断，以便立项；正式尽调是对项目进行收益评估"},{"key":"D","text":"初步尽调后，需要提交投资建议书；正式尽调后，由外聘机构提交项目尽调报告"}],"answer":"B","explain":"通常初步尽调后与项目方签署投资框架协议（条款清单），正式尽调完成后签署正式投资协议，B正确。初步尽调多由内部团队完成、正式尽调常聘请外部机构（A错误）；两者都服务于价值与风险评估（C错误）；投资建议书与尽调报告的提交主体表述有误（D错误）。","chapter":"尽职调查工作流程","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0182","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"在已登记的股权投资基金管理人A公司未按照规定向中国证券投资基金业协会报送基金管理人经审计的年度财务报告，对A公司的处罚或措施不包括（）。","options":[{"key":"A","text":"A公司将被要求停止运营其所管理的基金产品"},{"key":"B","text":"如后期A公司相应整改完毕，将至少6个月后才能恢复正常机构公示状态"},{"key":"C","text":"有关A公司新发起设立的基金产品备案申请被暂停受理"},{"key":"D","text":"基金管理人公示平台中对外公示了A公司为“异常机构”"}],"answer":"A","explain":"管理人未按规定报送经审计年度财务报告，协会可将其列为异常机构并对外公示、暂停受理其新设基金的备案申请，整改完成后还需经过一定期限才能恢复正常公示状态，但不会要求其停止运营所管理的基金产品，A项不属于相应措施。","chapter":"管理人信息报送违规","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第十章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11174516114.html"}},{"id":"k3-0183","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金的投资后管理，以下表述错误的是（）","options":[{"key":"A","text":"为避免被投资企业对财务报表进行“调整粉饰”，投资机构应该决定被投资企业的外部审计机构"},{"key":"B","text":"投资机构需定期核查协议条款的执行情况，对执行中存在的重大风险及时采取补救措施"},{"key":"C","text":"投资机构在可能的情况下，应直接参与被投资企业的董事会"},{"key":"D","text":"投资机构可以对被投资企业的管理团队提出改善建议，必要时协助进行管理团队调整"}],"answer":"A","explain":"外部审计机构应由被投资企业依公司治理程序确定，投资机构不宜代为决定，A项表述越位。核查协议条款执行、参与董事会、对管理团队提出改进建议都属于正常的投后管理方式。","chapter":"投后管理方式","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第六章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/12000000488.html"}},{"id":"k3-0184","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于私募基金管理人专业化经营的要求，以下表述错误的是（）。","options":[{"key":"A","text":"同一基金管理人可以兼营私募证证券投资和私募股权投资业务"},{"key":"B","text":"基金管理人应当在经营范围中标明私募基金管理、私募投资基金管理、私募股权投资基金管理、创业投资基金管理体现受托管理私募基金特点的字样"},{"key":"C","text":"基金管理人不得兼营与私募基金无关的业务"},{"key":"D","text":"基金管理人只可备案与本机构已登记业务类型相符的私募基金"}],"answer":"A","explain":"私募基金管理人应专业化经营，同一管理人不得同时兼营私募证券投资与私募股权投资业务，A项错误。经营范围应体现受托管理私募基金特点、不得兼营无关业务、只能备案与已登记业务类型相符的基金，B、C、D均正确。","chapter":"管理人专业化经营","disputed":false,"source":{"title":"12月基金从业《私募股权投资》真题考点：基金管理人原则-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202402/07164809759671.html"}},{"id":"k3-0185","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"新《证券法》关于公司首次公开发行新股及公开发行公司债券的条件，以下表述正确的是()。","options":[{"key":"A","text":"公开发行公司债券，累计债券余额应不超过公司净资产的百分之四十"},{"key":"B","text":"公司首次公开发行新股，最近三年财务会计报告应被出具无保留意见审计报告"},{"key":"C","text":"公司首次公开发行新股，应具有持续盈利能力、财务状况良好"},{"key":"D","text":"公开发行公司债券，最近三年可分配利润之和应足以支付公司债券一年的利息"}],"answer":"D","explain":"D项符合新《证券法》关于公开发行公司债券的条件，即最近三年平均可分配利润足以支付债券一年利息。A项的40%净资产比例上限已被修订删除；C项“持续盈利能力”已改为“持续经营能力”；B项关于审计报告的表述与法条列举的条件不一致。","chapter":"证券发行条件","disputed":false,"source":{"title":"6月基金从业《私募股权投资》真题考点：公司首次公开发行 条款之一"}],"answer":"B","explain":"投资机构以债转股方式投资时，原股东对债权人转股不享有优先认购权，该情形不适用优先认购权，B错误。优先认购权是投资人有权无义务的选择权（A正确），行使时认购价格应与潜在认购方一致（C正确），也是投资框架协议和投资协议中的常见条款（D正确）。","chapter":"优先认购权条款","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.17）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/17141930806748.html"}},{"id":"k3-0195","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某合伙型股权投资基金从事的下述活动中符合法律、法规及中国证券投资基金业协会自律规则的是（）","options":[{"key":"A","text":"基金未进行托管，并通过设立一个特殊目的载体投资于某拟在海外上市的医药公司"},{"key":"B","text":"在合伙协议中明确基金的投资标的为不低于80%未上市企业的股权、不高于20%的AAA级公司债劵"},{"key":"C","text":"基金完成备案前,不得以现金管理为目的购买国债"},{"key":"D","text":"基金投资某保理资产的收益权"}],"answer":"B","explain":"合伙协议约定不低于80%投向未上市企业股权、不高于20%投向AAA级公司债券，符合以股权投资为主、少量配置低风险债券的要求，B正确。未托管并借道特殊目的载体投资境外上市医药公司、备案前违规投资、投资保理资产收益权均不符合监管要求。","chapter":"基金投资运作合规","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.31）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/31104222169746.html"}},{"id":"k3-0196","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于项目跟踪与监控的常用指标，以下表述错误的是（）","options":[{"key":"A","text":"主要管理指标包括公司战略与业务定位、公司经营风险控制、公司治理情况等"},{"key":"B","text":"投资机构应从经营、管理、财务等方面跟踪及监控企业的发展"},{"key":"C","text":"主要经营指标包括收入、净利润、增长率等，公司企业价值与这些指标高度负相关"},{"key":"D","text":"主要财务指标包括关键比率分析、财务亏损情况等，投资机构应重点关注财务报表的真实性"}],"answer":"C","explain":"企业价值与收入、净利润、增长率等经营指标高度正相关，C项说成“高度负相关”错误。管理指标涵盖战略定位、风险控制与公司治理（A正确），跟踪应从经营、管理、财务三方面展开（B正确），财务指标要重点关注报表真实性（D正确）。","chapter":"投后跟踪常用指标","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第六章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/12000000488.html"}},{"id":"k3-0197","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"回售权条款带来的股东权利是()。","options":[{"key":"A","text":"当企业执行可能损害投资人利益的重大行为或交易时，应事先获得投资人同意"},{"key":"B","text":"当目标企业发行新股时，投资人可以按原先持有的股份比例优先于新进投资人购买"},{"key":"C","t 性负债的变化，资本性支出因素外，还需考虑的因素是（）","options":[{"key":"A","text":"新增的付息债务，长期经营性资产的变化"},{"key":"B","text":"新增的付息债务，短期经营性资产的变化"},{"key":"C","text":"债务本金偿还，新增的付息债务"},{"key":"D","text":"调整的所得税，长期经营性资产的变化"}],"answer":"D","explain":"FCFF需在息税前利润基础上考虑调整的所得税、折旧摊销、营运资金及长期经营性资产与负债的变化、资本性支出等，故除题干所列因素外还需考虑调整的所得税和长期经营性资产的变化，D正确；付息债务增加与本金偿还属于股权自由现金流的考虑因素。","chapter":"企业自由现金流计算","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0210","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金的收益分配，以下表述正确的是（）。","options":[{"key":"A","text":"收益分配主要在基金的投资者、管理人和第三方服务机构之间进行"},{"key":"B","text":"无论有无相关约定，基金管理人必须先让基金投资者实现门槛收益后才可以获得业绩报酬"},{"key":"C","text":"基金的收入来源之一是投资企业分配的红利"},{"key":"D","text":"股权投资基金从事的是长期投资，且透明性好，收益较高，故基金管理人通常参与基金分配的收益"}],"answer":"C","explain":"基金的收入来源包括所投资企业分配的红利、股权转让所得等，C正确。收益分配主要在投资者与管理人之间进行（A错误）；是否先实现门槛收益再提取业绩报酬依合同约定（B错误）；私募股权基金透明度较低、份额流动性差（D错误）。","chapter":"基金收益分配","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第一章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/10164851915.html"}},{"id":"k3-0211","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"截至2018年9月30日，目标公司A的可比公司B的市盈率倍数为15，此倍数的计算是基于B最近十二个月的净利润，A公司2017年度净利润为3,000万元，其中2017年第四季度完成净利润800万元，2018年前三个季度的净利润是2,800万元，,则A公司的估值是（）。","options":[{"key":"A","text":"4.8亿元"},{"key":"B","text":"4.95亿元"},{"key":"C","text":"4.5亿元"},{"key":"D","text":"5.4亿元"}],"answer":"D","explain":"可比公司市盈率以最近十二个月净利润为基础，A公司该口径净利润为2018年前三季度2800万元加2017年第四季度800万元，共3600万元，乘以15倍得5.4亿元，故选D。","chapter":"相对估值市盈率法","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.25）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/25103040561838.html"}},{"id":"k3-0212","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于法律尽职调查，以下表述错误的是（）。","options":[{"key":"A","text":"法律尽职调查的问题包含历史沿革、主要股东、高级管理人员和重大合同等"},{"key":"B","text":"法律尽职调查有助于评估目标企业资产和业务的合法性及潜在的法律风险"},{"key":"C","text":"股权投资基金投资风险较高，为尽可能降低投资风险，法律尽调是整个尽职调查工作的核心"},{"key":"D","text":"法律尽职调查涉及核查目标企业是否存在欠税和潜在税务处罚问题"}],"answer":"C","explain":"整个尽职调查工作的核心是财务尽职调查，法律尽调侧重合法性与潜在法律风险，C项表述错误。法律尽调关注历史沿革、主要股东与重大合同，评估资产和业务的合法性，并核查欠税与潜在税务处罚风险，A、B、D均正确。","chapter":"法律尽职调查","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.10）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/10143451624931.html"}},{"id":"k3-0213","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金的项目退出是整个投资的关键环节，以下表述错误的是（）","options":[{"key":"A","text":"项目退出的目的是股权投资基金将被投企业的经营和管理权交还原企业创始团队"},{"key":"B","text":"股权投资的最终目标是实现项目的成功退出"},{"key":"C","text":"项目退出的目的是为了实现资本增资，或及时避免和降低损失"},{"key":"D","text":"股权投资基金选择在合适的时机，将被投资企业的股权变现，获得现金收益，实现项目退出"}],"answer":"A","explain":"项目退出的目的是实现资本增值或及时避免和降低损失，而不是把被投企业的经营管理权交还创始团队，A错误。股权投资最终目标是实现项目成功退出、基金选择合适时机将股权变现获得现金收益，B、C、D正确。","chapter":"项目退出目的","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第七章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/12000000776.html"}},{"id":"k3-0214","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于公司型股权投资基金的减资，以下表述错误的是（）。","options":[{"key":"A","text":"减资是指按照法定程序减少公司注册资本金"},{"key":"B","text":"股份有限公司型股权投资基金进行减资，必须经出席股东大会的股东所持表决权的2/3以上通过"},{"key":"C","text":"有限责任公司型股权投资基金进行减资，必须经代表2/3以上表决权的股东通过"},{"key":"D","text":"基金减资应当以不改变出资比例为前提，等比例减少各股东出资"}],"answer":"D","explain":"公司型基金减资并不要求以不改变出资比例为前提，可以等比例减资，也可按约定方式安排，D错误。减资即按法定程序减少注册资本（A正确），股份有限公司与有限责任公司减资均需经2/3以上表决权通过（B、C正确）。","chapter":"公司型基金减资","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.14）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/1414095027784.html"}},{"id":"k3-0215","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某股权 em":"关于折现现金流估值法，表述错误的是()。","options":[{"key":"A","text":"企业自由现金流折现模型得到的是企业价值，可以通过价值等式推出股权价值"},{"key":"B","text":"股权自由现金流是可以自由分配给股权拥有者的最低的现金流"},{"key":"C","text":"红利折现模型不适用于红利发放政策不稳定的目标公司"},{"key":"D","text":"企业自由现金流是指公司在保持正常运营的情况下，可以向出资人(股东和债权人)进行自由分配的现金流"}],"answer":"B","explain":"股权自由现金流是公司可以自由分配给股权拥有者的最大现金流，而非最低，B错误。企业自由现金流折现得到企业价值并可据价值等式推出股权价值（A正确）；红利折现模型不适用于分红政策不稳定的公司（C正确）；企业自由现金流可向股东和债权人分配（D正确）。","chapter":"折现现金流估值模型","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11170419065.html"}},{"id":"k3-0219","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于中国证监会对申请境外直接上市企业的要求，以下表述错误的是()。","options":[{"key":"A","text":"具有规范的法人治理结构及较完善的内部管理制度"},{"key":"B","text":"筹资用途符合国家产业政策、利用外资政策及国家有关固定资产投资立项的规定"},{"key":"C","text":"净资产不低于4亿元人民币"},{"key":"D","text":"过去一年税后利润不少于5000万人民币，并有增长潜力;按照合理市盈率预期，筹资不少于6000万美元"}],"answer":"D","explain":"证监会对境外直接上市的要求是净资产不少于4亿元人民币、过去一年税后利润不少于6000万元人民币并有增长潜力、按合理市盈率预期筹资不少于5000万美元，D项把税后利润与筹资额的表述弄反，错误；A、B、C均符合规定。","chapter":"境外直接上市条件","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第七章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11171954582.html"}},{"id":"k3-0220","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于投资后管理阶段获取被投企业信息的方式，以下表述正确的是（）","options":[{"key":"A","text":"为保障及时了解企业信息，基金管理人全面参与被投企业日常管理"},{"key":"B","text":"通过约定详细的信息报送义务，基金管理人将获取被投企业报告作为取得信息的主要方式"},{"key":"C","text":"基金管理人一般不通过参与企业董事会获得信息"},{"key":"D","text":"为了了解企业日常经营状况，基金管理人定期前往被投企业实地考察"}],"answer":"B","explain":"通过协议约定详细的信息报送义务、以获取被投企业报告作为取得信息的主要方式，是投后管理的常规做法，B正确。基金管理人不全面参与企业日常管理（A错误），可通过董事会获取信息（C错误），实地考察只是补充手段（D不准确）。","chapter":"投后信息获取方式","disputed":true,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.30）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/30103701565213.html"}},{"id":"k3-0221","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金法律尽职调查，以下表述正确的是（）","options":[{"key":"A","text":"法律尽职调查机构需保证目标公司所提供文件资料的真实性、准确性和完整性"},{"key":"B","text":"法律尽职调查的作用是评估目标公司的资产运行情况"},{"key":"C","text":"法律尽职调查的主要内容之一是对目标公司的合法成立进行确认"},{"key":"D","text":"法律尽职调查的功能是关注目标公司的资产及业务往来的合法性，以便发现该公司的价值"}],"answer":"C","explain":"确认目标公司是否合法成立是法律尽职调查的主要内容之一，C正确。尽调机构只对自身核查结论负责，不能保证目标公司提供资料的真实完整（A错误）；资产运行情况属于财务尽调（B错误）；法律尽调关注合法性与法律风险，而非“发现公司价值”（D错误）。","chapter":"法律尽职调查内容","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.28）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/28164132440003.html"}},{"id":"k3-0222","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于政府引导基金的投资方向，以下表述正确的是（）","options":[{"key":"A","text":"一般不具有导向性，往往通过直接对创业企业进行投资获得较高投资收益"},{"key":"B","text":"具有一定的导向性，投资方向限定为公共事业和基金设施投资"},{"key":"C","text":"具有一定的导向性，通常投资于创业投资基金以引导社会资金进入早期创业投资领域"},{"key":"D","text":"不具有导向性，采取纯市场化方式运作，但是由政府财政出资设立"}],"answer":"C","explain":"政府引导基金具有明确的政策导向，通常通过投资创业投资基金来引导社会资金进入早期创业投资领域，C正确；其不以直接投资的较高收益为目的（A错误），投向也不限于公共事业和基础设施（B错误），且并非纯市场化方式运作（D错误）。","chapter":"政府引导基金投向","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第三章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/10170450549.html"}},{"id":"k3-0223","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"以下表述错误的是()。","options":[{"key":"A","text":"公司治理不仅是企业发展和价值增值的重要基础，同时也是保障投资机构投资利益的重要制度安排"},{"key":"B","text":"投资机构凭借自己的经验积累，可以帮助被投资企业构建更为科学的公司战略与业务发展定位"},{"key":"C","text":"企业的经营管理所面临的不同风险是相互联系，共同作用于企业的"},{"key":"D","text":"高效和稳定的股东结构是企业长远健康发展的核心因素"}],"answer":"D","explain":"企业长远健康发展的关键在于治理与管理等因素，股东结构高效稳定并非教材所指的核心因素，D错误。A、B、C关于公司治理的重要作用、投资机构帮助构建战略定位以及各类风险相互联系的表述正确。","chapter":"投后跟踪管理事项","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（6.4）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202306/04104959584643.html"}},{"id":"k3-0224","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于项目退出的主要方式，以下表述正确的是（）。","options":[{"key":"A","text":"从退出成本的角度，协议转让退出的成本一般比上市转让退出的成本高"},{"key":"B","text":"从退出效率的角度，协议转让退出的时间一般比上市转让退出的时间慢"},{"key":"C","text":"从退出风险的角度，上市转让、协议转让的退出都存在比较大的不确定性"},{"key":"D","text":"从退出收益的角度，协议转让退出的收益一般比上市转让退出的收益高"}],"answer":"C","explain":"上市转让与协议转让的退出都存在价格、时间等方面的较大不确定性，C正确。协议转让的成本一般低于上市转让（A错误）、用时比上市转让短（B错误），上市转让的收益一般高于协议转让（D错误）。","chapter":"项目退出方式比较","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.5）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/05105813865962.html"}},{"id":"k3-0225","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于投资后管理阶段获取被投企业信息的方式，以下表述正确的是()。","options":[{"key":"A","text":"为了解企业日常经营状况，基金管理人定期前往被投企业实地考察"},{"key":"B","text":"基金管理人一般不通过参与企业董事会获取信息"},{"key":"C","text":"通过约定详细的信息报送义务，基金管理人将获取被投企业报告作为取得信息的方式"},{"key":"D","text":"为保障及时了解企业信息，基金管理人全面参与被投企业日常管理"}],"answer":"C","explain":"通过约定信息报送义务、以被投企业报告作为取得信息的方式，是投后管理的常规做法，C正确。基金管理人不全面参与企业日常管理（D错误），可通过董事会获取信息（B错误），实地考察属于补充方式（A不准确）。","chapter":"投后信息获取方式","disputed":true,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.13）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/13151306407049.html"}},{"id":"k3-0226","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"基金服务机构在破产或者清算时，以下表述正确的是（）。","options":[{"key":"A","text":"基金服务机构自有财产属于破产或清算财产"},{"key":"B","text":"基金服务业务所涉及的基金产品和投资者财产属于破产或清算财产"},{"key":"C","text":"基金服务业务所涉及的基金财产和投资者财产归属于基金服务机构的自有财产"},{"key":"D","text":"基金服务机构因未对部分基金财产和投资者财产进行分账管理，该部分资产视同清算财产"}],"answer":"A","explain":"基金服务机构破产或清算时，其自有财产属于破产或清算财产，而基金服务业务所涉及的基金财产和投资者财产不属于，A正确；B、C、D都混淆了自有财产与受托管理财产的界限。","chapter":"基金服务机构破产清算","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第八章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/13000000790.html"}},{"id":"k3-0227","subject":"k3","subjectName":"私募股权投资基金基础知识" Ⅳ"},{"key":"D","text":"Ⅲ、Ⅳ"}],"answer":"B","explain":"公司型基金是独立企业法人，应缴纳企业所得税（Ⅱ正确），也可依法发行债券募集资金（Ⅳ正确）。委托第三方管理人管理并不免除投资者在出资范围内的责任（Ⅰ错误）；公司型基金可采取有限责任公司或股份有限公司形式（Ⅲ错误），故选B。","chapter":"公司型基金特征","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第三章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11164052665.html"}},{"id":"k3-0258","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于政府引导基金，表述错误的是()。","options":[{"key":"A","text":"政府引导基金对其投资的创业投资基金所投优秀项目可以跟进投资"},{"key":"B","text":"政府引导基金对历史信用良好的创业投资基金提供融资担保，支持其债权融资"},{"key":"C","text":"政府引导基金是由政府设立并按行政管理方式运作的政府性资金"},{"key":"D","text":"政府引导资金对创业投资基金的投资方式有一定的引导作用"}],"answer":"C","explain":"政府引导基金是政府出资设立、按市场化方式运作的政策性基金，C项说其按行政管理方式运作错误。其可以对所投创投基金投资的优秀项目跟进投资、为历史信用良好的创投基金提供融资担保，并对社会资金投向具有引导作用，A、B、D正确。","chapter":"政府引导基金运作","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第三章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11164052665.html"}},{"id":"k3-0259","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"X药业公司处于高速成长阶段，甲基金拟对X药业公司进行B轮投资，甲基金的业务尽职调查工作应重点关注的事项有()Ⅰ公司管理团队Ⅱ公司已上市产品和储备产品Ⅲ公司的市场环境及发展战略Ⅳ公司的未来上市地选择Ⅴ公司的税收及政府优惠政策","options":[{"key":"A","text":"Ⅰ、Ⅱ、Ⅲ、Ⅴ"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ"},{"key":"C","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅱ、Ⅲ、Ⅴ"}],"answer":"B","explain":"业务尽职调查应重点关注公司管理团队、已上市产品与储备产品、市场环境及发展战略等业务层面事项，Ⅰ、Ⅱ、Ⅲ正确；未来上市地选择、税收及政府优惠政策分别属于法律和财务尽调的关注内容，Ⅳ、Ⅴ不选。","chapter":"业务尽职调查","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11170419065.html"}},{"id":"k3-0260","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"使用简单价值等式对企业价值与股权价值进行转换时，以下表述正确的是（）Ⅰ企业价值是指公司所有出资人，包括股东和债权人，共同拥有的公司运营所产生的价值Ⅱ企业价值+现金=股权价值+债务Ⅲ需要考虑支付利息的负债和不支付利息的负债IV.需要考虑非核心资产","options":[{"key":"A","text":"Ⅱ、Ⅲ"},{"key":"B","text":"Ⅰ、Ⅱ"},{"key":"C","text":"Ⅲ、Ⅳ"},{"key":"D","text":"Ⅰ、Ⅲ"}],"answer":"B","explain":"企业价值是股东和债权人等所有出资人共同拥有的公司运营价值（Ⅰ正确），简单价值等式为企业价值+现金=股权价值+债务（Ⅱ正确）。该等式只考虑需要支付利息的负债（Ⅲ错误），也不考虑非核心资产（Ⅳ错误），故选B。","chapter":"企业价值与股权价值","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0261","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金的出资方式，以下表述错误的是（）","options":[{"key":"A","text":"承诺出资制，即投资者承诺向基金出资的总规模，并按照约定完成其出资行为"},{"key":"B","text":"在股权投资基金实务运作中，更多的实行承诺出资制"},{"key":"C","text":"根据基金合同约定，投资者可以一次或分数次完成其在股权投资基金中的出资义务"},{"key":"D","text":"股权投资基金通常可以接受非货币出资"}],"answer":"D","explain":"股权投资基金实务中主要采用承诺出资制，投资者通常以货币出资，一般不接受非货币出资，D错误。A、B、C关于承诺出资制的含义、实务中的运用以及可以一次或分次完成出资的表述均正确。","chapter":"基金出资方式","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第一章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/10164851915.html"}},{"id":"k3-0262","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"投资基金的退出方式呈现多样化的特点，关于股权投资基金退出方式，以下表达错误的是（）","options":[{"key":"A","text":"上市转让退出的收益一般要比挂牌转让退出的收益高"},{"key":"B","text":"上市转让退出的时间一般要比挂牌转让退出的时间长"},{"key":"C","text":"上市转让退出的收益一般要比协议转让退出的收益高"},{"key":"D","text":"上市转让退出的时间一般要比协议转让退出的时间短"}],"answer":"D","explain":"上市转让需经历改制、申报、审核和限售等环节，退出时间一般比协议转让长，D项说比协议转让短错误。上市转让的收益高于挂牌转让和协议转让（A、C正确），耗时也比挂牌转让长（B正确）。","chapter":"退出方式比较","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（4.25）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202304/25155215531119.html"}},{"id":"k3-0263","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于排他性条款，以下表述错误的是（）。","options":[{"key":"A","text":"投资双方签署该条款后，目标公司在排他期内不得在与其他投资方接触"},{"key":"B","text":"排他性条款成立后，投资方必须保证在排他期结束后投资目标公司"},{"key":"C","text":"排他性条款中规定的排他期可以提前结束"},{"key":"D","text":"排他性条款的设立主要是为了保障股权投资基金与目标公司双方的时间和经济效率"}],"answer":"B","explain":"排他性条款只约束目标公司在排他期内不得与其他投资方接触，并不构成投资方必须投资目标公司的义务，B错误。排他期内目标公司不得接触其他投资方（A正确），排他期可以提前结束（C正确），设立该条款是为保障双方的时间和经济效率（D正确）。","chapter":"投资协议排他性条款","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0264","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金的运营行为，不符合法律法规规定的是（）.","options":[{"key":"A","text":"向投资者承诺在未来某个时间点以事先确定的价格回购基金份额，从而保证投资者实现某一最低收益率"},{"key":"B","text":"向投资者说明基金收益与风险的匹配情况"},{"key":"C","text":"向投资者说明基金承担的主要费用及费率"},{"key":"D","text":"向报资者宣传基金过去六个月的整体历史投资回报率"}],"answer":"A","explain":"向投资者承诺在未来某一时点以事先确定的价格回购基金份额、以保证最低收益率，属于违规的保本保收益承诺，A不符合规定。向投资者说明收益与风险匹配情况、基金主要费用及费率、以及宣传历史投资回报率都属于允许的内容。","chapter":"基金募集禁止行为","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.18）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/1811422650736.html"}},{"id":"k3-0265","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"甲某作为高级管理人员在加入A公司时，已签订了完整的竞业禁止协议。以下未违反竞业禁止条款的行为是（）","options":[{"key":"A","text":"甲在A公司任职期间兼职A公司竞争对手的职位"},{"key":"B","text":"甲离职后劝诱A公司核心技术人员乙某、丙某离职创业"},{"key":"C","text":"甲离职后加入上下游企业任职高级管理人员"},{"key":"D","text":"甲离职后创办的新公司与A公司有竞争关系"}],"answer":"C","explain":"离职后到与A公司构成上下游关系的企业任职，一般不属于竞业禁止所限制的竞争业务，C未违反。任职期间兼职竞争对手职位、离职后劝诱核心技术人员离职创业、创办与A公司有竞争关系的新公司，均违反竞业禁止约定。","chapter":"竞业禁止条款","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.2）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/02105234679300.html"}},{"id":"k3-0266","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金管理人应当于每年度结束之日起20个工作日内，更新基本信息，主要内容包括（）I管理人、股东或合伙人情况II高级管理人员及其他从业人员情况III所管理的股权投资基金情况IV经审计的年度财务报告","options":[{"key":"A","text":"I.II.III"},{"key":"B","text":"I.II.IV"},{"key":"C","text":"II.III.IV"},{"key":"D","text":"I.III.IV"}],"answer":"A","explain":"管理人应在每年度结束之日起20个工作日内更新管理人及股东（合伙人）情况、高级管理人员及其他从业人员情况、所管理的股权投资基金情况等基本信息，Ⅰ、Ⅱ、Ⅲ正确；经审计的年度财务报告属于年度报送内容，不在该20个工作日的更新范围内。","chapter":"管理人信息更新","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第十章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/14000000586.html"}},{"id":"k3-0267","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"股权投资基金A在对某目标公司的投资协议中约定如下：“行使任何股份认购权、期权，或授予或发行任何期权或认股权等任何可能导致将来发行新股或造成投资人在公司的有效股权被稀释或减少的行为，需经投资人同意方能通过”以上条款属于（）","options":[{"key":"A","text":"随售权条款"},{"key":"B","text":"优先认购权条款"},{"key":"C","text":"保护性条款"},{"key":"D","text":"反稀释条款"}],"answer":"C","explain":"该条款约定一切可能导致投资人股权被稀释或减少的行为须经投资人同意方能通过，属于保护性条款，C正确；其与随售权、优先认购权和反稀释条款的含义均不相同。","chapter":"投资协议保护性条款","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0268","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金财产保管机构，说法正确的是()。","options":[{"key":"A","text":"基金财产保管机构对基金财产进行保管，可以免除基金管理人对投资者的受托责任"},{"key":"B","text":"基金财产保管机构承担对基金管理人的投资运作进行监督的责任"},{"key":"C","text":"基金管理人必须聘请基金财产保管机构对基金财产进行保管"},{"key":"D","text":"基金财产保管机构是基金管理人的代理人"}],"answer":"D","explain":"基金财产保管机构是接受基金管理人委托、作为管理人代理人保管基金财产的机构，D正确。其保管并不能免除管理人对投资者的受托责任（A错误），对管理人投资运作进行监督是托管人的职责（B错误），基金并非必须聘请保管机构（C错误）。","chapter":"基金财产保管机构","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第二章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11163023404.html"}},{"id":"k3-0269","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于股权投资基金的尽职调查，以下表述错误的是（）","options":[{"key":"A","text":"尽职调查需要为项目退出方式的评估提供支撑"},{"key":"B","text":"尽职调查帮助投资方判断目标公司是否值得投资，对投资回报的影响不大"},{"key":"C","text":"尽职调查所获得的信息可辅助投资方进行投资协议谈判"},{"key":"D","text":"尽职调查在企业估值中的作用，主要在于获得估值模型所需的真实信息"}],"answer":"B","explain":"尽职调查直接关系投资判断和估值，对投资回报影响很大，B项说影响不大错误。尽职调查为项目退出方式评估提供支撑、辅助投资协议谈判、为估值模型提供真实信息，A、C、D正确。","chapter":"尽职调查的作用","disputed":false,"sour 的说法成立，C正确。管理人不得承诺保本保收益，A错；业绩报酬在门槛收益之后计提，B顺序颠倒；门槛收益率由合同约定而非强制，D错。","chapter":"门槛收益与分配顺序","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第八章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11172331150.html"}},{"id":"k3-0298","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"某地证监局在对辖区内机构进行例行检查时，发现某股权投资基金管理人有重大违法嫌疑，决定进一步采取措施，不符合相关规定的措施是()。","options":[{"key":"A","text":"封存该公司所有财务资料"},{"key":"B","text":"查封该公司所有银行账户"},{"key":"C","text":"暂停该公司证券交易十五个交易日"},{"key":"D","text":"对该公司法人代表进行刑事拘留"}],"answer":"D","explain":"刑事拘留属于司法机关的职权，证监局作为行政监管机构无权对法人代表采取该强制措施，D不符合规定。封存财务资料、查封银行账户、暂停相关证券交易均属证券监管机构可以依法采取的调查或监管措施。","chapter":"行政监管措施权限","disputed":false,"source":{"title":"基金从业《私募投资基金》经典考题回顾第九章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202009/11173349918.html"}},{"id":"k3-0299","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于政府引导基金，以下表述正确的是（）Ⅰ、主要投资于并购基金，以达到招商引资目的Ⅱ、一般是政府设立并以非市场化方式运作Ⅲ、鼓励创业投资基金投资种子期、起步期的企业Ⅳ、投资单支基金比重越小，放大效应越大","options":[{"key":"A","text":"Ⅱ、Ⅳ"},{"key":"B","text":"Ⅰ、Ⅲ"},{"key":"C","text":"Ⅱ、Ⅲ、Ⅳ"},{"key":"D","text":"Ⅲ、Ⅳ"}],"answer":"D","explain":"政府引导基金不以营利为首要目的，主要通过参股创业投资基金引导社会资本投向种子期、起步期企业，且出资占单只基金的比重越小放大效应越明显，Ⅲ、Ⅳ正确。引导基金主要参股创投基金而非并购基金，并按市场化方式运作，Ⅰ、Ⅱ错误。","chapter":"政府引导基金","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（5.21）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202305/21114725225117.html"}},{"id":"k3-0300","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于董事会席位条款，以下表述正确的是（）","options":[{"key":"A","text":"实质是对被投资企业的控制权分配进行约定"},{"key":"B","text":"独立董事的性质决定了其只能由创始人提名"},{"key":"C","text":"董事会观察员不具有投票权，因此有没有观察员席位对投资人来说不重要"},{"key":"D","text":"可约定董事会席位的提名权，但不约定董事会席位总数"}],"answer":"A","explain":"董事会席位条款通过约定席位总数与分配规则，实质是对被投资企业控制权的分配，A正确。独立董事并非只能由创始人提名，B错；观察员虽无投票权，但可列席获取信息并施加影响，对投资人仍有意义，C错；条款通常同时约定席位总数与提名权，D错。","chapter":"董事会席位条款","dispu 4","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于董事会席位条款，以下表述错误的是（）。","options":[{"key":"A","text":"董事会席位条款会约定董事会的席位构成"},{"key":"B","text":"董事会席位条款通常会约定董事会席位分配规则"},{"key":"C","text":"董事会席位条款通常约定董事会席位总数"},{"key":"D","text":"在未获得董事会席位的情况下，股权投资基金委派的观察员通常具有投票权"}],"answer":"D","explain":"观察员席位仅用于列席会议、获取信息，通常不享有投票权，D的说法与事实相反，属错误表述。A、B、C关于董事会席位构成、分配规则和总数约定的表述均符合条款含义。","chapter":"董事会席位条款","disputed":false,"source":{"title":"12月基金从业《私募股权投资》真题考点：董事会席位条款-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202402/15170112345204.html"}},{"id":"k3-0305","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"关于增值税，以下表述正确的是()I.增值税属于流转税II.金融业尚未全面纳入营改增试点范围III.转让非上市公司股权无需缴纳增值税IV.项目上市后通过二级市场退出免征增值税","options":[{"key":"A","text":"I、II"},{"key":"B","text":"I、III"},{"key":"C","text":"I、II、III、IV"},{"key":"D","text":"II、IV"}],"answer":"B","explain":"增值税属于流转税，且转让非上市公司股权不属于增值税征税范围，Ⅰ、Ⅲ正确。金融业已纳入营改增范围，Ⅱ错；项目上市后通过二级市场转让股票属于金融商品转让，应缴纳增值税，Ⅳ错。","chapter":"增值税征税范围","disputed":false,"source":{"title":"2023年基金从业《私募股权投资》考前真题冲刺练习（6.2）-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202306/02104645611728.html"}},{"id":"k3-0306","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"估值调整条款潜在触发条件不包括()","options":[{"key":"A","text":"企业原大股东失去控股地位"},{"key":"B","text":"企业未能在约定时间前实现IPO上市"},{"key":"C","text":"企业高管发生严重违反约定的事件"},{"key":"D","text":"企业在根据估值条款约定的业绩考核截止之日归母净利润达到了业绩承诺，但拒绝对未来三年的业绩进行新的业绩"}],"answer":"D","explain":"估值调整条款的触发条件通常是业绩未达标、未按期实现上市、原大股东失去控股地位或出现严重违约等不利情形；企业达到业绩承诺却拒绝追加未来承诺并不构成约定的触发情形，D正确。","chapter":"估值调整条款","disputed":false,"source":{"title":"2020年基金从业《私募投资基金》真题及答案精选：第五章-基金从业-233网校","url":"https://www.233.com/jjcy/smgq/zhenti/202012/11174115388.html"}},{"id":"k3-0307","subject":"k3","subjectName":"私募股权投资基金基础知识","subjectShort":"科目三","session":"未标注场次","type":"single","stem":"选用相对估值法时，如所选择的可比公司比目标公司的资产负债率高出许多时，如需剔除上述问题所带来的
